// ===================== 10 - Listas de Entradas e Saídas =====================
// Quatro visões: por mês (padrão), só as pendentes (a pagar / a receber, de qualquer data),
// os últimos lançados (para achar o que acabou de cadastrar) e tudo.

const TXT = {
  entrada: { plural: 'Entradas', novo: 'Nova entrada', pago: 'Recebido', pendente: 'A receber', pessoa: 'Recebido de', pagoEm: 'Recebido em', vazio: 'Nenhuma entrada neste período.' },
  saida: { plural: 'Saídas', novo: 'Nova saída', pago: 'Pago', pendente: 'A pagar', pessoa: 'Pago a', pagoEm: 'Pago em', vazio: 'Nenhuma saída neste período.' },
};

function filtrarLancamentos(tipo, meses, f) {
  const set = meses ? new Set(meses) : null;
  const busca = normalizar(f.busca);
  return DB.lancamentos.filter((l) => {
    if (l.tipo !== tipo || !noEscopo(l)) return false;
    if (set && !set.has(l.competencia)) return false;
    if (f.categoriaId !== undefined && f.categoriaId !== '' && (l.categoriaId || '') !== (f.categoriaId || '')) return false;
    if (f.contaId && l.contaId !== f.contaId) return false;
    if (f.status === 'misturado') { if (!ehMisturado(l)) return false; }
    else if (f.status && l.status !== f.status) return false;
    if (busca) {
      const parceiros = (l.divisao || []).map((d) => nomePessoa(d.parceiroId)).join(' ');
      const alvo = normalizar([l.descricao, l.pessoa, l.obs, parceiros, nomeCategoria(l.categoriaId), nomeConta(l.contaId), numeroBR(l.valor)].join(' '));
      if (!busca.split(/\s+/).every((p) => alvo.includes(p))) return false;
    }
    return true;
  });
}
const porDataDesc = (a, b) => (a.data === b.data ? (a.criadoEm < b.criadoEm ? 1 : -1) : a.data < b.data ? 1 : -1);
const porDataAsc = (a, b) => (a.data === b.data ? (a.criadoEm < b.criadoEm ? -1 : 1) : a.data < b.data ? -1 : 1);

function telaLista(tipo, cont) {
  const T = TXT[tipo];
  const f = ESTADO.filtros[tipo];
  const visao = ESTADO.visao[tipo] || 'periodo';
  // Aqui aparece só o mês de referência (o do Painel; normalmente o mês atual).
  // Outros meses, anos, dias e intervalos ficam no Registro de lançamentos, em Configurações.
  const mesRef = ESTADO.periodo.mes || mesAtual();
  const abrirOutros = () => abrirRegistro({ tipo, periodo: { tipo: 'mes', mes: mesRef }, filtros: { ...f }, origem: { aba: tipo === 'entrada' ? 'entradas' : 'saidas', rotulo: T.plural } });
  let itens;
  if (visao === 'periodo') itens = filtrarLancamentos(tipo, [mesRef], f).sort(porDataDesc);
  else if (visao === 'pendentes') itens = filtrarLancamentos(tipo, null, { ...f, status: 'pendente' }).sort(porDataAsc);
  else if (visao === 'recentes') itens = filtrarLancamentos(tipo, null, f).sort((a, b) => (a.atualizadoEm < b.atualizadoEm ? 1 : -1)).slice(0, 100);
  else itens = filtrarLancamentos(tipo, null, f).sort(porDataDesc);
  const total = somar(itens, (l) => l.valor);
  const pago = somar(itens.filter((l) => l.status === 'pago'), (l) => l.valor);

  const visoes = [['periodo', 'Do mês'], ['pendentes', T.pendente], ['recentes', 'Últimos lançados'], ['tudo', 'Tudo']];
  cont.appendChild(el('div', { class: 'barra-filtros' },
    alternador(visoes, visao, (v) => { ESTADO.visao[tipo] = v; ESTADO.limiteLista = 300; renderizar(true); }),
    el('button', { class: 'botao primario', type: 'button', onclick: () => abrirFormLancamento({ tipo }) }, icone('mais', 18), ' ' + T.novo)));
  if (visao === 'periodo') {
    cont.appendChild(el('div', { class: 'barra-filtros mes-referencia' },
      el('strong', { class: 'periodo-rotulo', text: capitalizar(nomeMes(mesRef)) }),
      mesRef !== mesAtual() ? el('button', { class: 'link-botao', type: 'button', text: 'Voltar para o mês atual', onclick: () => { ESTADO.periodo = { tipo: 'mes', mes: mesAtual() }; renderizar(); } }) : null,
      el('div', { class: 'espaco' }),

  }

  // Filtros
  const busca = el('input', { type: 'search', placeholder: 'Buscar por nome, pessoa, valor…', value: f.busca || '', class: 'busca' });
  busca.addEventListener('input', debounce(() => { f.busca = busca.value; renderizarMantendoFoco('.busca'); }, 250));
  const cats = DB.categorias.filter((c) => c.tipo === tipo && (noEscopo(c) || c.escopo === 'A' || DB.config.escopo === 'T'));
  const selCat = seletor([['', 'Todas as categorias'], ...cats.map((c) => [c.id, c.nome])], f.categoriaId || '', { 'aria-label': 'Categoria' });
  selCat.addEventListener('change', () => { f.categoriaId = selCat.value || undefined; renderizar(); });
  const selConta = seletor([['', 'Todas as contas'], ...contasDoEscopo(true).map((c) => [c.id, c.nome])], f.contaId || '', { 'aria-label': 'Conta' });
  selConta.addEventListener('change', () => { f.contaId = selConta.value || undefined; renderizar(); });
  const opcoesStatus = visao === 'pendentes' ? [['', 'Todas']] : [['', 'Todas'], ['pago', T.pago], ['pendente', T.pendente]];
  opcoesStatus.push(['misturado', 'Pessoal e escritório misturados']);
  const selStatus = seletor(opcoesStatus, f.status || '', { 'aria-label': 'Situação' });
  selStatus.addEventListener('change', () => { f.status = selStatus.value || undefined; renderizar(); });
  const temFiltro = f.busca || f.categoriaId !== undefined || f.contaId || f.status;
  cont.appendChild(el('div', { class: 'barra-filtros secundaria' },
    el('div', { class: 'busca-caixa' }, icone('busca', 18), busca), selCat, selConta, selStatus,
    temFiltro ? el('button', { class: 'link-botao', type: 'button', text: 'Limpar filtros', onclick: () => { ESTADO.filtros[tipo] = {}; renderizar(); } }) : null,
    el('div', { class: 'espaco' }),
    el('button', { class: 'botao', type: 'button', title: 'Exportar esta lista para Excel (CSV)', onclick: () => exportarCSV(itens, tipo) }, icone('baixar', 18), el('span', { class: 'some-celular', text: ' Excel' }))));

  // Resumo
  const rotuloTotal = { periodo: 'Total do período', pendentes: 'Total ' + T.pendente.toLowerCase(), recentes: 'Últimos ' + itens.length + ' lançados', tudo: 'Total geral' }[visao];
  const atrasados = itens.filter((l) => l.status === 'pendente' && l.data < hojeISO());
  // Cada total abre o Registro de lançamentos já com este período e estes filtros, para analisar.
  const noRegistro = (status) => () => abrirRegistro({
    tipo, periodo: visao === 'periodo' ? { tipo: 'mes', mes: mesRef } : 'tudo',
    filtros: { ...f, status: status !== undefined ? status : visao === 'pendentes' ? 'pendente' : f.status },
    ordem: visao === 'recentes' ? 'recentes' : visao === 'pendentes' ? 'data-asc' : 'data-desc',
    origem: { aba: tipo === 'entrada' ? 'entradas' : 'saidas', rotulo: T.plural },
  });
  const dica = 'Abrir no Registro de lançamentos, com este período e estes filtros';
  cont.appendChild(el('div', { class: 'grade-tiles compacta' },
    tileNumero({ rotulo: rotuloTotal + (temFiltro ? ' (filtrado)' : ''), classe: tipo, valor: moeda(total), sub: itens.length + (itens.length === 1 ? ' lançamento' : ' lançamentos'), aoClicar: noRegistro(), dica }),
    tileNumero({ rotulo: T.pago, classe: tipo, valor: moeda(pago), aoClicar: noRegistro('pago'), dica }),
    tileNumero({ rotulo: T.pendente, classe: 'pendente', valor: moeda(total - pago), sub: atrasados.length ? atrasados.length + (atrasados.length === 1 ? ' atrasado' : ' atrasados') + ': ' + moeda(somar(atrasados, (l) => l.valor)) : null, aoClicar: noRegistro('pendente'), dica })));

  if (!itens.length) {
    const vazio = { periodo: temFiltro ? 'Nada encontrado com esses filtros.' : T.vazio, pendentes: 'Nada ' + T.pendente.toLowerCase() + '.', recentes: 'Nenhum lançamento ainda.', tudo: 'Nada encontrado.' }[visao];
    cont.appendChild(cartaoVazio(tipo === 'entrada' ? 'entrada' : 'saida', vazio,
      visao === 'periodo' ? 'Lançamento com vencimento em outro mês aparece naquele mês. Para achar qualquer um, use "Últimos lançados" ou "Tudo".' : 'Os lançamentos aparecem aqui.',
      { rotulo: T.novo, fn: () => abrirFormLancamento({ tipo }) }));
    return;
  }

  const limite = ESTADO.limiteLista || 300;
  const lista = el('div', { class: 'lista-lanc cartao' });
  if (visao === 'recentes') {
    lista.appendChild(el('div', { class: 'dia-topo' }, el('span', { text: 'Do mais recente para o mais antigo (inclui os editados)' })));
    for (const l of itens) lista.appendChild(linhaLancamento(l, true));
  } else {
    const porDia = agrupar(itens.slice(0, limite), (l) => l.data);
    for (const [dia, ls] of porDia) {
      const d = parseISO(dia);
      lista.appendChild(el('div', { class: 'dia-topo' },
        el('span', { text: d.getDate() + ' de ' + MESES[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' de ' + d.getFullYear() : '') + ', ' + DIAS_SEMANA[d.getDay()] + (visao === 'pendentes' ? ' · ' + quandoRelativo(dia) : '') }),
        el('span', { class: 'valor', text: moeda(somar(ls, (l) => l.valor)) })));
      for (const l of ls) lista.appendChild(linhaLancamento(l));
    }
  }
  cont.appendChild(lista);
  if (visao !== 'recentes' && itens.length > limite) {
    cont.appendChild(el('button', { class: 'botao largo', type: 'button', text: 'Mostrar mais (' + (itens.length - limite) + ' restantes)', onclick: () => { ESTADO.limiteLista = limite + 300; renderizar(); } }));
  }
}

function renderizarMantendoFoco(seletor_) {
  const pos = document.activeElement && document.activeElement.selectionStart;

  if (e) { e.focus(); if (pos != null) try { e.setSelectionRange(pos, pos); } catch { /* ok */ } }
}

async function excluirLancamento(l) {
  let alvo = [l];
  if (l.grupo) {
    const grupo = DB.lancamentos.filter((x) => x.grupo === l.grupo);
    const seguintes = grupo.filter((x) => x.parcela >= l.parcela);
    const r = await escolher({
      titulo: 'Excluir lançamento repetido', texto: `"${l.descricao || nomeCategoria(l.categoriaId)}" faz parte de uma série de ${grupo.length}.`,
      opcoes: [
        { valor: 'um', rotulo: 'Só este (' + l.parcela + '/' + l.parcelas + ')' },
        { valor: 'seg', rotulo: 'Este e os seguintes', detalhe: seguintes.length + ' lançamentos' },
        { valor: 'todos', rotulo: 'A série inteira', detalhe: grupo.length + ' lançamentos', perigo: true },
      ],
    });
    if (!r) return;
    alvo = r === 'um' ? [l] : r === 'seg' ? seguintes : grupo;
  } else if (!(await confirmar({ titulo: 'Excluir lançamento?', texto: `"${l.descricao || nomeCategoria(l.categoriaId)}", ${moeda(l.valor)}, em ${dataBR(l.data)}.` + (l.divisao && l.divisao.some((d) => d.modo === 'repasse') ? ' Os repasses a parceiros ligados a ela também serão excluídos.' : ''), botao: 'Excluir', perigo: true }))) return;
  const ids = new Set(alvo.map((x) => x.id));
  for (const x of DB.lancamentos) if (x.origemId && ids.has(x.origemId)) ids.add(x.id); // repasses ligados
  const removidos = DB.lancamentos.filter((x) => ids.has(x.id));
  DB.lancamentos = DB.lancamentos.filter((x) => !ids.has(x.id));
  for (const id of ids) registrarExclusao(id);
  mudou();
  avisar(removidos.length === 1 ? 'Lançamento excluído.' : removidos.length + ' lançamentos excluídos.', 'ok', {
    rotulo: 'Desfazer', fn: () => { for (const x of removidos) { delete DB.excluidos[x.id]; carimbar(x); DB.lancamentos.push(x); } mudou(); },
  });
}

function exportarCSV(itens, rotulo) {
  const cab = ['Data (vencimento)', 'Pago/recebido em', 'Tipo', 'Descrição', 'Categoria', 'Conta', 'Pessoal/Escritório', 'Situação', 'Valor', 'Pessoa', 'Forma', 'Parcela', 'Mês de referência', 'Parceiros', 'Observação'];
  const linhas = itens.map((l) => [dataBR(l.data), l.status === 'pago' ? dataBR(dataEfetiva(l)) : '', l.tipo === 'entrada' ? 'Entrada' : l.tipo === 'saida' ? 'Saída' : 'Transferência', l.descricao,
    l.tipo === 'transferencia' ? nomeConta(l.contaDestinoId) : nomeCategoria(l.categoriaId), nomeConta(l.contaId), ESCOPOS[l.escopo],
    l.status === 'pago' ? 'Efetivado' : 'Pendente', numeroBR(l.tipo === 'saida' ? -l.valor : l.valor), l.pessoa, FORMAS[l.forma] || '',
    l.grupo ? l.parcela + '/' + l.parcelas : '', nomeMesCurto(l.competencia),
    (l.divisao || []).map((d) => nomePessoa(d.parceiroId) + ' ' + numeroBR(d.valor) + (d.modo === 'direto' ? ' (direto)' : ' (repasse)')).join('; '), l.obs]);
  const csv = '﻿' + [cab, ...linhas].map((r) => r.map(celulaCSV).join(';')).join('\r\n');
  baixarArquivo(`${rotulo}_${carimboArquivo()}.csv`, csv, 'text/csv;charset=utf-8');
  avisar('Planilha baixada. Atenção: o arquivo CSV não é criptografado.', 'atencao');
}

      corpo: [campo('Nome', nome), campo('Uso', alternador([['P', 'Pessoal'], ['E', 'Escritório'], ['A', 'Ambos']], esc, (v) => { esc = v; }))],

function campoValor(centavos, grande = true) {
  const inp = el('input', { type: 'text', inputmode: 'decimal', class: grande ? 'valor-grande' : '', placeholder: '0,00', autocomplete: 'off', value: centavos ? numeroBR(centavos) : '' });
  const dica = el('span', { class: 'campo-ajuda' });
  const padrao = 'Pode digitar contas: 120+35,50';
  inp.addEventListener('input', () => {
    const v = parseValor(inp.value);
    dica.textContent = /[+\-*/]/.test(inp.value.replace(/^-/, '')) && v != null ? '= ' + moeda(v) : padrao;
  });
  inp.addEventListener('blur', () => {
    const v = parseValor(inp.value);
    if (v != null && v > 0) { inp.value = numeroBR(v); dica.textContent = padrao; }
  });
  dica.textContent = padrao;
  return { inp, dica, ler: () => parseValor(inp.value) };
}

// "50%" vira a porcentagem de "base"; qualquer outra coisa é lida como valor em reais.
function lerValorOuPct(txt, base) {
  const s = String(txt || '').trim();
  const m = s.match(/^(\d+(?:[.,]\d+)?)\s*%$/);
  if (m) return base ? Math.round((base * Number(m[1].replace(',', '.'))) / 100) : null;
  return parseValor(s);
}

// Aplica a divisão proporcionalmente a outro valor (parcela, pagamento parcial).
function escalarDivisao(div, fator) {
  if (!div || !div.length) return undefined;
  const r = div.map((d) => ({ ...d, valor: Math.round(d.valor * fator) })).filter((d) => d.valor > 0);
  return r.length ? r : undefined;
}

function novoParceiroRapido() {

    let criado = null;
    const nome = el('input', { type: 'text', maxlength: 100, placeholder: 'Nome do parceiro ou escritório', autofocus: true });
    const tel = el('input', { type: 'text', maxlength: 40, placeholder: 'Opcional' });
    const m = abrirModal({
      titulo: 'Novo parceiro', largura: '420px', classe: 'modal-pequeno',
      corpo: [campo('Nome', nome), campo('Telefone', tel), el('p', { class: 'nota', text: 'Os demais dados ficam na aba Parceiros.' })],
      rodape: [el('button', { class: 'botao', type: 'button', text: 'Cancelar', onclick: () => m.fechar() }),
        el('button', { class: 'botao primario', type: 'button', text: 'Criar', onclick: () => {

          criado = carimbar({ id: 'p-' + uid(), nome: n, tipo: 'parceiro', telefone: vTexto(tel.value, 40), email: '', documento: '', oab: '', obs: '', arquivada: false }, true);
          if (!DB.pessoas) DB.pessoas = [];
          DB.pessoas.push(criado); mudou(true); m.fechar();

// Bloco "Dividir com parceiros" (entradas). Devolve { elemento, ler(base) -> divisao|erro }.
function blocoDivisao(inicial, aoMudar) {
  const linhas = [];
  const lista = el('div', { class: 'div-linhas' });
  const resumo = el('p', { class: 'nota' });
  const detalhes = el('details', { class: 'bloco-divisao', open: !!(inicial && inicial.length) },
    el('summary', null, icone('pessoa', 16), ' Dividir com parceiros ', el('span', { class: 'texto-suave', text: '(opcional)' })));
  const addLinha = (d) => {
    const sel = el('select', null, [el('option', { value: '', text: 'Escolha o parceiro…' }),
      ...parceirosAtivos().map((p) => el('option', { value: p.id, text: p.nome, selected: d && d.parceiroId === p.id })),
      ...(d && d.parceiroId && !parceirosAtivos().some((p) => p.id === d.parceiroId) ? [el('option', { value: d.parceiroId, text: nomePessoa(d.parceiroId), selected: true })] : []),
      el('option', { value: '__novo', text: '+ Novo parceiro…' })]);
    const val = el('input', { type: 'text', inputmode: 'decimal', placeholder: 'R$ ou %', value: d ? numeroBR(d.valor) : '', class: 'div-valor' });
    let modo = d ? d.modo : 'repasse';
    const alt = alternador([['repasse', 'Eu repasso'], ['direto', 'Recebeu direto']], modo, (v) => { modo = v; aoMudar(); });
    const linha = { sel, val, get modo() { return modo; } };
    const elLinha = el('div', { class: 'div-linha' }, sel, val, alt,
      el('button', { class: 'botao-icone pequeno', type: 'button', 'aria-label': 'Remover', onclick: () => { linhas.splice(linhas.indexOf(linha), 1); elLinha.remove(); aoMudar(); } }, icone('fechar', 16)));
    sel.addEventListener('change', async () => {
      if (sel.value === '__novo') {
        const p = await novoParceiroRapido();
        if (p) sel.insertBefore(el('option', { value: p.id, text: p.nome }), sel.lastChild);
        sel.value = p ? p.id : '';
      }
      aoMudar();
    });
    val.addEventListener('input', debounce(aoMudar, 200));
    linhas.push(linha);
    lista.appendChild(elLinha);
  };
  for (const d of inicial || []) addLinha(d);
  anexar(detalhes, [
    el('p', { class: 'nota', text: '"Eu repasso": o valor todo entrou na sua conta e o senhor paga a parte do parceiro depois (vira uma saída "a pagar"). "Recebeu direto": o parceiro recebeu a parte dele do cliente, e aqui entra só a sua. Use R$ ou % (sobre o valor desta entrada; no parcelado, sobre o total).' }),
    lista,
    el('button', { class: 'link-botao', type: 'button', onclick: () => { addLinha(null); detalhes.open = true; } }, '+ Adicionar parceiro'),
    resumo]);
  return {
    elemento: detalhes,
    ler(base) {
      const r = [];
      for (const l of linhas) {
        if (!l.sel.value || l.sel.value === '__novo') { if (l.val.value.trim()) return { erro: 'Escolha o parceiro em todas as linhas da divisão.' }; continue; }
        const v = lerValorOuPct(l.val.value, base);
        if (!v || v <= 0) return { erro: 'Informe o valor (ou %) de cada parceiro.' };
        r.push({ parceiroId: l.sel.value, valor: v, modo: l.modo });
      }
      return { divisao: r };
    },
    mostrarResumo(base) {
      const { divisao } = this.ler(base);
      if (!divisao || !divisao.length || !base) { resumo.textContent = ''; return; }
      const rep = somar(divisao.filter((d) => d.modo === 'repasse'), (d) => d.valor);
      const dir = somar(divisao.filter((d) => d.modo === 'direto'), (d) => d.valor);
      resumo.textContent = `Honorário total: ${moeda(base + dir)} · parceiros: ${moeda(rep + dir)} · sua parte: ${moeda(base - rep)}.` + (rep > base ? ' Atenção: o repasse é maior que o valor recebido.' : '');
    },
  };
}

    const selRec = seletor([['nao', 'Não repete'], ['parcelado', 'Parcelado'], ['fixo', 'Fixo todo mês']], 'nao');
    const inpN = el('input', { type: 'number', min: 2, max: 120, value: 2, class: 'curto' });

    inpN.addEventListener('input', () => { st.nParcelas = clamp(parseInt(inpN.value, 10) || 2, 2, 120); gerarParcelas(); atualizar(); });
    valParc.inp.addEventListener('input', debounce(() => { st.valorParcela = valParc.ler(); gerarParcelas(); atualizar(); }, 250));

  // Tabela de parcelas: gerada pela regra escolhida e editável linha a linha.
  function gerarParcelas() {
    if (!blocoRepeticao || st.rec !== 'parcelado') return;
    const total = valor.ler();
    const conta = contaPorId(selConta.value);
    const cartao_ = conta && conta.tipo === 'cartao';
    const data0 = inpData.value || hojeISO();

    if (total && total > 0) {
      if (st.modoParc === 'valor' && st.valorParcela > 0) {

      } else {
        const n = st.nParcelas;
        const cada = Math.floor(total / n);
        valores = Array.from({ length: n }, (_, i) => cada + (i === 0 ? total - cada * n : 0));
      }
    }
    st.parcelasTab = valores.map((v, i) => ({ valor: v, data: cartao_ ? data0 : addMesesData(data0, i) }));
  }

  function desenharTabelaParcelas(detRec, cartao_) {
    const total = valor.ler() || 0;

    const aviso = soma !== total && total

    anexar(detRec, [tabela, aviso]);

  // Atualiza partes que dependem de outras (cartão, repetição, fatura, pago em, divisão)
  function atualizar() {
    limpar(resumo);
    const data = inpData.value || hojeISO();
    const conta = contaPorId(selConta.value);
    const v = valor.ler();
    if (tipo === 'transferencia') {
      const dest = contaPorId(selDestino.value);
      const ehFatura = dest && dest.tipo === 'cartao';
      blocoFatura.hidden = !ehFatura;
      if (ehFatura) {
        const fats = faturasDoCartao(dest).filter((f) => f.restante > 0 || f.mes === st.fatura);
        const atual = faturaAtual(dest);
        if (!fats.some((f) => f.mes === atual)) fats.push({ mes: atual, restante: 0, vencimento: datasFatura(dest, atual).vencimento });
        const escolhida = st.fatura || (fats.find((f) => f.restante > 0) || {}).mes || atual;
        limpar(selFatura);
        for (const f of fats.sort((a, b) => (a.mes < b.mes ? -1 : 1))) {
          selFatura.appendChild(el('option', { value: f.mes, selected: f.mes === escolhida, text: capitalizar(nomeMes(f.mes)) + ' · vence ' + dataBR(f.vencimento) + (f.restante > 0 ? ' · falta ' + moeda(f.restante) : '') }));
        }
        if (!valor.inp.value) { const f = fats.find((x) => x.mes === selFatura.value); if (f && f.restante > 0) valor.inp.value = numeroBR(f.restante); }
        selFatura.onchange = () => { st.fatura = selFatura.value; };
        st.fatura = selFatura.value;
      }
      return;
    }
    const cartao_ = conta && conta.tipo === 'cartao';
    blocoStatus.hidden = cartao_;
    if (!cartao_ && !tocado.has('status') && !editando) {
      const futuro = data > hojeISO();
      if (futuro && st.status === 'pago') { st.status = 'pendente'; for (const b of altStatus.children) b.classList.toggle('ativo', b.dataset.v === 'pendente'); }
      if (!futuro && st.status === 'pendente' && !base) { st.status = 'pago'; for (const b of altStatus.children) b.classList.toggle('ativo', b.dataset.v === 'pago'); }
    }
    campoPagoEm.hidden = cartao_ || st.status !== 'pago' || st.rec === 'fixo';
    if (rotuloValor) rotuloValor.textContent = st.rec === 'parcelado' ? 'Valor total' : tipo === 'entrada' ? 'Valor que entrou na sua conta' : 'Valor';
    if (blocoRepeticao) {
      const { detRec, inpN, valParc, inpMeses } = blocoRepeticao._det;
      limpar(detRec);
      if (st.rec === 'parcelado') {
        const regra = alternador([['iguais', 'Parcelas iguais'], ['valor', 'Valor de cada parcela']], st.modoParc, (m) => { st.modoParc = m; gerarParcelas(); atualizar(); });
        anexar(detRec, [campo('Como dividir', regra),
          st.modoParc === 'iguais' ? campo('Número de parcelas', inpN) : campo('Valor de cada parcela (a última completa o total)', valParc.inp)]);
        if (!st.parcelasTab.length) gerarParcelas();
        if (st.parcelasTab.length) desenharTabelaParcelas(detRec, cartao_);
      }
      if (st.rec === 'fixo') detRec.appendChild(campo('Repetir por quantos meses', inpMeses, 'Dá para estender depois duplicando o último.'));
    }
    const partes = [];
    if (cartao_) {
      const f = faturaDaCompra(conta, data);
      const d = datasFatura(conta, f);
      partes.push('Entra na fatura de ' + nomeMes(f) + ' (fecha ' + dataBR(d.fechamento) + ', vence ' + dataBR(d.vencimento) + ').');
    }
    if (!editando && st.rec === 'fixo' && v) {
      partes.push(`${st.nMeses} lançamentos de ${moeda(v)}, de ${nomeMesCurto(mesDe(data))} a ${nomeMesCurto(addMeses(mesDe(data), st.nMeses - 1))}.` + (cartao_ ? '' : ' Os meses seguintes ficam pendentes, para confirmar quando pagar.'));
    }
    if (!editando && st.rec === 'parcelado' && !cartao_) partes.push('A 1ª parcela fica com a situação escolhida; as demais, pendentes.');
    for (const p of partes) resumo.appendChild(el('p', { class: 'nota', text: p }));
    if (divisao) divisao.mostrarResumo(st.rec === 'parcelado' ? somar(st.parcelasTab, (p) => p.valor) || v : v);
    atualizarMistura();
  }

  // ---- salvar ----
  const erro = el('div', { class: 'erro-texto', role: 'alert' });
  async function salvar(novoDepois) {
    const v = valor.ler();
    if (!v || v <= 0) { erro.textContent = 'Informe um valor maior que zero.'; valor.inp.focus(); return; }
    if (!RX_DATA.test(inpData.value)) { erro.textContent = 'Informe a data.'; inpData.focus(); return; }
    if (!selConta.value) { erro.textContent = 'Escolha a conta. Se não houver nenhuma, cadastre em Contas e cartões.'; return; }
    const reg = {
      tipo, valor: v, data: inpData.value, contaId: selConta.value, descricao: vTexto(inpDesc.value, 120), obs: vTexto(inpObs.value, 2000),
      status: st.status, escopo: st.escopo,
    };
    let divBase;
    if (tipo === 'transferencia') {
      if (selDestino.value === selConta.value) { erro.textContent = 'A conta de origem e a de destino são a mesma.'; return; }
      reg.contaDestinoId = selDestino.value;
      reg.escopo = (contaPorId(selConta.value) || {}).escopo || 'P';
      if (ehCartao(reg.contaDestinoId)) { reg.fatura = st.fatura; if (!reg.descricao) reg.descricao = 'Pagamento de fatura'; }
      if (!reg.descricao) reg.descricao = 'Transferência';
    } else {
      reg.categoriaId = selCat.value && selCat.value !== '__nova' ? selCat.value : null;
      reg.pessoa = vTexto(inpPessoa.value, 100);
      reg.forma = selForma.value;
      if (reg.status === 'pago' && !ehCartao(reg.contaId)) {
        if (!RX_DATA.test(inpPagoEm.value)) { erro.textContent = 'Informe a data do pagamento.'; inpPagoEm.focus(); return; }
        reg.pagoEm = inpPagoEm.value;
      }
      if (divisao) {
        const baseDiv = st.rec === 'parcelado' && !editando ? somar(st.parcelasTab, (p) => p.valor) || v : v;
        const r = divisao.ler(baseDiv);
        if (r.erro) { erro.textContent = r.erro; return; }
        divBase = { itens: r.divisao, base: baseDiv };
      }
    }

    if (editando) {
      const campos = ['valor', 'descricao', 'categoriaId', 'contaId', 'escopo', 'pessoa', 'forma', 'obs'];
      const mudouSerie = lanc.grupo && campos.some((k) => (reg[k] ?? '') !== (lanc[k] ?? ''));
      let alvo = [lanc];
      if (mudouSerie) {
        let seguintes = DB.lancamentos.filter((x) => x.grupo === lanc.grupo && x.parcela > lanc.parcela);
        // valor novo não mexe no que já foi pago (reajuste vale daqui para a frente)
        if (reg.valor !== lanc.valor) seguintes = seguintes.filter((x) => x.status === 'pendente' || ehCartao(x.contaId));
        if (seguintes.length) {
          const fixo = lanc.rec === 'fixo';
          const r = await escolher({ titulo: 'Alterar a série?', texto: 'Este lançamento se repete. Aplicar a alteração a:', opcoes: [
            { valor: 'um', rotulo: fixo ? 'Só este mês (variação)' : 'Só esta parcela (' + lanc.parcela + '/' + lanc.parcelas + ')', detalhe: fixo ? 'Ex.: a conta deste mês veio diferente' : null },
            { valor: 'seg', rotulo: fixo ? 'Este e os próximos (reajuste)' : 'Esta e as seguintes', detalhe: (seguintes.length + 1) + ' lançamentos' + (reg.valor !== lanc.valor ? ', só os ainda não pagos' : '') }] });
          if (!r) return;
          if (r === 'seg') alvo = alvo.concat(seguintes);
        }
      }
      for (const x of alvo) {
        if (x === lanc) {
          Object.assign(x, reg);
          if (!reg.pagoEm) delete x.pagoEm;
          if (divBase) { if (divBase.itens.length) x.divisao = divBase.itens; else delete x.divisao; }
        } else {
          Object.assign(x, Object.fromEntries(campos.map((k) => [k, reg[k]])));
        }
        if (tipo !== 'transferencia') recalcularCompetencia(x); else x.competencia = mesDe(x.data);
        if (x.status !== 'pago') delete x.pagoEm;
        carimbar(x);
        if (x.tipo === 'entrada') sincronizarRepasses(x);
      }
      mudou();
      avisar('Alteração salva.');
    } else {
      const novos = [];
      const conta = contaPorId(reg.contaId);
      const cartao_ = tipo !== 'transferencia' && conta && conta.tipo === 'cartao';
      const div = divBase && divBase.itens.length ? divBase.itens : undefined;
      if (tipo !== 'transferencia' && st.rec === 'parcelado') {
        if (!st.parcelasTab.length) { erro.textContent = 'Informe o valor total para montar as parcelas.'; return; }
        const grupo = uid();
        const n = st.parcelasTab.length;
        st.parcelasTab.forEach((p, i) => {
          const x = { ...reg, id: uid(), grupo, rec: 'parcelado', parcela: i + 1, parcelas: n, valor: p.valor, data: cartao_ ? reg.data : p.data };
          if (!cartao_ && i > 0) { x.status = 'pendente'; delete x.pagoEm; }
          if (div) x.divisao = escalarDivisao(div, p.valor / divBase.base);
          recalcularCompetencia(x);
          novos.push(carimbar(x, true));
        });
      } else if (tipo !== 'transferencia' && st.rec === 'fixo') {
        const grupo = uid();
        for (let i = 0; i < st.nMeses; i++) {
          const x = { ...reg, id: uid(), grupo, rec: 'fixo', parcela: i + 1, parcelas: st.nMeses, data: addMesesData(reg.data, i) };
          if (!cartao_ && i > 0) { x.status = 'pendente'; delete x.pagoEm; }
          if (div) x.divisao = div.map((d) => ({ ...d }));
          recalcularCompetencia(x);
          novos.push(carimbar(x, true));
        }
      } else {
        const x = { ...reg, id: uid() };
        if (div) x.divisao = div;
        if (tipo !== 'transferencia') recalcularCompetencia(x); else x.competencia = mesDe(x.data);
        novos.push(carimbar(x, true));
      }
      DB.lancamentos.push(...novos);
      for (const x of novos) if (x.divisao) sincronizarRepasses(x);
      mudou();
      const visiveis = new Set(mesesDoPeriodo());
      const onde = tipo !== 'transferencia' && !visiveis.has(novos[0].competencia) ? ' Aparece em ' + nomeMes(novos[0].competencia) + (cartao_ ? ' (mês da fatura).' : '.') : '';
      avisar((novos.length > 1 ? novos.length + ' lançamentos criados.' : (tipo === 'entrada' ? 'Entrada' : tipo === 'saida' ? 'Saída' : 'Transferência') + ' salva.') + onde, 'ok', {
        rotulo: 'Desfazer', fn: () => {
          const ids = new Set(novos.map((x) => x.id));
          for (const x of DB.lancamentos) if (x.origemId && ids.has(x.origemId)) ids.add(x.id);
          DB.lancamentos = DB.lancamentos.filter((x) => !ids.has(x.id)); mudou();
        },
      });
    }
    m.fechar();
    if (novoDepois) setTimeout(() => abrirFormLancamento({ tipo }), 60);
  }

  const titulos = { entrada: editando ? 'Editar entrada' : 'Nova entrada', saida: editando ? 'Editar saída' : 'Nova saída', transferencia: editando ? 'Editar transferência' : 'Nova transferência' };
  const m = abrirModal({
    titulo: titulos[tipo], largura: '680px', classe: 'modal-' + tipo,
    subtitulo: lanc && lanc.grupo ? (lanc.rec === 'fixo' ? 'Fixo mensal' : 'Parcela') + ' ' + lanc.parcela + ' de ' + lanc.parcelas : lanc && lanc.origemId ? 'Repasse ligado a uma entrada dividida com parceiro' : null,
    corpo: [corpo, erro],
    rodape: [
      editando ? el('button', { class: 'botao perigo-texto', type: 'button', onclick: () => { m.fechar(); excluirLancamento(lanc); } }, icone('lixeira', 16), ' Excluir') : null,
      editando && lanc.status === 'pendente' && tipo !== 'transferencia' && !ehCartao(lanc.contaId)
        ? el('button', { class: 'botao', type: 'button', onclick: () => { m.fechar(); registrarPagamento(lanc); } }, icone('check', 16), ' ' + (tipo === 'entrada' ? 'Registrar recebimento' : 'Registrar pagamento')) : null,
      el('div', { class: 'espaco' }),
      el('button', { class: 'botao', type: 'button', text: 'Cancelar', onclick: () => m.fechar() }),
      editando ? null : el('button', { class: 'botao', type: 'button', text: 'Salvar e lançar outro', onclick: () => salvar(true) }),
      el('button', { class: 'botao primario', type: 'button', text: 'Salvar', onclick: () => salvar(false) }),
    ],
  });
  m.dlg.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON' && !e.target.closest('.tabela-parcelas')) { e.preventDefault(); salvar(false); }
  });
  valor.inp.setAttribute('autofocus', '');
  setTimeout(() => valor.inp.focus(), 40);
  atualizar();
}

// ---------- Registrar pagamento/recebimento (total, parcial ou a maior) ----------
function registrarPagamento(l) {
  const T = TXT[l.tipo];
  const ent = l.tipo === 'entrada';
  const v = campoValor(l.valor);
  const inpData = el('input', { type: 'date', value: hojeISO() });
  const selConta = el('select', null, opcoesContas((c) => c.tipo !== 'cartao', l.contaId));
  const info = el('div', { class: 'form-resumo' });
  const seguintes = l.grupo ? DB.lancamentos.filter((x) => x.grupo === l.grupo && x.parcela > l.parcela && x.status === 'pendente').sort((a, b) => a.parcela - b.parcela) : [];
  // Fixo mensal (plano de saúde, aluguel…): valor diferente costuma ser variação do mês ou reajuste, não "abater parcelas".
  const fixo = l.rec === 'fixo';
  const opsFixo = [['variacao', 'Só este mês (variação)'], ...(seguintes.length ? [['reajuste', 'Este e os próximos (reajuste)']] : [])];
  let opMenor = fixo ? 'variacao' : 'restante', opMaior = fixo ? 'variacao' : seguintes.length ? 'abater' : 'juros';
  const escolhasMenor = alternador(fixo ? [...opsFixo, ['restante', 'Pagou só uma parte']] : [['restante', 'O restante continua ' + T.pendente.toLowerCase()], ['desconto', 'Dar desconto (quitar)']], opMenor, (x) => { opMenor = x; atualizar(); });
  const escolhasMaior = alternador(fixo ? [...opsFixo, ['juros', 'Juros/multa']] : seguintes.length ? [['abater', 'Abater das próximas parcelas'], ['juros', 'Juros/multa (não abater)']] : [['juros', 'Juros/multa']], opMaior, (x) => { opMaior = x; atualizar(); });
  const notaFixo = (op, val) => op === 'variacao' ? 'Só este mês fica com ' + moeda(val) + '; os próximos continuam com ' + moeda(l.valor) + '.'
    : op === 'reajuste' ? 'Este mês e os ' + seguintes.length + ' próximos (ainda não pagos) passam a ' + moeda(val) + '.' : null;
  const atualizar = () => {
    limpar(info);
    const val = v.ler() || 0;
    if (val && val < l.valor) {
      info.appendChild(el('p', { class: 'nota', text: `${ent ? 'Recebido' : 'Pago'} ${moeda(val)} de ${moeda(l.valor)}. Diferença: ${moeda(l.valor - val)}.` }));
      info.appendChild(escolhasMenor);
      info.appendChild(el('p', { class: 'nota', text: notaFixo(opMenor, val) || (opMenor === 'restante' ? 'Fica um lançamento ' + T.pendente.toLowerCase() + ' de ' + moeda(l.valor - val) + ', com o mesmo vencimento.' : 'O valor fica corrigido para ' + moeda(val) + ' e nada mais é cobrado.') }));
    } else if (val > l.valor) {
      info.appendChild(el('p', { class: 'nota', text: `${ent ? 'Recebido' : 'Pago'} ${moeda(val - l.valor)} a mais.` }));
      info.appendChild(escolhasMaior);
      const nf = notaFixo(opMaior, val);
      if (nf) info.appendChild(el('p', { class: 'nota', text: nf }));
      else if (opMaior === 'abater') info.appendChild(el('p', { class: 'nota', text: 'A diferença reduz as próximas parcelas desta série (e quita as que ficarem zeradas).' }));
    }
  };
  v.inp.addEventListener('input', debounce(atualizar, 150));
  const m = abrirModal({
    titulo: ent ? 'Registrar recebimento' : 'Registrar pagamento', subtitulo: (l.descricao || nomeCategoria(l.categoriaId)) + ' · vence ' + dataBR(l.data), largura: '520px',
    corpo: [el('div', { class: 'linha-valor' }, campo(ent ? 'Valor recebido' : 'Valor pago', v.inp, null, 'campo-valor'), v.dica),
      el('div', { class: 'grade-campos' }, campo(T.pagoEm, inpData), campo(ent ? 'Entrou na conta' : 'Saiu da conta', selConta)), info],
    rodape: [el('div', { class: 'espaco' }), el('button', { class: 'botao', type: 'button', text: 'Cancelar', onclick: () => m.fechar() }),
      el('button', { class: 'botao primario', type: 'button', text: 'Confirmar', onclick: confirmar_ })],
  });
  m.dlg.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') { e.preventDefault(); confirmar_(); } });
  function confirmar_() {
    const val = v.ler();
    if (!val || val <= 0) { v.inp.focus(); return; }
    if (!RX_DATA.test(inpData.value)) { inpData.focus(); return; }
    const antes = JSON.parse(JSON.stringify(DB.lancamentos));
    const excluidosAntes = { ...DB.excluidos };
    const idsAntes = new Set(DB.lancamentos.map((x) => x.id));
    const tocados = new Set([l.id, ...seguintes.map((x) => x.id)]);
    const original = l.valor;
    const divOriginal = l.divisao;
    Object.assign(l, { status: 'pago', pagoEm: inpData.value, contaId: selConta.value });
    let msg = (ent ? 'Recebimento' : 'Pagamento') + ' registrado.';
    const opFixo = fixo ? (val < original ? opMenor : val > original ? opMaior : null) : null;
    if (opFixo === 'variacao' || opFixo === 'reajuste') {
      l.valor = val;
      if (divOriginal) l.divisao = escalarDivisao(divOriginal, val / original);
      if (opFixo === 'reajuste') {
        for (const x of seguintes) { const f = val / x.valor; x.valor = val; if (x.divisao) x.divisao = escalarDivisao(x.divisao, f); carimbar(x); if (x.tipo === 'entrada') sincronizarRepasses(x); }
        msg = 'Registrado. Reajuste aplicado a este mês e aos ' + seguintes.length + ' próximos: ' + moeda(val) + '.';
      } else msg = 'Registrado com o valor deste mês: ' + moeda(val) + '.';
    } else if (val < original) {
      l.valor = val;
      if (divOriginal) l.divisao = escalarDivisao(divOriginal, val / original);
      if (opMenor === 'restante') {
        const resto = { ...JSON.parse(JSON.stringify(l)), id: uid(), valor: original - val, status: 'pendente', contaId: l.contaId };
        delete resto.pagoEm;
        if (divOriginal) resto.divisao = escalarDivisao(divOriginal, (original - val) / original); else delete resto.divisao;
        resto.obs = (resto.obs ? resto.obs + '\n' : '') + 'Restante de pagamento parcial.';
        recalcularCompetencia(resto);
        DB.lancamentos.push(carimbar(resto, true));
        if (resto.divisao) sincronizarRepasses(resto);
        msg = `Parcial registrado. Ficou ${moeda(original - val)} ${T.pendente.toLowerCase()}.`;
      } else msg = 'Registrado com desconto de ' + moeda(original - val) + '.';
    } else if (val > original) {
      l.valor = val;
      if (divOriginal) l.divisao = escalarDivisao(divOriginal, val / original);
      if (opMaior === 'abater') {
        let sobra = val - original;
        for (const x of seguintes) {
          if (sobra <= 0) break;
          if (x.valor <= sobra) { sobra -= x.valor; DB.lancamentos = DB.lancamentos.filter((y) => y.id !== x.id && y.origemId !== x.id); registrarExclusao(x.id); }
          else { const f = (x.valor - sobra) / x.valor; x.valor -= sobra; if (x.divisao) x.divisao = escalarDivisao(x.divisao, f); sobra = 0; carimbar(x); sincronizarRepasses(x); }
        }
        msg = 'Registrado. A diferença foi abatida das próximas parcelas.';
      } else {
        l.obs = (l.obs ? l.obs + '\n' : '') + 'Inclui ' + moeda(val - original) + ' de juros/multa.';
        msg = 'Registrado com ' + moeda(val - original) + ' de juros/multa.';
      }
    }
    recalcularCompetencia(l);
    carimbar(l);
    if (l.tipo === 'entrada') sincronizarRepasses(l);
    mudou();
    m.fechar();
    const criados = DB.lancamentos.filter((x) => !idsAntes.has(x.id)).map((x) => x.id);
    for (const x of DB.lancamentos) if (x.origemId && tocados.has(x.origemId)) tocados.add(x.id);
    avisar(msg, 'ok', { rotulo: 'Desfazer', fn: () => {
      DB.lancamentos = antes; DB.excluidos = excluidosAntes;
      for (const id of criados) registrarExclusao(id);             // o que foi criado some também nos outros aparelhos
      for (const x of DB.lancamentos) if (tocados.has(x.id)) carimbar(x); // só o que mudou fica "mais novo"
      mudou();
    } });
  }
  atualizar();
  setTimeout(() => { v.inp.focus(); v.inp.select(); }, 40);
}

// ===================== 12 - Contas, cartões, faturas e extrato =====================

TELAS.contas = (cont) => {
  const contas = contasDoEscopo(false);
  const normais = contas.filter((c) => c.tipo !== 'cartao');
  const cartoes = contas.filter((c) => c.tipo === 'cartao');
  const arquivadas = DB.contas.filter((c) => c.arquivada && noEscopo(c));
  const disp = somar(normais, (c) => saldoConta(c));
  const devido = somar(cartoes, (c) => usoDoCartao(c).devido);

  cont.appendChild(el('div', { class: 'grade-tiles compacta' },
    tileNumero({ rotulo: 'Saldo em contas', icone: 'contas', classe: 'resultado', valor: moeda(disp) }),
    tileNumero({ rotulo: 'Cartões a pagar', icone: 'cartao', classe: 'saida', valor: moeda(devido), sub: 'inclui parcelas futuras' }),
    tileNumero({ rotulo: 'Saldo menos cartões', icone: 'escudo', classe: disp - devido >= 0 ? 'entrada' : 'saida', valor: moeda(disp - devido) })));

  cont.appendChild(el('div', { class: 'secao-topo' }, el('h2', { text: 'Contas' }),
    el('button', { class: 'botao', type: 'button', onclick: () => abrirFormLancamento({ tipo: 'transferencia' }) }, icone('transferir', 18), ' Transferir'),
    el('button', { class: 'botao primario', type: 'button', onclick: () => abrirFormConta({ tipo: 'corrente' }) }, icone('mais', 18), ' Nova conta')));
  cont.appendChild(normais.length ? el('div', { class: 'grade-contas' }, normais.map(cartaoConta))
    : cartaoVazio('contas', 'Nenhuma conta cadastrada', 'Cadastre suas contas bancárias e o dinheiro em espécie.', { rotulo: 'Nova conta', fn: () => abrirFormConta({ tipo: 'corrente' }) }));

  cont.appendChild(el('div', { class: 'secao-topo' }, el('h2', { text: 'Cartões de crédito' }),
    el('button', { class: 'botao primario', type: 'button', onclick: () => abrirFormConta({ tipo: 'cartao' }) }, icone('mais', 18), ' Novo cartão')));
  cont.appendChild(cartoes.length ? el('div', { class: 'grade-contas' }, cartoes.map(cartaoCartao))
    : cartaoVazio('cartao', 'Nenhum cartão cadastrado', 'Com o dia de fechamento e de vencimento, cada compra cai na fatura certa, inclusive as parceladas.', { rotulo: 'Novo cartão', fn: () => abrirFormConta({ tipo: 'cartao' }) }));

  if (arquivadas.length) {
    cont.appendChild(el('details', { class: 'arquivadas' }, el('summary', { text: arquivadas.length + (arquivadas.length === 1 ? ' conta arquivada' : ' contas arquivadas') }),
      el('ul', { class: 'lista-simples' }, arquivadas.map((c) => el('li', null, el('button', { class: 'ls-botao', type: 'button', onclick: () => abrirFormConta({ conta: c }) },
        el('span', { class: 'ponto-cor', style: { background: `var(--s${c.cor + 1})` } }), el('span', { class: 'ls-texto' }, el('strong', { text: c.nome }), el('span', { text: TIPOS_CONTA[c.tipo] })),
        el('span', { class: 'valor', text: moeda(saldoConta(c)) })))))));
  }
};

function cartaoConta(c) {
  const s = saldoConta(c);

  const fats = [...todas.filter((f) => f.mes === mesAt), ...todas.filter((f) => f.mes > mesAt), ...todas.filter((f) => f.mes < mesAt).reverse()];

function abrirExtrato(conta) {
  // cada lançamento entra na data em que o dinheiro de fato mexeu (pago em), não na do vencimento
  const movs = DB.lancamentos.filter((l) => (l.contaId === conta.id || l.contaDestinoId === conta.id) && dataEfetiva(l) >= conta.dataSaldo)
    .sort((a, b) => { const da = dataEfetiva(a), db = dataEfetiva(b); return da === db ? (a.criadoEm < b.criadoEm ? -1 : 1) : da < db ? -1 : 1; });
  let s = conta.saldoInicial;
  const linhas = [];
  for (const l of movs) {
    const ef = efeitoNaConta(l, conta.id);
    if (l.status === 'pago') s += ef;
    linhas.push({ l, ef, s, pend: l.status !== 'pago' });
  }
  linhas.reverse();
  const corpo = el('div', null,
    el('p', { class: 'texto-suave', text: 'Saldo inicial de ' + moeda(conta.saldoInicial) + ' em ' + dataBR(conta.dataSaldo) + '. Pendentes aparecem esmaecidos e não entram no saldo.' }),
    linhas.length ? el('div', { class: 'tabela-rolagem' }, el('table', { class: 'tabela extrato' },
      el('thead', null, el('tr', null, el('th', { text: 'Data' }), el('th', { text: 'Descrição' }), el('th', { class: 'num', text: 'Valor' }), el('th', { class: 'num', text: 'Saldo' }))),
      el('tbody', null, linhas.slice(0, 500).map(({ l, ef, s: saldo, pend }) => el('tr', { class: pend ? 'pendente' : '' },
        el('td', { text: dataBR(dataEfetiva(l)) }),
        el('td', null, el('strong', { text: l.descricao || nomeCategoria(l.categoriaId) }), el('span', { class: 'texto-suave', text: ' · ' + (l.tipo === 'transferencia' ? (ef < 0 ? 'para ' + nomeConta(l.contaDestinoId) : 'de ' + nomeConta(l.contaId)) : nomeCategoria(l.categoriaId)) + (pend ? ' · pendente' : '') + (!pend && l.pagoEm && l.pagoEm !== l.data ? ' · vencimento ' + dataBR(l.data) : '') })),
        el('td', { class: ['num', 'valor', ef > 0 ? 'cor-texto-entrada' : ''], text: (ef > 0 ? '+ ' : '− ') + moeda(Math.abs(ef)) }),
        el('td', { class: 'num valor', text: pend ? '' : moeda(saldo) })))))) : el('p', { text: 'Nenhuma movimentação.' }));
  abrirModal({ titulo: 'Extrato · ' + conta.nome, subtitulo: 'Saldo atual ' + moeda(saldoConta(conta)), largura: '760px', corpo });
}

function seletorCor(valor, aoMudar) {
  const g = el('div', { class: 'cores', role: 'radiogroup', 'aria-label': 'Cor' });
  for (let i = 0; i < 8; i++) {
    g.appendChild(el('button', { type: 'button', class: ['cor-opcao', i === valor ? 'ativo' : ''], style: { background: `var(--s${i + 1})` }, 'aria-label': 'Cor ' + (i + 1),
      onclick: () => { for (const b of g.children) b.classList.remove('ativo'); g.children[i].classList.add('ativo'); aoMudar(i); } }));
  }
  return g;
}

function abrirFormConta({ conta, tipo }) {
  const editando = !!conta;
  const escopoPadrao = DB.config.escopo === 'T' ? 'P' : DB.config.escopo;
  const st = conta ? { ...conta } : { tipo, nome: '', escopo: escopoPadrao, cor: DB.contas.length % 8, saldoInicial: 0, dataSaldo: hojeISO(), limite: 0, fechamento: 1, vencimento: 10, contaPagamentoId: null };
  const nome = el('input', { type: 'text', maxlength: 80, value: st.nome, placeholder: st.tipo === 'cartao' ? 'Ex.: Nubank, Itaú Visa' : 'Ex.: Banco do Brasil, Sicoob, Caixa' });
  const selTipo = seletor(Object.entries(TIPOS_CONTA).filter(([k]) => (st.tipo === 'cartao') === (k === 'cartao')), st.tipo);
  const saldo = campoValor(Math.abs(st.saldoInicial));
  let negativo = st.saldoInicial < 0;
  const dataSaldo = el('input', { type: 'date', value: st.dataSaldo });
  const limite = campoValor(st.limite || 0);
  const fech = el('input', { type: 'number', min: 1, max: 31, value: st.fechamento, class: 'curto' });
  const venc = el('input', { type: 'number', min: 1, max: 31, value: st.vencimento, class: 'curto' });
  const pagadora = el('select', null, [el('option', { value: '', text: '—' }), ...opcoesContas((c) => c.tipo !== 'cartao', st.contaPagamentoId)]);
  // Limite compartilhado: só com cartão que tem limite próprio; quem já empresta o limite não pode passar a usar o de outro.
  const temDependentes = editando && DB.contas.some((c) => c.limiteCom === conta.id);
  const donosPossiveis = DB.contas.filter((c) => c.tipo === 'cartao' && !c.arquivada && !c.limiteCom && (!conta || c.id !== conta.id));
  const selLimite = el('select', { disabled: temDependentes }, [el('option', { value: '', text: 'Limite próprio' }),
    ...donosPossiveis.map((c) => el('option', { value: c.id, text: 'Compartilha o limite do ' + c.nome, selected: st.limiteCom === c.id }))]);
  const caixaLimite = campo('Limite (opcional)', limite.inp);
  const mostrarLimite = () => { caixaLimite.hidden = !!selLimite.value; };
  selLimite.addEventListener('change', mostrarLimite);
  mostrarLimite();
  const erro = el('div', { class: 'erro-texto', role: 'alert' });
  const usada = editando && DB.lancamentos.some((l) => l.contaId === conta.id || l.contaDestinoId === conta.id);

  const corpo = [
    campo('Nome', nome),
    el('div', { class: 'grade-campos' },
      st.tipo === 'cartao' ? null : campo('Tipo', selTipo),
      campo('Pessoal ou escritório', alternador([['P', 'Pessoal'], ['E', 'Escritório']], st.escopo, (v) => { st.escopo = v; }))),
    campo('Cor', seletorCor(st.cor, (i) => { st.cor = i; })),
  ];
  if (st.tipo === 'cartao') {
    corpo.push(
      el('div', { class: 'grade-campos tres' }, campo('Dia de fechamento', fech), campo('Dia de vencimento', venc), caixaLimite),
      campo('Limite', selLimite, temDependentes ? 'Outro cartão usa o limite deste; por isso ele fica próprio.' : 'Ex.: cartão pessoal e do escritório no mesmo banco, com um limite só: cadastre o limite num e, no outro, escolha "Compartilha o limite do…".'),
      campo('Conta que paga a fatura', pagadora, 'Já vem escolhida quando o senhor clicar em "Pagar fatura".'));
  } else {
    corpo.push(el('div', { class: 'grade-campos' },
      campo('Saldo', el('div', { class: 'valor-sinal' }, alternador([['+', 'Positivo'], ['-', 'Negativo']], negativo ? '-' : '+', (v) => { negativo = v === '-'; }), saldo.inp)),
      campo('No início do dia', dataSaldo)),
    el('p', { class: 'nota', text: 'Informe o saldo que a conta tinha no início desse dia (o do extrato do banco). Lançamentos com data anterior não mudam o saldo, porque já estão nele.' }));
  }
  corpo.push(erro);

  const salvar = () => {
    const n = vTexto(nome.value, 80);
    if (!n) { erro.textContent = 'Dê um nome à conta.'; nome.focus(); return; }
    const o = conta || { id: 'k-' + uid(), arquivada: false };
    Object.assign(o, { nome: n, tipo: st.tipo === 'cartao' ? 'cartao' : selTipo.value, escopo: st.escopo, cor: st.cor });
    if (o.tipo === 'cartao') {
      const f = parseInt(fech.value, 10), v = parseInt(venc.value, 10);
      if (!(f >= 1 && f <= 31 && v >= 1 && v <= 31)) { erro.textContent = 'Dias de fechamento e vencimento vão de 1 a 31.'; return; }
      Object.assign(o, { fechamento: f, vencimento: v, limite: selLimite.value ? 0 : limite.ler() || 0, limiteCom: selLimite.value || null, contaPagamentoId: pagadora.value || null, saldoInicial: 0, dataSaldo: '2000-01-01' });
    } else {
      if (!RX_DATA.test(dataSaldo.value)) { erro.textContent = 'Informe a data do saldo.'; return; }
      const v = saldo.ler() || 0;
      Object.assign(o, { saldoInicial: negativo ? -v : v, dataSaldo: dataSaldo.value });
    }
    carimbar(o, !conta);
    if (!conta) DB.contas.push(o);
    if (o.tipo === 'cartao') for (const l of DB.lancamentos) if (l.contaId === o.id && l.tipo !== 'transferencia') recalcularCompetencia(l);
    mudou();
    avisar(conta ? 'Conta atualizada.' : 'Conta criada.');
    m.fechar();
  };

  const m = abrirModal({
    titulo: editando ? 'Editar ' + (st.tipo === 'cartao' ? 'cartão' : 'conta') : st.tipo === 'cartao' ? 'Novo cartão de crédito' : 'Nova conta',
    largura: '560px', corpo,
    rodape: [
      editando ? el('button', { class: 'botao', type: 'button', text: conta.arquivada ? 'Reativar' : 'Arquivar', title: 'Some das listas, mas o histórico fica', onclick: () => {
        conta.arquivada = !conta.arquivada; carimbar(conta); mudou(); m.fechar(); avisar(conta.arquivada ? 'Conta arquivada.' : 'Conta reativada.');
      } }) : null,
      editando && !usada ? el('button', { class: 'botao perigo-texto', type: 'button', onclick: async () => {
        if (!(await confirmar({ titulo: 'Excluir conta?', texto: '"' + conta.nome + '" não tem lançamentos e será excluída.', botao: 'Excluir', perigo: true }))) return;
        DB.contas = DB.contas.filter((c) => c.id !== conta.id); registrarExclusao(conta.id); mudou(); m.fechar();
      } }, icone('lixeira', 16), ' Excluir') : null,
      el('div', { class: 'espaco' }),
      el('button', { class: 'botao', type: 'button', text: 'Cancelar', onclick: () => m.fechar() }),
      el('button', { class: 'botao primario', type: 'button', text: 'Salvar', onclick: salvar }),
    ],
  });
}

function pedirSenha(titulo, texto) {
  return new Promise((res) => {
    let v = null;
    const s = campoSenha({ placeholder: 'Senha', autofocus: true });
    const m = abrirModal({
      titulo, largura: '420px', classe: 'modal-pequeno',
      corpo: [el('p', { class: 'texto-confirmacao', text: texto }), s.caixa],
      rodape: [el('button', { class: 'botao', type: 'button', text: 'Cancelar', onclick: () => m.fechar() }),
        el('button', { class: 'botao primario', type: 'button', text: 'Continuar', onclick: () => { v = s.inp.value; s.inp.value = ''; m.fechar(); } })],
      aoFechar: () => res(v),
    });
    s.inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); m.dlg.querySelector('.primario').click(); } });
  });
}

function baixarBackupAgora() {
  if (!SESSAO.ultimoEnv) { avisar('Aguarde o salvamento terminar e tente de novo.', 'atencao'); return; }
  baixarBackup(SESSAO.ultimoEnv);
  DB.config.ultimoBackup = agoraISO();
  mudou();
  avisar('Backup baixado (criptografado). Guarde-o fora deste computador também.');
}

async function restaurarBackup() {
  let lido;
  try { lido = await lerArquivoCofre(); } catch (e) { avisar(e.message, 'erro'); return; }
  if (!lido) return;
  let dados = null;
  try { dados = await decifrarDados(SESSAO.chave, lido.env.dados); } catch { dados = null; }
  if (!dados) {
    const senha = await pedirSenha('Senha do backup', 'O arquivo "' + lido.nome + '" foi criado com outra senha ou em outro cofre. Digite a senha dele.');
    if (!senha) return;
    try { const k = await abrirChave(lido.env.chaves, { tipo: 'senha', valor: senha }); dados = await decifrarDados(k, lido.env.dados); } catch { avisar('Senha incorreta para este backup.', 'erro'); return; }
  }
  let outro;
  try { outro = prepararDB(dados); } catch (e) { avisar(e.message, 'erro'); return; }
  const quando = lido.env.salvoEm ? dataBR(isoData(new Date(lido.env.salvoEm))) + ' às ' + horaCurta(lido.env.salvoEm) : 'data desconhecida';
  const r = await escolher({
    titulo: 'O que fazer com este backup?',
    texto: `Salvo em ${quando}: ${outro.lancamentos.length} lançamentos e ${outro.contas.length} contas.`,
    opcoes: [
      { valor: 'juntar', rotulo: 'Juntar com os dados atuais', detalhe: 'Traz o que é novo ou foi alterado depois. Nada do atual se perde. Use para trazer o que foi lançado em outro aparelho.' },
      { valor: 'substituir', rotulo: 'Substituir tudo pelo backup', detalhe: 'Os dados atuais são trocados pelos do backup. Fica uma cópia de segurança do estado atual.', perigo: true },
    ],
  });
  if (!r) return;
  await descarregarGravacao();
  if (SESSAO.ultimoEnv) await idbSet('antes-restauracao', SESSAO.ultimoEnv);
  if (r === 'juntar') {
    const j = juntarDB(DB, outro);
    DB = j.db; mudou();
    avisar(`Pronto: ${j.novos} ${j.novos === 1 ? 'item novo' : 'itens novos'} e ${j.atualizados} ${j.atualizados === 1 ? 'atualizado' : 'atualizados'}.`);
  } else {
    const cfg = DB.config;
    DB = outro; DB.config = { ...outro.config, bloqueioMin: cfg.bloqueioMin, tema: cfg.tema };
    mudou();
    avisar('Backup restaurado.');
  }
}

async function voltarParaCopia(chave, rotulo) {
  const env = chave === 'antes-restauracao' ? await idbGet('antes-restauracao') : await lerCopiaDoDia(chave);
  if (!env || !envelopeValido(env)) { avisar('Cópia não encontrada.', 'erro'); return; }
  let dados;
  try { dados = await decifrarDados(SESSAO.chave, env.dados); } catch { avisar('Esta cópia é de outro cofre e não abre com a chave atual.', 'erro'); return; }
  if (!(await confirmar({ titulo: 'Voltar para a cópia de ' + rotulo + '?', texto: 'Os dados atuais serão trocados pelos dessa cópia. Antes, guardo o estado atual como "antes da restauração".', botao: 'Voltar para a cópia', perigo: true }))) return;
  await descarregarGravacao();
  if (SESSAO.ultimoEnv) await idbSet('antes-restauracao', SESSAO.ultimoEnv);
  const cfg = DB.config;
  DB = prepararDB(dados); DB.config.bloqueioMin = cfg.bloqueioMin; DB.config.tema = cfg.tema;
  mudou();
  avisar('Dados de ' + rotulo + ' restaurados.');
}

  const a = campoSenha({ placeholder: 'Senha atual', autocomplete: 'current-password' });

  const n2 = campoSenha({ placeholder: 'Repita a nova senha', autocomplete: 'new-password' });
  const erro = el('div', { class: 'erro-texto', role: 'alert' });
  const bt = el('button', { class: 'botao primario', type: 'button', text: 'Trocar senha' });

    rodape: [el('button', { class: 'botao', type: 'button', text: 'Cancelar', onclick: () => m.fechar() }), bt] });

async function receberDoComputador() {
  let lido;
  try { lido = await lerArquivoCofre(); } catch (e) { avisar(e.message, 'erro'); return; }
  if (!lido) return;
  try {
    const r = await juntarEnvelope(lido.env);
    mudou();
    avisar(r.novos || r.atualizados ? `Recebido: ${r.novos} ${r.novos === 1 ? 'item novo' : 'itens novos'} e ${r.atualizados} ${r.atualizados === 1 ? 'alterado' : 'alterados'}.` : 'O celular já estava igual ao computador.');
  } catch (e) { avisar(e.outroCofre ? 'Esse arquivo é de outro cofre. Escolha o financas.cofre da pasta Organizador Financeiro.' : 'Não consegui ler o arquivo.', 'erro'); }
}

async function enviarAoComputador() {
  await descarregarGravacao();
  if (!SESSAO.ultimoEnv) await salvarAgora();
  const r = await compartilharCofre(SESSAO.ultimoEnv, 'celular_' + carimboArquivo() + '.cofre');
  if (r === 'cancelado') return;
  const t = agoraISO();
  DB.config.ultimoEnvio = t; DB.atualizadoEm = t; // sem mudou(): senão o envio "ficaria velho" na mesma hora
  _alteracoesPendentes = true; _agendarSalvar(); renderizar();
  avisar(r === 'compartilhado' ? 'Enviado. O computador junta sozinho quando o Organizador for aberto lá.' : 'Arquivo baixado. Coloque-o em Meu Drive › Organizador Financeiro - dados › do celular.');
}

function blocoDigital() {
  const caixa = el('div', { class: 'ajustes bloco-digital' });
  if (!MODO_CELULAR) return null;
  (async () => {
    const [suporta, reg] = await Promise.all([digitalSuportada(), lerDigital()]);
    limpar(caixa).append(el('h4', { text: 'Entrar com a digital (este celular)' }));
    if (reg) {
      caixa.append(el('div', { class: 'linha-estado ok' }, icone('check', 18), el('span', { text: 'Ligada. Ao abrir o app, basta a digital; a senha continua valendo e é pedida uma vez a cada ' + DIGITAL_DIAS_SENHA + ' dias.' })),
        el('div', { class: 'botoes-linha' }, el('button', { class: 'link-botao', type: 'button', text: 'Desligar a digital', onclick: async () => {
          if (!(await confirmar({ titulo: 'Desligar a digital?', texto: 'O app volta a pedir só a senha. A chave "Organizador Financeiro" pode ficar no Gerenciador de Senhas do Google, sem problema (sozinha ela não abre nada), ou ser apagada lá.', botao: 'Desligar' }))) return;
          await apagarDigital(); avisar('Digital desligada neste celular.'); renderizar();
        } })));
    } else if (!suporta) {
      caixa.append(el('p', { class: 'nota', text: 'Este celular (ou este navegador) não oferece a digital para aplicativos da web. A entrada continua pela senha.' }));
    } else {
      caixa.append(el('p', { class: 'nota', text: 'Abra o cofre com a digital, sem digitar a senha. Quem confere a digital é o próprio Android; o app nunca vê a digital nem grava a senha.' }),
        el('div', { class: 'botoes-linha' }, el('button', { class: 'botao primario', type: 'button', onclick: ligarDigital }, icone('digital', 18), ' Ligar a digital')));
    }
  })();
  return caixa;
}

async function ligarDigital() {
  const senha = await pedirSenha('Ligar a digital', 'Digite a senha mestra uma vez. Depois o celular vai pedir a digital (talvez duas vezes) e perguntar onde salvar a chave: escolha o Gerenciador de Senhas do Google.');
  if (!senha) return;
  try {
    const reg = await criarDigital(SESSAO.chaves, senha);
    await idbSet('digital', { ...reg, criadoEm: agoraISO(), ultimaSenha: agoraISO() });
    avisar('Digital ligada. Na próxima vez que abrir o app, basta a digital.');
    renderizar();
  } catch (e) {
    if (e && e.semPrf) avisar('Este celular não oferece o recurso seguro da digital para aplicativos da web. A entrada continua pela senha.', 'atencao');
    else if (e && e.name === 'NotAllowedError') avisar('Digital cancelada. Nada foi alterado.', 'atencao');
    else if (e && e.name === 'OperationError') { avisar('Senha incorreta.', 'erro'); registrarErroSenha(); }
    else { console.error(e); avisar('Não foi possível ligar a digital: ' + (e && e.message ? e.message : 'erro desconhecido') + '.', 'erro'); }
  }
}

// ===================== 15 - Nuvem: sincronização automática com o Google Drive (só no celular) =====================
// O celular conversa direto com o Google Drive do Dr. Nelson, com a permissão mínima do Google ("drive.file"):
// o aplicativo só enxerga a pasta e o arquivo que ele mesmo criou (Meu Drive › Organizador Financeiro - dados ›
// financas.cofre), nunca os outros arquivos do Drive. O arquivo sobe e desce já CIFRADO; senha e chave
// nunca saem do aparelho. A regra de segurança do celular só libera conexão com www.googleapis.com.
// O computador não usa nada disto: grava na mesma pasta pelo Google Drive instalado no Windows e
// confere a cada 20 segundos se o celular mandou algo (vigiarArquivo, em 07-ui-base.js).
//
// Entrada no Google: o app vai ao Google e volta com uma autorização válida por 1 hora, guardada só na
// memória desta sessão (sessionStorage; some ao fechar o app). Ao abrir o app, se a sincronização estiver
// ligada, essa ida ao Google acontece sozinha, antes da senha (quando já há permissão, volta na hora).

const NUVEM_CLIENTE = '53324041382-baitec7knkt671r1740c6ish2obr07mk.apps.googleusercontent.com'; // ID público do app (projeto organizador-financeiro-510215 no Google Cloud do Dr. Nelson). Não é segredo. Vazio = recurso escondido.
const NUVEM = {
  cliente: NUVEM_CLIENTE,
  API: 'https://www.googleapis.com/drive/v3',
  ENVIO: 'https://www.googleapis.com/upload/drive/v3',
  ESCOPO: 'https://www.googleapis.com/auth/drive.file',
  PASTA: 'Organizador Financeiro - dados', // nome diferente da pasta do programa (Documentos), para não confundir
  ARQUIVO: 'financas.cofre',
  estado: 'desligada', // desligada | pronta | sincronizando | ok | entrar | sem-internet | erro
  erro: '', ultimo: null, versao: null, assinRemota: null, aviso: '',
};
const _NK = { cfg: 'of-nuvem', token: 'of-nuvem-token', estado: 'of-nuvem-estado', tentou: 'of-nuvem-tentou', entrar: 'of-nuvem-precisa-entrar', depois: 'of-nuvem-depois' };
const nuvemDisponivel = () => MODO_CELULAR && !!NUVEM.cliente;

// ---------- Configuração local (fora do cofre: precisa existir antes da senha) ----------
// Guarda só se está ligada e os códigos da pasta/arquivo no Drive. Nenhum dado financeiro.
// "conta" é o e-mail da conta Google usada, para a volta automática ao Google escolher a conta certa.
function lerCfgNuvem() {
  try { const c = JSON.parse(localStorage.getItem(_NK.cfg)); if (c && typeof c === 'object') return c; } catch { /* vazio */ }
  return { ligada: false, pastaId: null, arquivoId: null, conta: null };
}
function gravarCfgNuvem(c) {
  const conta = typeof c.conta === 'string' && /^[^\s@]{1,64}@[^\s@]{1,190}$/.test(c.conta) ? c.conta : null;
  try { localStorage.setItem(_NK.cfg, JSON.stringify({ ligada: !!c.ligada, pastaId: c.pastaId || null, arquivoId: c.arquivoId || null, conta })); } catch { /* ignora */ }
}
const nuvemLigada = () => nuvemDisponivel() && lerCfgNuvem().ligada;

function _ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch { /* ignora */ } return null; }
function _lerToken() {
  try { const t = JSON.parse(_ss(_NK.token)); return t && typeof t.t === 'string' && t.exp > Date.now() ? t : null; } catch { return null; }
}
const nuvemTemToken = () => !!_lerToken();

// ---------- Ida e volta ao Google ----------
function nuvemRetorno() { return new URL('./', location.href).href; }

function nuvemIrAoGoogle(interativo, depois) {
  const b = new Uint8Array(16); crypto.getRandomValues(b);
  const estado = Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
  _ss(_NK.estado, estado);
  _ss(_NK.depois, depois || null);
  const p = new URLSearchParams({
    client_id: NUVEM.cliente, redirect_uri: nuvemRetorno(), response_type: 'token', scope: NUVEM.ESCOPO,
    state: estado, include_granted_scopes: 'false', prompt: interativo ? 'select_account' : 'none',
  });
  const conta = lerCfgNuvem().conta;
  if (conta && !interativo) p.set('login_hint', conta);
  const destino = 'https://accounts.google.com/o/oauth2/v2/auth?' + p.toString();
  // a ida silenciosa não fica no histórico (o "voltar" do celular não cai na página do Google)
  if (interativo) location.assign(destino); else location.replace(destino);
}

// Lê a resposta do Google que volta no endereço (depois do "#"). Função pura, para poder ser testada.
function lerRespostaDoGoogle(hash, estadoEsperado, agora) {
  const p = new URLSearchParams(String(hash || '').replace(/^#/, ''));
  if (!p.has('access_token') && !p.has('error')) return null;
  if (!estadoEsperado || p.get('state') !== estadoEsperado) return { tipo: 'recusada' };
  if (p.has('error')) return { tipo: 'erro', erro: p.get('error') };
  const escopos = (p.get('scope') || '').split(/\s+/);
  if (!escopos.includes(NUVEM.ESCOPO)) return { tipo: 'erro', erro: 'escopo' };
  const seg = Number(p.get('expires_in')) || 3600;
  return { tipo: 'ok', token: { t: p.get('access_token'), exp: agora + Math.max(60, seg - 120) * 1000 } };
}

// Chamado no começo do app (antes da senha). Devolve true se saiu da página para ir ao Google.
async function nuvemAoIniciar() {
  if (!nuvemDisponivel()) return false;
  const esperado = _ss(_NK.estado);
  const r = lerRespostaDoGoogle(location.hash, esperado, Date.now());
  if (r) {
    history.replaceState(null, '', location.pathname + location.search); // a autorização não fica no endereço
    _ss(_NK.estado, null);
    if (r.tipo === 'ok') {
      _ss(_NK.token, JSON.stringify(r.token));
      _ss(_NK.entrar, null);
      const c = lerCfgNuvem(); c.ligada = true; gravarCfgNuvem(c);
    } else if (r.tipo === 'recusada') {
      // sem pedido em aberto, é só uma resposta antiga (ex.: botão "voltar"): ignora em silêncio
      if (esperado) NUVEM.aviso = 'Uma resposta do Google foi recusada por não ter sido pedida por este aparelho.';
    } else if (r.erro === 'access_denied' || r.erro === 'escopo') {
      NUVEM.aviso = r.erro === 'escopo'
        ? 'O Google não deu a permissão de acesso à pasta do app. Tente ligar de novo e marque a permissão.'
        : 'O Google não recebeu permissão. A sincronização não foi ligada.';
      _ss(_NK.depois, null);
    } else {
      _ss(_NK.entrar, '1'); // precisa escolher a conta ou entrar de novo: o app mostra um botão
    }
    return false;
  }
  if (!nuvemLigada() || nuvemTemToken() || _ss(_NK.tentou) || _ss(_NK.entrar) || !navigator.onLine) return false;
  if (!(await _googleAcessivel())) return false; // sem internet de verdade: não sai do app (abriria uma página de erro)
  _ss(_NK.tentou, '1'); // uma tentativa silenciosa por sessão, para nunca entrar em ciclo
  nuvemIrAoGoogle(false);
  return true;
}

async function _googleAcessivel() {
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 4000);
    await fetch(NUVEM.API + '/about?fields=kind', { cache: 'no-store', credentials: 'omit', signal: ctl.signal });
    clearTimeout(t);
    return true; // qualquer resposta (mesmo "não autorizado") prova que há internet
  } catch { return false; }
}

// ---------- Chamadas ao Drive ----------
function _erroNuvem(tipo, detalhe) { const e = new Error(tipo); e.nuvem = tipo; e.detalhe = detalhe; return e; }

async function _api(metodo, url, { corpo, tipo, texto = false } = {}) {
  const tk = _lerToken();
  if (!tk) throw _erroNuvem('entrar');
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 30000);
  let r;
  try {
    r = await fetch(url, { method: metodo, headers: Object.assign({ Authorization: 'Bearer ' + tk.t }, tipo ? { 'Content-Type': tipo } : {}),
      body: corpo, cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer', signal: ctl.signal });
  } catch { throw _erroNuvem('rede'); } finally { clearTimeout(t); }
  if (r.status === 401) { _ss(_NK.token, null); throw _erroNuvem('entrar'); }
  if (r.status === 404) throw _erroNuvem('sumiu');
  if (!r.ok) { let d = ''; try { d = (await r.text()).slice(0, 300); } catch { /* sem detalhe */ } throw _erroNuvem(r.status === 403 || r.status === 429 ? 'limite' : 'servidor', r.status + ' ' + d); }
  return texto ? r.text() : r.json();
}

const _q = (s) => "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
const CAMPOS_ARQ = 'id,name,version,modifiedTime,trashed,parents';

async function _procurar(q) {
  const u = NUVEM.API + '/files?' + new URLSearchParams({ q, spaces: 'drive', pageSize: '10', orderBy: 'modifiedTime desc', fields: 'files(' + CAMPOS_ARQ + ')' });
  return ((await _api('GET', u)).files || []).filter((f) => !f.trashed);
}
async function _metaArquivo(id) {
  try { const m = await _api('GET', NUVEM.API + '/files/' + encodeURIComponent(id) + '?fields=' + CAMPOS_ARQ); return m.trashed ? null : m; } catch (e) { if (e.nuvem === 'sumiu') return null; throw e; }
}
async function _baixarEnvelope(id) {
  const txt = await _api('GET', NUVEM.API + '/files/' + encodeURIComponent(id) + '?alt=media', { texto: true });
  if (!txt || txt.length > ARMAZ.MAX_BYTES) return null;
  try { const o = JSON.parse(txt); return envelopeValido(o) ? o : null; } catch { return null; }
}
async function _subirEnvelope(id, env) {
  return _api('PATCH', NUVEM.ENVIO + '/files/' + encodeURIComponent(id) + '?uploadType=media&fields=' + CAMPOS_ARQ,
    { corpo: JSON.stringify(env), tipo: 'application/octet-stream' });
}
async function _criarPasta() {
  return _api('POST', NUVEM.API + '/files?fields=id', { corpo: JSON.stringify({ name: NUVEM.PASTA, mimeType: 'application/vnd.google-apps.folder' }), tipo: 'application/json; charset=UTF-8' });
}
async function _criarArquivo(pastaId, env) {
  const fr = 'fronteira' + uid();
  const corpo = new Blob([
    '--' + fr + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n',
    JSON.stringify({ name: NUVEM.ARQUIVO, parents: [pastaId], mimeType: 'application/octet-stream' }),
    '\r\n--' + fr + '\r\nContent-Type: application/octet-stream\r\n\r\n', JSON.stringify(env), '\r\n--' + fr + '--',
  ]);
  return _api('POST', NUVEM.ENVIO + '/files?uploadType=multipart&fields=' + CAMPOS_ARQ, { corpo, tipo: 'multipart/related; boundary=' + fr });
}

// Acha o financas.cofre do app (o Google só mostra ao app os arquivos criados por ele).
async function _localizarArquivo() {
  const c = lerCfgNuvem();
  if (c.arquivoId) { const m = await _metaArquivo(c.arquivoId); if (m) return m; }
  const achados = await _procurar('name = ' + _q(NUVEM.ARQUIVO) + " and mimeType != 'application/vnd.google-apps.folder' and trashed = false");
  const m = achados[0] || null;
  if (m) gravarCfgNuvem({ ...c, arquivoId: m.id, pastaId: (m.parents || [])[0] || c.pastaId });
  return m;
}
async function _localizarOuCriarPasta() {
  const c = lerCfgNuvem();
  if (c.pastaId) { const m = await _metaArquivo(c.pastaId); if (m) return m.id; }
  const achadas = await _procurar('name = ' + _q(NUVEM.PASTA) + " and mimeType = 'application/vnd.google-apps.folder' and trashed = false");
  const id = achadas[0] ? achadas[0].id : (await _criarPasta()).id;
  gravarCfgNuvem({ ...lerCfgNuvem(), pastaId: id });

}

// ---------- Sincronizar: baixa o que mudou no Drive, junta, e sobe o que só existe aqui ----------
let _nuvemOcupada = false, _nuvemDeNovo = false;

async function nuvemSincronizar({ silencioso = true } = {}) {
  if (!nuvemLigada() || !SESSAO.chave || !DB) return;
  if (_nuvemOcupada) { _nuvemDeNovo = true; return; }
  if (!nuvemTemToken()) { _nuvemEstado('entrar'); if (!silencioso) nuvemPedirEntrada(); return; }
  _nuvemOcupada = true;
  _nuvemEstado('sincronizando');
  let resultado = null;
  try {
    resultado = await _sincronizarUmaVez();
    if (!NUVEM.contaConferida) { // uma vez por sessão (a conta pode ter sido trocada ao entrar)
      try { const a = await _api('GET', NUVEM.API + '/about?fields=user(emailAddress)'); gravarCfgNuvem({ ...lerCfgNuvem(), conta: a.user && a.user.emailAddress }); NUVEM.contaConferida = true; } catch { /* opcional */ }
    }
    NUVEM.ultimo = agoraISO();
    _nuvemEstado('ok');
    if (resultado.recebido && resultado.recebido.mudou) avisar('Do computador: ' + textoDoQueChegou(resultado.recebido) + '.');
    else if (!silencioso) avisar(resultado.criado ? 'Pronto: o cofre foi criado no seu Google Drive.' : resultado.enviado ? 'Sincronizado: o que foi lançado aqui já está no Drive.' : 'Tudo igual ao computador.');
  } catch (e) {
    if (e.outroCofre) {
      NUVEM.erro = 'O arquivo do Drive é de outro cofre (outra senha). Nada foi apagado nem sobrescrito.';
      _nuvemEstado('erro');
      avisar(NUVEM.erro, 'erro');
    } else if (e.versaoNova) {
      NUVEM.erro = 'O computador já está numa versão mais nova do app. Feche e abra o app do celular (com internet) para ele se atualizar. Nada foi perdido.';
      _nuvemEstado('erro');
      if (!silencioso) avisar(NUVEM.erro, 'atencao');
    } else if (e.nuvem === 'entrar') {
      _nuvemEstado('entrar');
      if (!silencioso) nuvemPedirEntrada();
    } else if (e.nuvem === 'rede') {
      _nuvemEstado('sem-internet');
      if (!silencioso) avisar('Sem internet agora. O que foi lançado fica guardado aqui e sobe na próxima vez.', 'atencao');
    } else {
      console.error('Sincronização:', e.message, e.detalhe || '');
      NUVEM.erro = e.nuvem === 'limite' ? 'O Google pediu para esperar um pouco. Tente de novo em alguns minutos.' : 'O Google Drive não respondeu direito. Tente de novo daqui a pouco.';
      _nuvemEstado('erro');
      if (!silencioso) avisar(NUVEM.erro, 'erro');
    }
  } finally {
    _nuvemOcupada = false;
    if (_nuvemDeNovo) { _nuvemDeNovo = false; setTimeout(() => nuvemSincronizar(), 500); }
  }
  return resultado;
}

async function _sincronizarUmaVez() {
  const r = { criado: false, recebido: null, enviado: false };
  await descarregarGravacao();
  let meta = await _localizarArquivo();
  if (!meta) {
    // primeira vez: cria a pasta e o arquivo com o cofre deste aparelho
    const pastaId = await _localizarOuCriarPasta();
    const assin = assinaturaDB(DB); const env = SESSAO.ultimoEnv;
    meta = await _criarArquivo(pastaId, env);
    gravarCfgNuvem({ ...lerCfgNuvem(), pastaId, arquivoId: meta.id });
    NUVEM.versao = meta.version; NUVEM.assinRemota = assin;
    r.criado = r.enviado = true;
    return r;
  }
  for (let volta = 0; volta < 3; volta++) {
    if (meta.version !== NUVEM.versao || NUVEM.assinRemota == null) {
      const env = await _baixarEnvelope(meta.id);
      if (env) {
        const remoto = await dadosDoMesmoCofre(env);
        const j = juntarDados(remoto);
        if (j.mudou) { mudou(); await descarregarGravacao(); }
        r.recebido = r.recebido ? { novos: r.recebido.novos + j.novos, atualizados: r.recebido.atualizados + j.atualizados, mudou: r.recebido.mudou || j.mudou } : j;
        NUVEM.assinRemota = assinaturaDB(remoto);
      } else {
        NUVEM.assinRemota = ''; // arquivo vazio ou danificado: o deste aparelho vai por cima
      }
      NUVEM.versao = meta.version;
    }
    await descarregarGravacao();
    const assin = assinaturaDB(DB); const env = SESSAO.ultimoEnv; // mesma foto dos dados
    if (assin === NUVEM.assinRemota) return r;
    // antes de subir, confere se o computador não gravou nesse meio-tempo (se gravou, junta de novo)
    const agora = await _metaArquivo(meta.id);
    if (!agora) { gravarCfgNuvem({ ...lerCfgNuvem(), arquivoId: null }); NUVEM.versao = null; NUVEM.assinRemota = null; return _sincronizarUmaVez(); }
    if (agora.version !== NUVEM.versao) { meta = agora; continue; }
    const novo = await _subirEnvelope(meta.id, env);
    NUVEM.versao = novo.version; NUVEM.assinRemota = assin;
    r.enviado = true;
    return r;
  }
  throw _erroNuvem('servidor', 'o arquivo mudou três vezes seguidas durante a sincronização');
}

// Depois de cada gravação no celular: sobe em alguns segundos (junta vários lançamentos seguidos num envio só).
const _nuvemAgendar = debounce(() => nuvemSincronizar(), 4000);
function nuvemAposSalvar() {
  if (!nuvemLigada() || !DB) return;
  if (NUVEM.assinRemota != null && assinaturaDB(DB) === NUVEM.assinRemota) return;
  if (nuvemTemToken()) _nuvemAgendar(); else _nuvemEstado('entrar');
}
function nuvemPendente() { return nuvemLigada() && !!DB && NUVEM.assinRemota != null && assinaturaDB(DB) !== NUVEM.assinRemota; }

// Depois da senha: sincroniza sozinho; e de novo ao voltar para o app e quando a internet volta.
let _nuvemEventos = false;
function nuvemAposDesbloquear() {
  if (!nuvemDisponivel()) return;
  if (NUVEM.aviso) { avisar(NUVEM.aviso, 'atencao'); NUVEM.aviso = ''; }
  if (!_nuvemEventos) {
    _nuvemEventos = true;
    document.addEventListener('visibilitychange', () => {
      if (!SESSAO.chave || !nuvemLigada()) return;
      if (document.visibilityState === 'visible' || nuvemPendente()) nuvemSincronizar();
    });
    window.addEventListener('online', () => { if (SESSAO.chave && nuvemLigada()) nuvemSincronizar(); });
    // a cada 1 minuto, com o app aberto e à vista: confere se o computador mandou algo (uma consulta pequena)
    setInterval(() => {
      if (!SESSAO.chave || !nuvemLigada() || document.visibilityState !== 'visible' || !nuvemTemToken() || _nuvemOcupada) return;
      nuvemSincronizar();
    }, 60000);
  }
  if (!nuvemLigada()) return;
  if (_ss(_NK.entrar) && !nuvemTemToken()) { _nuvemEstado('entrar'); return; }
  nuvemSincronizar();
}
