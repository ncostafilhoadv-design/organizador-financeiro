// ---------- Celular: puxar a tela para baixo sincroniza ----------
// O gesto padrão do Chrome recarregaria a página, e recarregar fecha o cofre (a chave só existe na memória).
// Por isso o recarregar do navegador fica desligado no app do celular (CSS .sem-recarregar), e o mesmo gesto,
// feito no topo da tela, passa a sincronizar com o Drive. No computador, atualizar a página continua sendo só recarregar.
function iniciarPuxarParaSincronizar() {
  if (!MODO_CELULAR) return;
  document.documentElement.classList.add('sem-recarregar');
  const LIMITE = 70;
  let inicioY = null, puxado = 0, ind = null;
  const mostrar = (d) => {
    if (!ind) { ind = el('div', { class: 'puxar-sinc', 'aria-hidden': 'true' }, icone('repetir', 18), el('span')); document.body.appendChild(ind); }
    ind.style.transform = 'translate(-50%, ' + (Math.min(d, 110) - 44) + 'px)';
    ind.classList.toggle('pronto', d >= LIMITE);
    ind.lastChild.textContent = d >= LIMITE ? 'Solte para sincronizar' : 'Puxe para sincronizar';
  };
  const esconder = () => { if (ind) { ind.remove(); ind = null; } };
  document.addEventListener('touchstart', (e) => {
    const c = $('#conteudo');
    inicioY = null;
    if (!SESSAO.chave || !c || !c.contains(e.target) || c.scrollTop > 0 || e.touches.length !== 1 || document.querySelector('dialog[open]')) return;
    inicioY = e.touches[0].clientY; puxado = 0;
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (inicioY == null) return;
    const c = $('#conteudo');
    if (!c || c.scrollTop > 0) { inicioY = null; esconder(); return; }
    puxado = (e.touches[0].clientY - inicioY) * 0.6;
    if (puxado > 8) mostrar(puxado); else esconder();
  }, { passive: true });
  const soltar = () => {
    if (inicioY == null) return;
    const disparar = puxado >= LIMITE;
    inicioY = null; esconder();
    if (disparar) botaoSincronizarTopo();
  };
  document.addEventListener('touchend', soltar, { passive: true });
  document.addEventListener('touchcancel', () => { inicioY = null; esconder(); }, { passive: true });
}

// ===================== 16 - Registro de lançamentos (em Configurações) =====================
// Visão de análise: todos os lançamentos (entradas, saídas e transferências), organizados pelo mês de
// referência, com subtotais, filtros e período próprio (inclusive "Tudo"). Os totais de Entradas, Saídas e
// do Painel levam para cá já filtrados (abrirRegistro). As listas de Entradas e Saídas continuam iguais.

ESTADO.config = 'ajustes';
ESTADO.registro = { tipo: 'todos', periodo: { tipo: 'mes', mes: null }, filtros: {}, ordem: 'data-desc', origem: null, limite: 400 };

const ORDENS_REGISTRO = [['data-desc', 'Data (mais nova primeiro)'], ['data-asc', 'Data (mais antiga primeiro)'], ['valor-desc', 'Maior valor primeiro'], ['recentes', 'Últimos lançados ou editados']];
const TIPOS_REGISTRO = [['todos', 'Tudo'], ['entrada', 'Entradas'], ['saida', 'Saídas'], ['transferencia', 'Transferências']];

// Leva ao registro já filtrado. periodo: objeto {tipo, mes} ou 'tudo'. origem: {aba, rotulo} para o "Voltar".
function abrirRegistro({ tipo = 'todos', periodo, filtros = {}, ordem = 'data-desc', origem = null } = {}) {
  const r = ESTADO.registro;
  r.tipo = tipo;
  const base = periodo && periodo !== 'tudo' ? periodo : ESTADO.periodo;
  r.periodo = completarPeriodo(periodo === 'tudo' ? { tipo: 'tudo', mes: ESTADO.periodo.mes || mesAtual() } : { tipo: base.tipo, mes: base.mes });
  r.filtros = { ...filtros };
  r.ordem = ordem;
  r.origem = origem;
  r.limite = 400;
  ESTADO.config = 'registro';
  irPara('ajustes');
}

// ---------- Período do registro ----------
// Por mês de referência: mes, 3m, 6m, 12m, ano, meses (entre meses), anos (entre anos), tudo.
// Por data: dia (um dia) e intervalo (entre datas), pela data do vencimento ou do pagamento (p.base).
const TIPOS_PERIODO_REG = [['mes', 'Um mês'], ['3m', '3 meses'], ['6m', '6 meses'], ['12m', '12 meses'], ['ano', 'Um ano'], ['tudo', 'Tudo'],
  ['dia', 'Um dia'], ['intervalo', 'Entre duas datas'], ['meses', 'Entre meses'], ['anos', 'Entre anos']];
const periodoPorData = (p) => p.tipo === 'dia' || p.tipo === 'intervalo';
const ordenarPar = (a, b) => (a <= b ? [a, b] : [b, a]);

function completarPeriodo(p) {
  const hoje = hojeISO(), mes = mesAtual();
  if (!p.mes) p.mes = mes;
  if (!p.dia) p.dia = hoje;
  if (!p.de) p.de = mes + '-01';
  if (!p.ate) p.ate = hoje;
  if (!p.deMes) p.deMes = addMeses(mes, -2);
  if (!p.ateMes) p.ateMes = mes;
  if (!p.deAno) p.deAno = mes.slice(0, 4);
  if (!p.ateAno) p.ateAno = mes.slice(0, 4);
  if (p.base !== 'pagamento') p.base = 'vencimento';
  return p;
}

// Devolve a função que diz se o lançamento está no período, e a chave de agrupamento (mês) de cada um.
function filtroDoPeriodo(p) {
  completarPeriodo(p);
  const dataBase = (l) => (p.base === 'pagamento' ? (l.status === 'pago' ? dataEfetiva(l) : null) : l.data);
  switch (p.tipo) {
    case 'tudo': return { ok: () => true, mes: (l) => l.competencia };
    case 'dia': return { ok: (l) => dataBase(l) === p.dia, mes: (l) => mesDe(dataBase(l)) };
    case 'intervalo': { const [a, b] = ordenarPar(p.de, p.ate); return { ok: (l) => { const d = dataBase(l); return !!d && d >= a && d <= b; }, mes: (l) => mesDe(dataBase(l)) }; }
    case 'meses': { const [a, b] = ordenarPar(p.deMes, p.ateMes); return { ok: (l) => l.competencia >= a && l.competencia <= b, mes: (l) => l.competencia }; }
    case 'anos': { const [a, b] = ordenarPar(p.deAno, p.ateAno); return { ok: (l) => { const y = l.competencia.slice(0, 4); return y >= a && y <= b; }, mes: (l) => l.competencia }; }
    default: { const set = new Set(mesesDoPeriodo(p)); return { ok: (l) => set.has(l.competencia), mes: (l) => l.competencia }; }
  }
}

function anosDisponiveis() {
  let min = Number(mesAtual().slice(0, 4)), max = min + 1;
  for (const l of DB.lancamentos) { const y = Number(l.competencia.slice(0, 4)); if (y < min) min = y; if (y > max) max = y; }
  const r = []; for (let y = max; y >= min; y--) r.push(String(y));
  return r;
}

function barraPeriodoRegistro(aoMudar) {
  const p = completarPeriodo(ESTADO.registro.periodo);
  const mudar = (fn) => (e) => { fn(e && e.target ? e.target.value : e); aoMudar(); };
  const selTipo = seletor(TIPOS_PERIODO_REG, p.tipo, { 'aria-label': 'Tipo de período', class: 'sel-periodo' });
  selTipo.addEventListener('change', mudar((v) => { p.tipo = v; }));
  const inp = (tipo, valor, aoMudarV, rotulo) => { const i = el('input', { type: tipo, value: valor, 'aria-label': rotulo }); i.addEventListener('change', mudar((v) => { if (v) aoMudarV(v); })); return i; };
  const selAno = (valor, aoMudarV, rotulo) => { const s = seletor(anosDisponiveis().map((y) => [y, y]), valor, { 'aria-label': rotulo }); s.addEventListener('change', mudar(aoMudarV)); return s; };
  const passo = p.tipo === 'ano' ? 12 : p.tipo === 'mes' ? 1 : { '3m': 3, '6m': 6, '12m': 12 }[p.tipo] || 1;
  const setas = (rotulo) => el('div', { class: 'navegador-mes' },
    el('button', { class: 'botao-icone', type: 'button', 'aria-label': 'Período anterior', onclick: () => { p.mes = addMeses(p.mes, -passo); aoMudar(); } }, icone('esquerda', 18)),
    el('strong', { class: 'periodo-rotulo', text: rotulo }),
    el('button', { class: 'botao-icone', type: 'button', 'aria-label': 'Próximo período', onclick: () => { p.mes = addMeses(p.mes, passo); aoMudar(); } }, icone('direita', 18)));
  const base = () => { const s = seletor([['vencimento', 'pela data do vencimento'], ['pagamento', 'pela data do pagamento (só os pagos)']], p.base, { 'aria-label': 'Qual data considerar' }); s.addEventListener('change', mudar((v) => { p.base = v; })); return s; };
  const rot = (texto, controle) => el('label', { class: 'rotulo-inline' }, texto, controle);
  let detalhe;
  switch (p.tipo) {
    case 'mes': detalhe = [setas(capitalizar(nomeMes(p.mes))), inp('month', p.mes, (v) => { p.mes = v; }, 'Escolher o mês')]; break;
    case '3m': case '6m': case '12m': detalhe = [setas(rotuloPeriodo(p)), rot('até ', inp('month', p.mes, (v) => { p.mes = v; }, 'Último mês'))]; break;
    case 'ano': detalhe = [setas('Ano de ' + p.mes.slice(0, 4)), selAno(p.mes.slice(0, 4), (v) => { p.mes = v + p.mes.slice(4); }, 'Escolher o ano')]; break;
    case 'tudo': detalhe = [el('strong', { class: 'periodo-rotulo', text: 'Todos os meses' })]; break;
    case 'dia': detalhe = [inp('date', p.dia, (v) => { p.dia = v; }, 'Dia'), base()]; break;
    case 'intervalo': detalhe = [rot('de ', inp('date', p.de, (v) => { p.de = v; }, 'Data inicial')), rot('até ', inp('date', p.ate, (v) => { p.ate = v; }, 'Data final')), base()]; break;
    case 'meses': detalhe = [rot('de ', inp('month', p.deMes, (v) => { p.deMes = v; }, 'Mês inicial')), rot('até ', inp('month', p.ateMes, (v) => { p.ateMes = v; }, 'Mês final'))]; break;
    case 'anos': detalhe = [rot('de ', selAno(p.deAno, (v) => { p.deAno = v; }, 'Ano inicial')), rot('até ', selAno(p.ateAno, (v) => { p.ateAno = v; }, 'Ano final'))]; break;
    default: detalhe = [];
  }
  const voltarHoje = ['mes', '3m', '6m', '12m', 'ano'].includes(p.tipo) && p.mes !== mesAtual()
    ? el('button', { class: 'link-botao', type: 'button', text: 'Voltar para hoje', onclick: () => { p.mes = mesAtual(); aoMudar(); } }) : null;
  return el('div', { class: 'barra-filtros barra-periodo-reg' }, rot('Período ', selTipo), ...detalhe, voltarHoje);
}

function filtrarRegistro() {
  const r = ESTADO.registro, f = r.filtros;
  const noPeriodo = filtroDoPeriodo(r.periodo).ok;
  const busca = normalizar(f.busca);
  const hoje = hojeISO();
  return DB.lancamentos.filter((l) => {
    if (r.tipo !== 'todos' && l.tipo !== r.tipo) return false;
    if (!noEscopo(l)) return false;
    if (!noPeriodo(l)) return false;
    if (f.categoriaId && (l.categoriaId || '') !== f.categoriaId) return false;
    if (f.contaId && l.contaId !== f.contaId && l.contaDestinoId !== f.contaId) return false;
    if (f.status === 'misturado') { if (!ehMisturado(l)) return false; }
    else if (f.status === 'atrasado') { if (!(l.status === 'pendente' && l.data < hoje)) return false; }
    else if (f.status && l.status !== f.status) return false;
    if (busca) {
      const parceiros = (l.divisao || []).map((d) => nomePessoa(d.parceiroId)).join(' ');
      const alvo = normalizar([l.descricao, l.pessoa, l.obs, parceiros, nomeCategoria(l.categoriaId), nomeConta(l.contaId), l.contaDestinoId ? nomeConta(l.contaDestinoId) : '', numeroBR(l.valor)].join(' '));
      if (!busca.split(/\s+/).every((p) => alvo.includes(p))) return false;
    }
    return true;
  });
}

function ordenarRegistro(itens) {
  const o = ESTADO.registro.ordem;
  if (o === 'recentes') return itens.sort((a, b) => (a.atualizadoEm < b.atualizadoEm ? 1 : -1));
  if (o === 'valor-desc') return itens.sort((a, b) => b.valor - a.valor || porDataDesc(a, b));
  return itens.sort(o === 'data-asc' ? porDataAsc : porDataDesc);
}

function totaisRegistro(itens) {
  const t = { ent: 0, entPago: 0, sai: 0, saiPago: 0, transf: 0 };
  for (const l of itens) {
    if (l.tipo === 'entrada') { t.ent += l.valor; if (l.status === 'pago') t.entPago += l.valor; }
    else if (l.tipo === 'saida') { t.sai += l.valor; if (l.status === 'pago') t.saiPago += l.valor; }
    else t.transf += l.valor;
  }
  return t;
}

function situacaoTexto(l) {
  if (l.tipo === 'transferencia') return l.status === 'pago' ? 'Feita' : 'Agendada';
  if (l.status === 'pago') return (l.tipo === 'entrada' ? 'Recebido' : 'Pago') + (l.pagoEm && l.pagoEm !== l.data ? ' em ' + dataBR(l.pagoEm).slice(0, 5) : '');
  if (l.data < hojeISO()) return 'Atrasado';
  return l.tipo === 'entrada' ? 'A receber' : 'A pagar';
}

  const abrir = () => abrirFormLancamento({ lanc: l });
  return el('div', { class: ['reg-linha', 'tipo-' + l.tipo, l.status === 'pendente' ? 'pendente' : '', atrasado ? 'atrasado' : ''], role: 'button', tabindex: 0,
    title: 'Abrir para ver ou editar', onclick: abrir, onkeydown: (e) => { if (e.key === 'Enter') abrir(); } },

  const r = ESTADO.registro, f = r.filtros;

  const selConta = seletor([['', 'Todas as contas'], ...contasDoEscopo(true).map((c) => [c.id, c.nome])], f.contaId || '', { 'aria-label': 'Conta' });

    temFiltro ? el('button', { class: 'link-botao', type: 'button', text: 'Limpar filtros', onclick: () => { r.filtros = {}; renderizar(); } }) : null,
    el('div', { class: 'espaco' }),

    if (r.tipo === 'todos') tiles.push(tileNumero({ rotulo: tot.ent - tot.sai >= 0 ? 'Sobrou' : 'Faltou', classe: 'resultado', valor: moeda(Math.abs(tot.ent - tot.sai)), sub: quantos }));
    else tiles[tiles.length - 1].appendChild(el('div', { class: 'tile-sub', text: quantos }));

  cont.appendChild(el('div', { class: 'grade-tiles compacta' }, tiles));

  // Lista: por mês de referência (com subtotais), ou corrida quando a ordem é "últimos lançados"
  const lista = el('div', { class: 'cartao reg-lista' }, cabecalhoRegistro());
  const visiveis = itens.slice(0, r.limite);

  } else {
    const chaveMes = filtroDoPeriodo(r.periodo).mes;
    const grupos = agrupar(visiveis, chaveMes);
    const chaves = Array.from(grupos.keys()).sort();
    if (r.ordem !== 'data-asc') chaves.reverse();
    for (const mes of chaves) {
      const ls = grupos.get(mes);
      const t = totaisRegistro(itens.filter((l) => chaveMes(l) === mes));
      const partes = [];
      if (t.ent) partes.push(el('span', { class: 'cor-texto-entrada valor', text: '+ ' + moeda(t.ent) }));
      if (t.sai) partes.push(el('span', { class: 'valor', text: '− ' + moeda(t.sai) }));
      if (t.ent && t.sai) partes.push(el('span', { class: 'valor reg-res', text: '= ' + (t.ent - t.sai < 0 ? '− ' : '') + moeda(Math.abs(t.ent - t.sai)) }));
      if (t.transf && r.tipo === 'transferencia') partes.push(el('span', { class: 'valor', text: moeda(t.transf) }));
      lista.appendChild(el('div', { class: 'reg-mes' },
        el('span', { text: capitalizar(nomeMes(mes)) + ' · ' + ls.length + (ls.length === 1 ? ' lançamento' : ' lançamentos') }),
        el('span', { class: 'reg-mes-totais' }, partes)));
      for (const l of ls) lista.appendChild(linhaRegistro(l));
    }
  }
  cont.appendChild(lista);
  if (itens.length > r.limite) {
    cont.appendChild(el('button', { class: 'botao largo', type: 'button', text: 'Mostrar mais (' + (itens.length - r.limite) + ' restantes)', onclick: () => { r.limite += 400; renderizar(); } }));
  }
  cont.appendChild(el('p', { class: 'nota', text: periodoPorData(r.periodo)
    ? 'Filtrado ' + (r.periodo.base === 'pagamento' ? 'pela data do pagamento (só os já pagos ou recebidos)' : 'pela data do vencimento') + '. Clique numa linha para ver ou editar.'
    : 'Organizado pelo mês de referência: compra no cartão aparece no mês da fatura; o resto, no mês do vencimento. Clique numa linha para ver ou editar.' }));
}

// ===================== 17 - Importar extrato (Configurações › Importar extrato) =====================
// Três formatos, sem internet e sem IA dentro do app:
//  - OFX: o extrato que o internet banking exporta (BB, Sicoob, Itaú…). Valores exatos do banco.
//  - CSV: planilha do banco (colunas de data, descrição e valor, ou débito/crédito).
//  - JSON "organizador-importacao": o arquivo que o Claude prepara a partir de um PDF ou print
//    (ver _projeto/IMPORTACAO-POR-IA.md), com saldo inicial e final para conferir a soma.
// Nada é gravado sem a tela de conferência: cada linha pode ser desmarcada, trocada de tipo e de categoria;
// linhas que parecem já lançadas vêm desmarcadas; o código da linha do banco (idExterno) evita importar duas vezes.

// ---------- Leitura dos arquivos (funções puras, testadas em testes-nucleo.mjs) ----------
function decodificarTexto(bytes) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); } catch { return new TextDecoder('windows-1252').decode(bytes); }
}

function centavosDeTexto(t) {
  let s = String(t == null ? '' : t).trim().replace(/R\$|\s/g, '');
  if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (/[-−]$/.test(s)) { neg = true; s = s.slice(0, -1); }
  if (/^[-−]/.test(s)) { neg = !neg; s = s.slice(1); }
  if (/[DC]$/i.test(s)) { if (/D$/i.test(s)) neg = true; s = s.slice(0, -1); }
  if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');   // 1.234,56
  else s = s.replace(/,/g, '');                                           // 1,234.56 ou 1234.56
  if (!/^\d+(\.\d+)?$/.test(s)) return null;
  const v = Math.round(parseFloat(s) * 100);
  return neg ? -v : v;
}

function dataDeTexto(t) {
  const s = String(t || '').trim();
  let m = s.match(/^(\d{4})-?(\d{2})-?(\d{2})/);
  if (m) return m[1] + '-' + m[2] + '-' + m[3];
  m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})/);
  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return y + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0'); }
  return null;
}

function lerOFX(texto) {
  const tag = (bloco, nome) => { const m = bloco.match(new RegExp('<' + nome + '>([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };
  const blocos = texto.split(/<STMTTRN>/i).slice(1).map((b) => b.split(/<\/STMTTRN>/i)[0]);
  const itens = [];
  for (const b of blocos) {
    const data = dataDeTexto(tag(b, 'DTPOSTED'));
    const valor = centavosDeTexto(tag(b, 'TRNAMT').replace(',', '.'));
    if (!data || !valor) continue;
    const nome = tag(b, 'NAME'), memo = tag(b, 'MEMO');
    const descricao = [nome, memo && memo !== nome ? memo : ''].filter(Boolean).join(' - ') || tag(b, 'TRNTYPE');
    itens.push({ data, valor, descricao, idExterno: tag(b, 'FITID') || null });
  }
  const saldo = texto.match(/<LEDGERBAL>[\s\S]*?<BALAMT>([^<\r\n]*)[\s\S]*?<DTASOF>([^<\r\n]*)/i);
  return {
    formato: 'OFX', cartao: /<CCSTMTRS>/i.test(texto), itens,
    conta: [tag(texto, 'BANKID') && 'banco ' + tag(texto, 'BANKID'), tag(texto, 'ACCTID') && 'conta ' + tag(texto, 'ACCTID')].filter(Boolean).join(', '),
    saldoFinal: saldo ? { valor: centavosDeTexto(saldo[1].replace(',', '.')), data: dataDeTexto(saldo[2]) } : null,
  };
}

function dividirCSV(linha, sep) {
  const r = []; let cur = '', aspas = false;
  for (let i = 0; i < linha.length; i++) {
    const ch = linha[i];
    if (aspas) { if (ch === '"') { if (linha[i + 1] === '"') { cur += '"'; i++; } else aspas = false; } else cur += ch; }
    else if (ch === '"') aspas = true;
    else if (ch === sep) { r.push(cur); cur = ''; }
    else cur += ch;
  }
  r.push(cur);
  return r.map((x) => x.trim());
}

function lerCSV(texto) {
  const linhas = texto.replace(/^﻿/, '').split(/\r?\n/).filter((l) => l.trim());
  if (linhas.length < 2) throw new Error('A planilha está vazia.');
  // o cabeçalho pode não estar na primeira linha (alguns bancos põem o nome da conta antes);
  // o separador (; , ou tabulação) é o que faz o cabeçalho aparecer
  let iCab = -1, cab = [], sep = ';';
  for (let i = 0; i < Math.min(linhas.length, 15) && iCab < 0; i++) {
    for (const s of [';', ',', '\t']) {
      const c = dividirCSV(linhas[i], s).map(normalizar);
      if (c.length > 1 && c.some((x) => /^data|^date|^dt/.test(x)) && c.some((x) => /valor|value|quantia|montante|debito|credito|entrada|saida/.test(x))) { iCab = i; cab = c; sep = s; break; }
    }
  }
  if (iCab < 0) throw new Error('Não reconheci as colunas desta planilha (data, descrição e valor). Use o arquivo OFX do banco ou peça ao Claude para converter.');
  const acha = (re) => cab.findIndex((x) => re.test(x));
  const cData = acha(/^data|^date|^dt/);
  const cDesc = acha(/descri|histor|lancamento|memo|estabelec|detalhe|titulo/);
  const cValor = acha(/^valor|value|quantia|montante/);
  const cDeb = acha(/debito|saida/), cCred = acha(/credito|entrada/);
  const itens = [];
  for (const l of linhas.slice(iCab + 1)) {
    const c = dividirCSV(l, sep);
    const data = dataDeTexto(c[cData]);
    let valor = cValor >= 0 ? centavosDeTexto(c[cValor]) : null;
    if (valor == null && (cDeb >= 0 || cCred >= 0)) {
      const d = cDeb >= 0 ? centavosDeTexto(c[cDeb]) : null, cr = cCred >= 0 ? centavosDeTexto(c[cCred]) : null;
      valor = cr ? Math.abs(cr) : d ? -Math.abs(d) : null;
    }
    if (!data || !valor) continue; // linhas de saldo, totais e em branco ficam de fora
    const descricao = (cDesc >= 0 ? c[cDesc] : '') || 'Sem descrição';
    if (/^saldo/i.test(normalizar(descricao))) continue;
    itens.push({ data, valor, descricao, idExterno: null });
  }
  if (!itens.length) throw new Error('Não encontrei lançamentos nesta planilha.');
  return { formato: 'CSV', cartao: false, itens, conta: '', saldoFinal: null };
}

function lerJSONImportacao(o) {
  if (!o || o.formato !== 'organizador-importacao' || !Array.isArray(o.itens)) throw new Error('Este arquivo não é uma importação do Organizador.');
  const itens = o.itens.map((x) => ({
    data: dataDeTexto(x.data), valor: Number.isInteger(x.valor) ? x.valor : null, descricao: vTexto(x.descricao, 120) || 'Sem descrição',
    idExterno: x.idExterno ? vTexto(String(x.idExterno), 120) : null, categoria: vTexto(x.categoria, 80), pessoa: vTexto(x.pessoa, 100),
    obs: vTexto(x.obs, 500), duvida: x.duvida === true,
  })).filter((x) => x.data && x.valor);
  const cent = (v) => (Number.isInteger(v) ? v : null);
  return { formato: 'JSON', cartao: o.cartao === true, itens, conta: vTexto(o.origem, 200),
    saldoInicial: cent(o.saldoInicial), saldoFinal: cent(o.saldoFinal) != null ? { valor: o.saldoFinal, data: null } : null };
}

function lerArquivoExtrato(nome, bytes) {
  const texto = decodificarTexto(bytes);
  const t = texto.trim();
  if (t.startsWith('{')) { let o; try { o = JSON.parse(t); } catch { throw new Error('Arquivo JSON danificado.'); } return lerJSONImportacao(o); }
  if (/OFXHEADER|<OFX>/i.test(t)) return lerOFX(texto);
  return lerCSV(texto);
}

// ---------- Sugestão de categoria (histórico dele primeiro, depois palavras comuns) ----------
const PALAVRAS_VAZIAS = new Set(['pix', 'enviado', 'recebido', 'env', 'rec', 'compra', 'cartao', 'debito', 'credito', 'deb', 'cred', 'pagamento', 'pgto', 'pag',
  'transferencia', 'transf', 'ted', 'doc', 'tev', 'boleto', 'automatico', 'aut', 'visa', 'master', 'mastercard', 'elo', 'internet', 'banking', 'de', 'da', 'do',
  'das', 'dos', 'para', 'em', 'com', 'e', 'a', 'o', 'no', 'na', 'ltda', 'me', 'sa', 'eireli', 'epp', 'parc', 'parcela']);
function chaveDescricao(desc) {
  const p = normalizar(desc).replace(/[^a-z ]/g, ' ').split(/\s+/).filter((w) => w.length > 1 && !PALAVRAS_VAZIAS.has(w));
  return p.slice(0, 2).join(' ');
}
const REGRAS_CATEGORIA = [
  [/posto|combust|gasolina|ipiranga|shell|petrobras|br mania|uber|99 ?app|99pop|taxi|estacion|pedagio|sem parar|conectcar/, 'c-transporte'],
  [/farmac|drogar|droga raia|drogasil|pague menos|unimed|hapvida|amil|bradesco saude|hospital|clinic|laborat|odonto/, 'c-saude'],
  [/supermerc|mercado|atacad|assai|carrefour|extra hiper|pao de acucar|hortifruti|acougue/, 'c-mercado'],
  [/ifood|rappi|restaur|lanchon|padaria|pizz|burger|mc ?donald|bar e|cafe/, 'c-restaurantes'],
  [/tarifa|juros|iof|anuidade|pacote de servic|cesta de servic|manut.* conta/, 'c-tarifas'],
  [/netflix|spotify|prime video|amazon prime|disney|globoplay|youtube|google one|icloud|apple\.com|microsoft/, 'c-assinaturas'],
  [/energisa|cpfl|enel|elektro|sabesp|saneamento|agua e esgoto|vivo|claro|tim |oi fibra|net servic|sky/, 'c-contas-casa'],
  [/\boab\b|aasp|caasp/, 'c-oab'],
  [/custas|tjsp|tribunal|guia de recolh|gare|fundo especial|diligencia/, 'c-custas'],
  [/\bdas\b|simples nacional|\binss\b|darf|receita federal|carne.?leao|\biss\b/, 'c-impostos-e'],
  [/iptu|detran|ipva|licenciamento/, 'c-impostos-p'],
  [/aluguel|condominio/, 'c-moradia'],
];
function sugerirCategoria(desc, tipo) {
  const k = chaveDescricao(desc);
  if (k) {
    const cont = new Map();
    for (const l of DB.lancamentos) if (l.tipo === tipo && l.categoriaId && chaveDescricao(l.descricao) === k) cont.set(l.categoriaId, (cont.get(l.categoriaId) || 0) + 1);
    const melhor = [...cont.entries()].sort((a, b) => b[1] - a[1])[0];
    if (melhor && categoriaPorId(melhor[0])) return melhor[0];
  }
  if (tipo === 'saida') {
    const n = normalizar(desc);
    for (const [re, id] of REGRAS_CATEGORIA) if (re.test(n) && categoriaPorId(id)) return id;
  }
  return null;
}

// Parece já lançado? Mesmo código do banco, ou mesma conta, tipo e valor com data até 3 dias de diferença.
function acharDuplicado(linha, contaId) {
  const tipo = linha.valor < 0 ? 'saida' : 'entrada';
  const v = Math.abs(linha.valor);
  return DB.lancamentos.find((l) => (linha.idExterno && l.idExterno === linha.idExterno && l.contaId === contaId)
    || (l.contaId === contaId && l.tipo === tipo && l.valor === v && [l.data, l.pagoEm].some((d) => d && Math.abs(diffDias(d, linha.data)) <= 3))) || null;
}

// ---------- Tela ----------
ESTADO.importacao = null; // { nome, lido, contaId, linhas: [...] }

function prepararLinhas(imp) {
  const conta = contaPorId(imp.contaId);
  const cartao_ = !!conta && conta.tipo === 'cartao';
  imp.linhas = imp.lido.itens.map((x) => {
    const tipo = x.valor < 0 ? 'saida' : 'entrada';
    let acao = tipo;
    // no cartão, valor positivo é pagamento da fatura ou estorno: o pagamento se lança com "Pagar fatura"
    if (cartao_ && x.valor > 0) acao = 'ignorar';
    const catNome = x.categoria ? DB.categorias.find((c) => c.tipo === tipo && normalizar(c.nome) === normalizar(x.categoria)) : null;
    const dup = acharDuplicado(x, imp.contaId);
    return { ...x, acao, sel: !dup && acao !== 'ignorar', dup, categoriaId: catNome ? catNome.id : sugerirCategoria(x.descricao, tipo), contaDestinoId: '' };
  });
}

async function escolherExtrato() {
  const arq = await escolherArquivoPorInput(MODO_CELULAR ? '' : '.ofx,.qfx,.csv,.txt,.json');
  if (!arq) return;
  if (arq.size > 5 * 1024 * 1024) { avisar('Arquivo grande demais para um extrato.', 'erro'); return; }
  let lido;
  try { lido = lerArquivoExtrato(arq.name, new Uint8Array(await arq.arrayBuffer())); } catch (e) { avisar(e.message || 'Não consegui ler este arquivo.', 'erro'); return; }
  if (!lido.itens.length) { avisar('Não encontrei lançamentos neste arquivo.', 'atencao'); return; }
  const contaPadrao = (DB.contas.find((c) => !c.arquivada && (lido.cartao ? c.tipo === 'cartao' : c.tipo !== 'cartao')) || DB.contas[0]).id;
  ESTADO.importacao = { nome: arq.name, lido, contaId: contaPadrao };
  prepararLinhas(ESTADO.importacao);
  renderizar(true);
}

function telaImportar(cont) {
  const imp = ESTADO.importacao;
  if (!imp) {
    cont.appendChild(cartao('Importar extrato do banco', 'Os lançamentos do extrato entram de uma vez; nada é gravado sem a sua conferência.', el('div', { class: 'cartao-corpo ajustes' },
      el('ol', { class: 'passos-sinc' },
        el('li', null, el('strong', { text: 'Arquivo do banco (recomendado): ' }), el('span', { text: 'no internet banking, baixe o extrato em OFX (às vezes chamado "Money" ou "Quicken") ou CSV/Excel. Os valores vêm exatos do banco.' })),
        el('li', null, el('strong', { text: 'PDF, fatura do cartão ou print: ' }), el('span', { text: 'coloque o arquivo na pasta "Extratos para lançar" (dentro de Documentos › Organizador Financeiro) e peça ao Claude: "converta o extrato para importar". Ele devolve um arquivo .json, que se importa aqui.' })),
        el('li', null, el('strong', { text: 'Conferência: ' }), el('span', { text: 'o app mostra cada linha com a categoria sugerida (aprende com os seus lançamentos), deixa desmarcado o que parece já lançado e confere a soma com o saldo do extrato.' }))),
      el('div', { class: 'botoes-linha' }, el('button', { class: 'botao primario', type: 'button', onclick: escolherExtrato }, icone('enviar', 18), ' Escolher o arquivo do extrato')),
      el('p', { class: 'nota', text: 'Depois de importar, apague o arquivo do extrato do computador ou do celular: ele não é criptografado.' }))));
    return;
  }

  const conta = contaPorId(imp.contaId);
  const cartao_ = !!conta && conta.tipo === 'cartao';
  const selConta = el('select', { 'aria-label': 'Conta' }, opcoesContas(() => true, imp.contaId));
  selConta.addEventListener('change', () => { imp.contaId = selConta.value; prepararLinhas(imp); renderizar(); });
  const marcadas = imp.linhas.filter((l) => l.sel && l.acao !== 'ignorar');
  const ent = somar(marcadas.filter((l) => l.acao === 'entrada'), (l) => Math.abs(l.valor));
  const sai = somar(marcadas.filter((l) => l.acao === 'saida'), (l) => Math.abs(l.valor));
  const datas = imp.lido.itens.map((x) => x.data).sort();
  const soma = somar(imp.lido.itens, (x) => x.valor);

  const conferencias = [];
  if (imp.lido.saldoInicial != null && imp.lido.saldoFinal && imp.lido.saldoFinal.valor != null) {
    const bate = imp.lido.saldoInicial + soma === imp.lido.saldoFinal.valor;
    conferencias.push(el('div', { class: 'linha-estado ' + (bate ? 'ok' : 'atencao') }, icone(bate ? 'check' : 'alerta', 18),
      el('span', { text: bate ? 'Conferido: saldo inicial ' + moeda(imp.lido.saldoInicial) + ' + lançamentos ' + moeda(soma) + ' = saldo final ' + moeda(imp.lido.saldoFinal.valor) + ', igual ao extrato.'
        : 'A soma NÃO bate com o extrato: saldo inicial ' + moeda(imp.lido.saldoInicial) + ' + lançamentos ' + moeda(soma) + ' = ' + moeda(imp.lido.saldoInicial + soma) + ', mas o extrato diz ' + moeda(imp.lido.saldoFinal.valor) + '. Confira antes de importar.' })));
  } else if (imp.lido.saldoFinal && imp.lido.saldoFinal.valor != null) {
    conferencias.push(el('p', { class: 'nota', text: 'Saldo final no extrato' + (imp.lido.saldoFinal.data ? ' em ' + dataBR(imp.lido.saldoFinal.data) : '') + ': ' + moeda(imp.lido.saldoFinal.valor) + '. Depois de importar, compare com o saldo desta conta em Contas e cartões.' }));
  }
  const nDup = imp.linhas.filter((l) => l.dup).length, nDuv = imp.linhas.filter((l) => l.duvida).length;

  cont.appendChild(cartao('Conferir o extrato', imp.nome + ' · ' + imp.lido.formato + (imp.lido.conta ? ' · ' + imp.lido.conta : '') + ' · ' + imp.linhas.length + ' linhas de ' + dataBR(datas[0]) + ' a ' + dataBR(datas[datas.length - 1]),
    el('div', { class: 'cartao-corpo ajustes' },
      campo('Lançar na conta', selConta, cartao_ ? 'Cartão: as compras entram nas faturas certas. Pagamento da fatura e estornos vêm como "Não importar" (o pagamento se lança em "Pagar fatura").' : null),
      ...conferencias,
      nDup ? el('p', { class: 'nota', text: nDup + (nDup === 1 ? ' linha parece já lançada e veio desmarcada.' : ' linhas parecem já lançadas e vieram desmarcadas.') + ' Marque se não for o caso.' }) : null,
      nDuv ? el('p', { class: 'alerta-texto', text: nDuv + (nDuv === 1 ? ' linha foi marcada' : ' linhas foram marcadas') + ' com dúvida na leitura do PDF: confira com o extrato.' }) : null,
      el('div', { class: 'botoes-linha' },
        el('button', { class: 'link-botao', type: 'button', text: 'Marcar todas', onclick: () => { for (const l of imp.linhas) if (l.acao !== 'ignorar') l.sel = true; renderizar(); } }),
        el('button', { class: 'link-botao', type: 'button', text: 'Desmarcar todas', onclick: () => { for (const l of imp.linhas) l.sel = false; renderizar(); } })))));

  const lista = el('div', { class: 'cartao imp-lista' });
  imp.linhas.forEach((l) => {
    const chk = el('input', { type: 'checkbox', checked: l.sel && l.acao !== 'ignorar', disabled: l.acao === 'ignorar', 'aria-label': 'Importar esta linha' });
    chk.addEventListener('change', () => { l.sel = chk.checked; renderizar(); });
    const desc = el('input', { type: 'text', value: l.descricao, maxlength: 120, 'aria-label': 'Descrição' });
    desc.addEventListener('change', () => { l.descricao = vTexto(desc.value, 120) || l.descricao; });
    const tiposPossiveis = l.valor < 0 ? [['saida', 'Saída'], ['transferencia', 'Transferência (saiu para outra conta minha)'], ['ignorar', 'Não importar']]
      : [['entrada', 'Entrada'], ['transferencia', 'Transferência (veio de outra conta minha)'], ['ignorar', 'Não importar']];
    const selAcao = seletor(tiposPossiveis, l.acao, { 'aria-label': 'Tipo' });
    selAcao.addEventListener('change', () => { l.acao = selAcao.value; l.sel = l.acao !== 'ignorar'; if (l.acao === 'entrada' || l.acao === 'saida') l.categoriaId = l.categoriaId || sugerirCategoria(l.descricao, l.acao); renderizar(); });
    let segundo = null;
    if (l.acao === 'entrada' || l.acao === 'saida') {
      segundo = el('select', { 'aria-label': 'Categoria' }, opcoesCategorias(l.acao, conta ? conta.escopo : 'P', l.categoriaId).filter((o) => !(o.value === '__nova')));
      segundo.addEventListener('change', () => { l.categoriaId = segundo.value || null; });
    } else if (l.acao === 'transferencia') {
      segundo = el('select', { 'aria-label': 'Outra conta' }, [el('option', { value: '', text: 'Qual a outra conta?' }), ...opcoesContas((c) => c.id !== imp.contaId && c.tipo !== 'cartao', l.contaDestinoId)]);
      segundo.addEventListener('change', () => { l.contaDestinoId = segundo.value; });
    }
    lista.appendChild(el('div', { class: ['imp-linha', l.sel && l.acao !== 'ignorar' ? '' : 'desmarcada', l.duvida ? 'duvida' : ''] },
      chk,
      el('span', { class: 'imp-data', text: dataBR(l.data).slice(0, 5) }),
      el('div', { class: 'imp-desc' }, desc,
        l.dup ? el('span', { class: 'etiqueta atraso', title: 'Parecido com: ' + (l.dup.descricao || '') + ' · ' + dataBR(l.dup.data) + ' · ' + moeda(l.dup.valor), text: 'já lançado?' }) : null,
        l.duvida ? el('span', { class: 'etiqueta mistura', text: 'conferir' }) : null),
      selAcao, segundo || el('span'),
      el('span', { class: ['imp-valor', 'valor', l.valor > 0 ? 'cor-texto-entrada' : ''], text: (l.valor > 0 ? '+ ' : '− ') + moeda(Math.abs(l.valor)) })));
  });
  cont.appendChild(lista);

  cont.appendChild(el('div', { class: 'barra-filtros imp-rodape' },
    el('span', { class: 'valor', text: marcadas.length + (marcadas.length === 1 ? ' lançamento' : ' lançamentos') + ' · entradas + ' + moeda(ent) + ' · saídas − ' + moeda(sai) }),
    el('div', { class: 'espaco' }),
    el('button', { class: 'botao', type: 'button', text: 'Cancelar', onclick: () => { ESTADO.importacao = null; renderizar(true); } }),
    el('button', { class: 'botao primario', type: 'button', disabled: !marcadas.length, onclick: confirmarImportacao }, icone('check', 18), ' Importar ' + marcadas.length)));
}

function confirmarImportacao() {
  const imp = ESTADO.importacao;
  const conta = contaPorId(imp.contaId);
  const cartao_ = !!conta && conta.tipo === 'cartao';
  const marcadas = imp.linhas.filter((l) => l.sel && l.acao !== 'ignorar');
  const semDestino = marcadas.filter((l) => l.acao === 'transferencia' && !l.contaDestinoId);
  if (semDestino.length) { avisar('Escolha a outra conta das transferências (' + semDestino.length + ').', 'atencao'); return; }
  const novos = [];
  for (const l of marcadas) {
    const x = { id: uid(), tipo: l.acao, descricao: l.descricao, valor: Math.abs(l.valor), data: l.data, status: 'pago', forma: '', obs: [l.obs, 'Importado do extrato (' + imp.lido.formato + ').'].filter(Boolean).join('\n'), pessoa: l.pessoa || '' };
    if (l.idExterno) x.idExterno = l.idExterno;
    if (l.acao === 'transferencia') {
      // saiu desta conta para outra, ou veio de outra para esta
      if (l.valor < 0) { x.contaId = imp.contaId; x.contaDestinoId = l.contaDestinoId; } else { x.contaId = l.contaDestinoId; x.contaDestinoId = imp.contaId; }
      x.escopo = conta ? conta.escopo : 'P';
      x.pagoEm = l.data;
      x.competencia = mesDe(l.data);
    } else {
      x.contaId = imp.contaId;
      x.categoriaId = l.categoriaId || null;
      const cat = categoriaPorId(x.categoriaId);
      x.escopo = cat && (cat.escopo === 'P' || cat.escopo === 'E') ? cat.escopo : conta ? conta.escopo : 'P';
      if (!cartao_) x.pagoEm = l.data;
      recalcularCompetencia(x);
    }
    novos.push(carimbar(x, true));
  }
  DB.lancamentos.push(...novos);
  const datas = marcadas.map((l) => l.data).sort();
  ESTADO.importacao = null;
  mudou(true);
  avisar(novos.length + (novos.length === 1 ? ' lançamento importado.' : ' lançamentos importados.') + ' Lembre de apagar o arquivo do extrato.');
  abrirRegistro({ tipo: 'todos', periodo: { tipo: 'mes', mes: mesDe(datas[0]) }, filtros: { contaId: imp.contaId }, ordem: 'data-asc' });
  const p = ESTADO.registro.periodo; p.tipo = 'intervalo'; p.de = datas[0]; p.ate = datas[datas.length - 1]; p.base = 'vencimento';
  renderizar(true);
}
