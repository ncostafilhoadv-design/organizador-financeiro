<style>/* ===================== 01 - Cores, tipografia e controles ===================== */
:root {
  color-scheme: light;
  --fundo: #f4f4f0; --superficie: #fcfcfb; --campo: #ffffff; --hover: rgba(11,11,11,.05); --trilho: #ecebe6;
  --tinta: #0b0b0b; --tinta-2: #52514e; --tinta-3: #6b6964;
  --grade: #e1e0d9; --eixo: #c3c2b7; --borda: rgba(11,11,11,.08); --borda-forte: rgba(11,11,11,.16);
  --acento: #2a78d6; --acento-fundo: #e8f1fc; --acento-texto: #1c5cab; --acento-trilho: #cde2fb;
  --entrada: #1baf7a; --saida: #eb6834; --resultado: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --bom: #0ca30c; --alerta: #fab219; --serio: #ec835a; --critico: #d03b3b;
  --texto-bom: #006300; --texto-ruim: #b42f2f; --alerta-texto: #8a5a00;
  --bom-fundo: #e7f6e7; --alerta-fundo: #fdf3dc; --critico-fundo: #fbe9e9;
  --sombra: 0 1px 2px rgba(11,11,11,.04), 0 4px 16px rgba(11,11,11,.04);
  --sombra-forte: 0 12px 40px rgba(11,11,11,.18);
  --destaque-banda: rgba(42,120,214,.07); --hover-grafico: rgba(11,11,11,.04);
  --raio: 16px;
  --fonte: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --fundo: #0d0d0d; --superficie: #1a1a19; --campo: #121211; --hover: rgba(255,255,255,.06); --trilho: #2a2a28;
    --tinta: #ffffff; --tinta-2: #c3c2b7; --tinta-3: #9a988f;
    --grade: #2c2c2a; --eixo: #383835; --borda: rgba(255,255,255,.08); --borda-forte: rgba(255,255,255,.16);
    --acento: #3987e5; --acento-fundo: rgba(57,135,229,.16); --acento-texto: #86b6ef; --acento-trilho: #184f95;
    --entrada: #199e70; --saida: #d95926; --resultado: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --texto-bom: #0ca30c; --texto-ruim: #ff7b7b; --alerta-texto: #f5c451;
    --bom-fundo: rgba(12,163,12,.16); --alerta-fundo: rgba(250,178,25,.14); --critico-fundo: rgba(208,59,59,.2);
    --sombra: 0 1px 2px rgba(0,0,0,.4); --sombra-forte: 0 12px 40px rgba(0,0,0,.6);
    --destaque-banda: rgba(57,135,229,.12); --hover-grafico: rgba(255,255,255,.05);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fundo: #0d0d0d; --superficie: #1a1a19; --campo: #121211; --hover: rgba(255,255,255,.06); --trilho: #2a2a28;
  --tinta: #ffffff; --tinta-2: #c3c2b7; --tinta-3: #9a988f;
  --grade: #2c2c2a; --eixo: #383835; --borda: rgba(255,255,255,.08); --borda-forte: rgba(255,255,255,.16);
  --acento: #3987e5; --acento-fundo: rgba(57,135,229,.16); --acento-texto: #86b6ef; --acento-trilho: #184f95;
  --entrada: #199e70; --saida: #d95926; --resultado: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --texto-bom: #0ca30c; --texto-ruim: #ff7b7b; --alerta-texto: #f5c451;
  --bom-fundo: rgba(12,163,12,.16); --alerta-fundo: rgba(250,178,25,.14); --critico-fundo: rgba(208,59,59,.2);
  --sombra: 0 1px 2px rgba(0,0,0,.4); --sombra-forte: 0 12px 40px rgba(0,0,0,.6);
  --destaque-banda: rgba(57,135,229,.12); --hover-grafico: rgba(255,255,255,.05);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--fundo); color: var(--tinta); font: 14px/1.45 var(--fonte); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { letter-spacing: -0.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

.icone { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* Botões */
.botao { height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--borda-forte); background: var(--superficie);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500; white-space: nowrap; transition: background .12s, border-color .12s; }
.botao:hover:not(:disabled) { background: var(--hover); }
.botao:disabled { opacity: .5; }
.botao.primario { background: var(--acento); color: #fff; border-color: transparent; }
.botao.primario:hover:not(:disabled) { background: var(--acento-texto); }
.botao.perigo { background: var(--critico); color: #fff; border-color: transparent; }
.botao.perigo-texto { color: var(--texto-ruim); border-color: transparent; background: transparent; }
.botao.pequeno { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.botao.grande { height: 46px; font-size: 15px; padding: 0 20px; border-radius: 12px; }
.botao.largo { width: 100%; }
.botao-icone { width: 36px; height: 36px; border-radius: 10px; border: none; background: transparent; color: var(--tinta-2);
  display: inline-grid; place-items: center; transition: background .12s; }
.botao-icone:hover { background: var(--hover); color: var(--tinta); }
.botao-icone.pequeno { width: 30px; height: 30px; border-radius: 8px; }
.link-botao { background: none; border: none; padding: 0; color: var(--acento-texto); font-weight: 500; }
.link-botao:hover { text-decoration: underline; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--borda-forte); background: none; color: var(--tinta-2); }
.chip:hover { background: var(--hover); }

/* Seletor segmentado */
.segmentado { display: inline-flex; background: var(--trilho); border-radius: 10px; padding: 3px; gap: 2px; flex-shrink: 0; }
.seg { border: none; background: transparent; padding: 6px 12px; border-radius: 8px; color: var(--tinta-2); font-weight: 500; white-space: nowrap; }
.seg:hover { color: var(--tinta); }
.seg.ativo { background: var(--superficie); color: var(--tinta); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.segmentado.pequeno .seg { padding: 5px 10px; font-size: 13px; }

/* Campos */
input[type=text], input[type=password], input[type=number], input[type=date], input[type=search], select, textarea {
  width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--borda-forte); border-radius: 10px; background: var(--campo); color: var(--tinta); }
textarea { height: auto; padding: 8px 12px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--acento); box-shadow: 0 0 0 3px var(--acento-fundo); }
input.curto { width: 110px; }
input.mono, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .04em; }
.campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.campo-rotulo { font-size: 12.5px; font-weight: 600; color: var(--tinta-2); }
.campo-ajuda { font-size: 12px; color: var(--tinta-3); }
.campo[hidden] { display: none; }
.grade-campos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grade-campos.tres { grid-template-columns: 1fr 1fr 1fr; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13.5px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--acento); }
.valor-grande { height: 52px !important; font-size: 26px; font-weight: 600; }
.valor-sinal { display: flex; gap: 8px; align-items: center; }
.nota { font-size: 12.5px; color: var(--tinta-3); margin: 0; line-height: 1.45; }
.texto-suave { color: var(--tinta-3); }
.erro-texto { color: var(--texto-ruim); font-size: 13.5px; }
.erro-texto:empty { display: none; }
.alerta-texto { background: var(--alerta-fundo); padding: 10px 12px; border-radius: 10px; font-size: 13px; margin: 0; }
.cor-texto-entrada { color: var(--texto-bom); }
.espaco { flex: 1; }
.valor { font-variant-numeric: normal; }

/* Privacidade: esconder valores */
.ocultar-valores .valor, .ocultar-valores .rotulo-valor, .ocultar-valores .rotulo-dado, .ocultar-valores .rosca-valor, .ocultar-valores .tooltip strong { filter: blur(7px); user-select: none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ===================== 02 - Estrutura: lateral, topo, janelas, avisos, acesso ===================== */
#app.app-aberto { display: grid; grid-template-columns: 244px 1fr; height: 100vh; }
.lateral { background: var(--superficie); border-right: 1px solid var(--borda); padding: 18px 14px; display: flex; flex-direction: column; gap: 20px; height: 100vh; overflow-y: auto; }
.marca { display: flex; gap: 10px; align-items: center; padding: 2px 6px; }
.marca strong { display: block; font-size: 15px; }
.marca span { font-size: 12.5px; color: var(--tinta-3); }
.marca-simbolo { width: 38px; height: 38px; border-radius: 11px; background: var(--acento); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
.marca-simbolo.grande { width: 52px; height: 52px; border-radius: 14px; }
.nav-lateral { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; border: none; background: none; color: var(--tinta-2); font-weight: 500; text-align: left; width: 100%; }
.nav-item:hover { background: var(--hover); color: var(--tinta); }
.nav-item.ativo { background: var(--acento-fundo); color: var(--acento-texto); }
.selo-breve { font-size: 10.5px; padding: 2px 7px; border-radius: 99px; background: var(--trilho); color: var(--tinta-3); font-weight: 600; margin-left: auto; white-space: nowrap; }
.selo-breve.grande { font-size: 12px; padding: 4px 10px; background: var(--acento-fundo); color: var(--acento-texto); margin: 0; align-self: flex-start; }
.lateral-rodape { margin-top: auto; display: flex; flex-direction: column; gap: 6px; font-size: 12px; padding: 0 6px; }
.status-salvo { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--tinta-3); }
.status-salvo.ok .icone { color: var(--texto-bom); }
.status-salvo.erro { color: var(--texto-ruim); }
.versao { color: var(--tinta-3); font-size: 11px; }

.principal { display: flex; flex-direction: column; height: 100vh; min-width: 0; }
.topo { display: flex; gap: 14px; align-items: center; padding: 12px 24px; border-bottom: 1px solid var(--borda); background: var(--fundo); }
.topo h1 { font-size: 20px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topo-acoes { display: flex; gap: 6px; align-items: center; }
.conteudo { flex: 1; overflow-y: auto; padding: 20px 24px 64px; display: flex; flex-direction: column; gap: 16px; }
.conteudo > * { width: 100%; max-width: 1280px; margin-left: auto; margin-right: auto; flex-shrink: 0; }
.so-celular, .nav-inferior, .veu-menu { display: none; }

/* Janelas */
dialog.modal { border: none; border-radius: 18px; padding: 0; width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 40px);
  background: var(--superficie); color: var(--tinta); box-shadow: var(--sombra-forte); }
dialog.modal[open] { display: flex; flex-direction: column; }
dialog.modal::backdrop { background: rgba(10,10,10,.45); backdrop-filter: blur(2px); }
.modal-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 20px 6px; }
.modal-topo h2 { font-size: 18px; margin: 0; }
.modal-sub { color: var(--tinta-3); font-size: 13px; margin: 2px 0 0; }
.modal-corpo { padding: 8px 20px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-rodape { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--grade); flex-wrap: wrap; }
.modal-pequeno .modal-corpo { gap: 10px; }
.modal-entrada h2::before, .modal-saida h2::before, .modal-transferencia h2::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: 2px; }
.modal-entrada h2::before { background: var(--entrada); }
.modal-saida h2::before { background: var(--saida); }
.modal-transferencia h2::before { background: var(--resultado); }
.texto-confirmacao { margin: 0; color: var(--tinta-2); line-height: 1.5; }
.lista-opcoes { display: flex; flex-direction: column; gap: 8px; }
.botao.opcao { height: auto; padding: 12px 14px; flex-direction: column; align-items: flex-start; text-align: left; gap: 2px; width: 100%; white-space: normal; }
.botao.opcao span { font-size: 12.5px; color: var(--tinta-3); font-weight: 400; }
.botao.opcao.perigo { background: var(--superficie); color: var(--tinta); border-color: var(--critico); }
.botao.opcao.perigo strong { color: var(--texto-ruim); }

/* Formulário de lançamento */
.form-lanc { display: flex; flex-direction: column; gap: 14px; }
.linha-valor { display: flex; flex-direction: column; gap: 4px; }
.atalhos-data { display: flex; gap: 6px; margin-top: 6px; }
.bloco-rec { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px dashed var(--borda-forte); border-radius: 12px; }
.rec-detalhe { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rec-detalhe:empty { display: none; }
.form-resumo { display: flex; flex-direction: column; gap: 6px; }
.form-resumo:empty { display: none; }
.form-resumo .nota { background: var(--acento-fundo); color: var(--tinta-2); padding: 8px 12px; border-radius: 10px; }

/* Avisos */
#avisos { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.aviso { pointer-events: auto; background: var(--tinta); color: var(--superficie); padding: 10px 14px; border-radius: 12px; box-shadow: var(--sombra-forte);
  display: flex; gap: 14px; align-items: center; font-size: 13.5px; max-width: min(560px, calc(100vw - 32px)); animation: entrar .18s ease-out; transition: opacity .3s, transform .3s; }
.aviso.erro { background: var(--critico); color: #fff; }
.aviso.atencao { background: #6b4600; color: #fff; }
.aviso.saindo { opacity: 0; transform: translateY(6px); }
.aviso-acao { background: none; border: none; color: var(--acento-trilho); font-weight: 600; padding: 0; }
@keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Tela de acesso */
.acesso { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px;
  background: radial-gradient(1200px 600px at 50% -10%, var(--acento-fundo), transparent 70%), var(--fundo); }
.acesso-cartao { width: min(460px, 100%); background: var(--superficie); border: 1px solid var(--borda); border-radius: 20px; padding: 32px; box-shadow: var(--sombra-forte);
  display: flex; flex-direction: column; gap: 14px; }
.acesso-marca { display: flex; gap: 12px; align-items: center; }
.acesso-marca strong { display: block; font-size: 17px; }
.acesso-marca span { color: var(--tinta-3); font-size: 13px; }
.acesso h1 { font-size: 22px; margin: 8px 0 0; }
.acesso-texto { color: var(--tinta-2); margin: 0; line-height: 1.55; }
.acesso-form { display: flex; flex-direction: column; gap: 12px; }
.acesso-botoes { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.acesso-links { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.acesso-rodape { color: var(--tinta-3); font-size: 12.5px; max-width: 460px; text-align: center; margin: 18px 0 0; display: flex; gap: 6px; align-items: center; justify-content: center; line-height: 1.4; }
.erro-caixa { display: flex; flex-direction: column; gap: 6px; }
.senha-caixa { position: relative; }
.senha-caixa input { height: 46px; font-size: 15px; padding-right: 46px; }
.olho-senha { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); }
.forca { display: flex; flex-direction: column; gap: 6px; }
.forca-barra { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.forca-barra span { height: 5px; border-radius: 3px; background: var(--trilho); }
.forca-barra[data-nota="0"] span:nth-child(-n+1) { background: var(--critico); }
.forca-barra[data-nota="1"] span:nth-child(-n+2) { background: var(--alerta); }
.forca-barra[data-nota="2"] span:nth-child(-n+3) { background: var(--bom); }
.forca-barra[data-nota="3"] span { background: var(--bom); }
.forca-texto { font-size: 12.5px; color: var(--tinta-3); min-height: 18px; }
.codigo-recuperacao { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 19px; letter-spacing: .05em; padding: 16px; background: var(--trilho);
  border-radius: 12px; text-align: center; word-break: break-word; font-weight: 600; user-select: all; line-height: 1.6; }

/* Impressão do código de recuperação */
#impressao { display: none; }
@media print {
  body > *:not(#impressao) { display: none !important; }
  #impressao { display: block; color: #000; font-family: var(--fonte); padding: 24pt; }
  #impressao h1 { font-size: 16pt; }
  .codigo-impresso { font-family: ui-monospace, Consolas, monospace; font-size: 20pt; border: 2px solid #000; padding: 16pt; text-align: center; margin: 18pt 0; letter-spacing: .06em; }
}

/* ===================== 03 - Painel, gráficos, listas, contas, ajustes, celular ===================== */
.cartao { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); padding: 18px 20px; box-shadow: var(--sombra); min-width: 0; }
.cartao-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.cartao-topo h3 { font-size: 15px; font-weight: 600; margin: 0; }
.cartao-sub { font-size: 12.5px; color: var(--tinta-3); margin: 2px 0 0; }
.cartao-acoes { display: flex; gap: 6px; align-items: center; }
.grade-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grade-2.sem-margem { gap: 28px; }

.clicavel { cursor: pointer; transition: box-shadow .12s, border-color .12s, background .12s; }
.tile.clicavel:hover, .pe-bloco.clicavel:hover { border-color: var(--acento); box-shadow: 0 0 0 3px var(--acento-fundo); }
.pe-bloco.clicavel { border: 1px solid transparent; border-radius: 12px; padding: 8px; margin: -8px; }
.rosca-legenda li.clicavel:hover { background: var(--hover); }
.rodape-cartao { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--grade); gap: 18px; }
.cor-texto-ruim { color: var(--texto-ruim); }
.linha-total td { border-top: 2px solid var(--eixo); }
.lista-mistura { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13.5px; }
.lista-mistura li { display: flex; justify-content: space-between; gap: 12px; }
.acerto { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--acento-fundo); font-weight: 600; font-size: 14px; }
.etiqueta.mistura { background: var(--alerta-fundo); color: var(--alerta-texto); }
.nota-mistura { background: var(--alerta-fundo); color: var(--tinta-2); padding: 8px 12px; border-radius: 10px; }
.nota-mistura[hidden] { display: none; }
.bloco-divisao { border: 1px dashed var(--borda-forte); border-radius: 12px; padding: 10px 12px; }
.bloco-divisao summary { cursor: pointer; font-weight: 600; font-size: 13.5px; display: flex; gap: 6px; align-items: center; }
.bloco-divisao[open] summary { margin-bottom: 8px; }
.bloco-divisao > * + * { margin-top: 8px; }
.div-linhas { display: grid; gap: 8px; }
.div-linha { display: grid; grid-template-columns: 1.4fr 110px auto auto; gap: 8px; align-items: center; }
.rec-detalhe > .tabela-rolagem, .rec-detalhe > .nota { grid-column: 1 / -1; }
.tabela-parcelas { max-width: 460px; }
.tabela-parcelas input { height: 32px; }
.tabela-parcelas .celula-valor { width: 120px; text-align: right; }
.tabela-parcelas td { padding: 4px 8px; }
@media (max-width: 560px) { .div-linha { grid-template-columns: 1fr 100px; } }
.faixa-aviso { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px; background: var(--alerta-fundo); font-size: 13.5px; }
.faixa-aviso > span { flex: 1; min-width: 200px; }
.faixa-aviso > .icone { color: var(--alerta-texto); }
.passos-sinc { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13.5px; }
.passos-sinc span { color: var(--tinta-2); }

/* Filtros */
.barra-filtros { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.barra-filtros.secundaria { justify-content: flex-start; }
.barra-filtros.secundaria select { width: auto; min-width: 150px; max-width: 220px; }
.navegador-mes { display: flex; align-items: center; gap: 4px; }
.periodo-rotulo { min-width: 170px; text-align: center; font-size: 15px; }
.busca-caixa { position: relative; flex: 1 1 240px; max-width: 360px; }
.busca-caixa .icone { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--tinta-3); }
.busca-caixa input { padding-left: 36px; }

/* Números */
.grade-tiles { display: grid; grid-template-columns: 1.35fr 1fr 1fr 1fr; gap: 16px; }
.grade-tiles.compacta { grid-template-columns: repeat(3, 1fr); }
.tile { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); padding: 16px 18px; box-shadow: var(--sombra); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.tile-rotulo { font-size: 13px; color: var(--tinta-2); display: flex; gap: 6px; align-items: center; font-weight: 500; }
.tile.entrada .tile-rotulo .icone { color: var(--entrada); }
.tile.saida .tile-rotulo .icone { color: var(--saida); }
.tile.resultado .tile-rotulo .icone { color: var(--resultado); }
.tile-valor { font-size: 24px; font-weight: 650; letter-spacing: -0.015em; }
.tile-sub { font-size: 12.5px; color: var(--tinta-3); display: flex; flex-direction: column; gap: 2px; }
.tile.heroi { background: linear-gradient(140deg, var(--acento-fundo), var(--superficie) 70%); justify-content: space-between; }
.tile.heroi .tile-rotulo .icone { color: var(--acento); }
.heroi-valor { font-size: 44px; font-weight: 650; letter-spacing: -0.025em; line-height: 1.1; margin: 6px 0; }
.delta { font-size: 12px; font-weight: 600; }
.delta.bom { color: var(--texto-bom); }
.delta.ruim { color: var(--texto-ruim); }
.delta.neutro { color: var(--tinta-3); }
.mini { flex-shrink: 0; }
.mini-linha { fill: none; stroke: var(--eixo); stroke-width: 1.5; stroke-linejoin: round; }
.mini-ponto { stroke: var(--superficie); stroke-width: 2; fill: var(--tinta-3); }
.mini-ponto.entrada { fill: var(--entrada); }
.mini-ponto.saida { fill: var(--saida); }
.mini-ponto.resultado { fill: var(--resultado); }

/* Gráficos */
.grafico-caixa { width: 100%; min-height: 40px; }
.grafico { display: block; overflow: visible; }
.grafico .grade { stroke: var(--grade); stroke-width: 1; }
.grafico .eixo { stroke: var(--eixo); stroke-width: 1; }
.rotulo-eixo { fill: var(--tinta-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.rotulo-eixo.forte { fill: var(--tinta); font-weight: 600; }
.rotulo-dado { fill: var(--tinta-2); font-size: 11.5px; font-weight: 600; }
.marca-entrada { fill: var(--entrada); }
.marca-saida { fill: var(--saida); }
.linha-resultado { fill: none; stroke: var(--resultado); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ponto-resultado, .ponto-saldo { fill: var(--resultado); stroke: var(--superficie); stroke-width: 2; }
.banda-destaque { fill: var(--destaque-banda); }
.alvo { fill: transparent; cursor: pointer; outline: none; }
.alvo.ativo { fill: var(--hover-grafico); }
.alvo:focus-visible { stroke: var(--acento); stroke-width: 1.5; }
.alvo-invisivel { fill: transparent; }
.area-saldo { fill: var(--resultado); opacity: .1; }
.linha-saldo { fill: none; stroke: var(--resultado); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.linha-projecao { fill: none; stroke: var(--resultado); stroke-width: 2; stroke-dasharray: 5 5; opacity: .75; }
.cursor { stroke: var(--tinta-3); stroke-width: 1; }
.legenda { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12.5px; color: var(--tinta-2); margin-bottom: 8px; }
.legenda-item { display: inline-flex; gap: 6px; align-items: center; }
.legenda-chave { display: inline-block; flex-shrink: 0; }
.legenda-chave.barra { width: 10px; height: 10px; border-radius: 3px; }
.legenda-chave.linha { width: 14px; height: 3px; border-radius: 2px; }
.legenda-chave.tracejada { width: 14px; height: 0; background: none !important; border-top: 2px dashed var(--resultado); }
.tooltip { position: fixed; z-index: 3000; pointer-events: none; background: var(--superficie); border: 1px solid var(--borda-forte); border-radius: 10px; padding: 8px 10px;
  box-shadow: var(--sombra-forte); font-size: 12.5px; opacity: 0; transition: opacity .1s; max-width: 320px; left: 0; top: 0; }
.tooltip.visivel { opacity: 1; }
.tip-titulo { font-weight: 600; margin-bottom: 4px; color: var(--tinta-2); }
.tip-linha { display: grid; grid-template-columns: 14px auto 1fr; gap: 8px; align-items: center; padding: 1px 0; }
.tip-chave { width: 12px; height: 3px; border-radius: 2px; }
.tip-chave.barra { width: 10px; height: 10px; border-radius: 3px; }
.tip-linha strong { color: var(--tinta); font-variant-numeric: tabular-nums; }
.tip-rotulo { color: var(--tinta-3); }
.rosca-caixa { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.fatia { stroke: var(--superficie); stroke-width: 2; cursor: pointer; outline: none; transition: d .15s; }
.rosca-valor { font-size: 18px; font-weight: 650; fill: var(--tinta); }
.rosca-rotulo { font-size: 11px; fill: var(--tinta-3); }
.rosca-legenda { list-style: none; padding: 0; margin: 0; flex: 1; min-width: 220px; }
.rosca-legenda li { display: grid; grid-template-columns: 12px 1fr auto 52px; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--grade); font-size: 13px; }
.rosca-legenda li:last-child { border-bottom: none; }
.rl-nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rl-valor { font-weight: 600; font-variant-numeric: tabular-nums; }
.rl-pct { color: var(--tinta-3); text-align: right; font-variant-numeric: tabular-nums; }

/* Barras horizontais */
.barras-h { display: flex; flex-direction: column; gap: 2px; }
.bh-linha { display: grid; grid-template-columns: minmax(130px, 1.4fr) 1.6fr auto 50px; gap: 12px; align-items: center; padding: 7px 8px; border: none; background: none;
  border-radius: 8px; text-align: left; width: 100%; }
.bh-linha:hover:not(:disabled) { background: var(--hover); }
.bh-linha:disabled { opacity: 1; }
.bh-nome { overflow: hidden; font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.bh-trilho { height: 10px; background: var(--trilho); border-radius: 2px 5px 5px 2px; overflow: hidden; display: block; }
.bh-barra { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.cor-saida { background: var(--saida); }
.cor-entrada { background: var(--entrada); }
.bh-valor { text-align: right; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bh-pct { text-align: right; color: var(--tinta-3); font-size: 12px; font-variant-numeric: tabular-nums; }

/* Pendências */
.pend-resumo { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: var(--tinta-2); padding: 8px 12px; background: var(--fundo); border-radius: 10px; margin-bottom: 4px; }
.pend-resumo strong { margin-left: 4px; }
.pend-mais { padding: 10px 0 0; }
.lista-pend { list-style: none; padding: 0; margin: 0; }
.pend { display: grid; grid-template-columns: 62px 1fr auto auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--grade); }
.pend:last-child { border-bottom: none; }
.pend-data { display: flex; flex-direction: column; }
.pend-data strong { font-size: 14px; }
.pend-data span { font-size: 11.5px; color: var(--tinta-3); }
.pend.atrasado .pend-data span, .pend.atrasado .pend-data strong { color: var(--texto-ruim); }
.pend-info { background: none; border: none; padding: 0; text-align: left; min-width: 0; }
.pend-info strong { display: block; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pend-info span { font-size: 12.5px; color: var(--tinta-3); }
.pend-valor { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Primeiros passos e observações */
.passos { list-style: none; padding: 0; margin: 0 0 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.passos li { display: flex; gap: 10px; align-items: flex-start; padding: 12px; background: var(--fundo); border-radius: 12px; flex-wrap: wrap; }
.passos li > div { flex: 1; min-width: 140px; }
.passos strong { display: block; }
.passos span { font-size: 12.5px; color: var(--tinta-3); }
.passo-n { width: 24px; height: 24px; border-radius: 50%; background: var(--acento); color: #fff !important; font-weight: 700; font-size: 12px !important; display: grid; place-items: center; flex-shrink: 0; }
.observacoes { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.observacoes li { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.observacoes .icone { margin-top: 2px; }
.observacoes .bom .icone { color: var(--texto-bom); }
.observacoes .ruim .icone { color: var(--texto-ruim); }
.observacoes .atencao .icone { color: var(--alerta-texto); }
.observacoes .neutro .icone { color: var(--tinta-3); }
.pe { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.pe-bloco h4 { margin: 0 0 8px; font-size: 13px; color: var(--tinta-2); }
.pe-linha { display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; }
.pe-res { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--grade); font-size: 13px; }

/* Listas */
.lista-simples { list-style: none; padding: 0; margin: 0; }
.lista-simples li { border-bottom: 1px solid var(--grade); display: flex; align-items: center; gap: 10px; }
.lista-simples li:last-child { border-bottom: none; }
.lista-simples > li > .ls-texto { padding: 8px 4px; }
.ls-botao { display: flex; gap: 10px; align-items: center; width: 100%; background: none; border: none; padding: 9px 6px; text-align: left; border-radius: 8px; min-width: 0; }
.ls-botao:hover { background: var(--hover); }
.ls-texto { flex: 1; min-width: 0; }
.ls-texto strong { display: block; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ls-texto span { font-size: 12.5px; color: var(--tinta-3); }
.ponto-cor { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.etiqueta { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--trilho); color: var(--tinta-2); display: inline-flex; gap: 3px; align-items: center; font-weight: 500; white-space: nowrap; }
.etiqueta.escopo-E { background: var(--acento-fundo); color: var(--acento-texto); }
.etiqueta.atraso { background: var(--critico-fundo); color: var(--texto-ruim); }

.lista-lanc { padding: 4px 0; }
.dia-topo { display: flex; justify-content: space-between; padding: 12px 20px 6px; font-size: 12px; font-weight: 600; color: var(--tinta-3); border-top: 1px solid var(--grade); }
.dia-topo:first-child { border-top: none; }
.linha-lanc { display: grid; grid-template-columns: 30px 10px 1fr auto auto; gap: 12px; align-items: center; padding: 9px 20px; cursor: pointer; outline: none; }
.linha-lanc:hover, .linha-lanc:focus-visible { background: var(--hover); }
.ll-texto { min-width: 0; }
.ll-titulo { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ll-titulo strong { font-weight: 550; }
.ll-sub { font-size: 12.5px; color: var(--tinta-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ll-valor { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.linha-lanc.pendente .ll-titulo strong, .linha-lanc.pendente .ll-valor { color: var(--tinta-2); }
.ll-acoes { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
.linha-lanc:hover .ll-acoes, .linha-lanc:focus-within .ll-acoes { opacity: 1; }
.status-bolinha { width: 28px; height: 28px; border-radius: 50%; border: 1.5px dashed var(--borda-forte); background: transparent; color: var(--tinta-3); display: grid; place-items: center; padding: 0; }
.status-bolinha.pago { background: var(--bom-fundo); border: 1.5px solid transparent; color: var(--texto-bom); }
.status-bolinha.atrasado { border-color: var(--texto-ruim); color: var(--texto-ruim); }
.status-bolinha:hover:not(:disabled) { border-color: var(--acento); }
.status-bolinha:disabled { opacity: .55; }

.tabela-rolagem { overflow-x: auto; }
.tabela { width: 100%; border-collapse: collapse; font-size: 13px; }
.tabela th { text-align: left; font-weight: 600; color: var(--tinta-3); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--grade); white-space: nowrap; }
.tabela td { padding: 8px 10px; border-bottom: 1px solid var(--grade); }
.tabela .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tabela tr.pendente td { opacity: .55; }

.vazio { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 40px 20px; background: var(--superficie); border: 1px dashed var(--borda-forte); border-radius: var(--raio); }
.vazio-icone { width: 56px; height: 56px; border-radius: 50%; background: var(--trilho); display: grid; place-items: center; color: var(--tinta-3); }
.vazio p { color: var(--tinta-3); margin: 0 0 8px; }

/* Contas e cartões */
.secao-topo { display: flex; align-items: center; gap: 10px; }
.secao-topo h2 { font-size: 17px; margin: 8px 0 0; flex: 1; }
.secao-topo.pequena h4 { flex: 1; margin: 0; font-size: 14px; }
.grade-contas { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.conta-cartao { position: relative; overflow: hidden; background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); box-shadow: var(--sombra);
  padding: 18px 20px 14px 24px; display: flex; flex-direction: column; gap: 8px; }
.conta-cartao::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--cor-conta); }
.conta-cartao header { display: flex; justify-content: space-between; gap: 8px; }
.conta-cartao header strong { display: block; font-size: 15px; }
.conta-cartao header span { font-size: 12.5px; color: var(--tinta-3); }
.conta-saldo { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
.conta-saldo.negativo { color: var(--texto-ruim); }
.conta-sub { font-size: 12.5px; color: var(--tinta-3); }
.conta-cartao footer { display: flex; gap: 16px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--grade); }
.fatura-atual { display: flex; flex-direction: column; gap: 1px; font-size: 12.5px; color: var(--tinta-2); }
.fatura-atual strong { font-size: 24px; font-weight: 650; color: var(--tinta); letter-spacing: -0.02em; }
.aviso-fatura { display: flex; gap: 6px; align-items: center; background: var(--alerta-fundo); padding: 6px 10px; border-radius: 8px; font-size: 12.5px; }
.aviso-fatura .icone { color: var(--alerta-texto); }
.medidor-trilho { height: 8px; background: var(--acento-trilho); border-radius: 2px 4px 4px 2px; overflow: hidden; }
.medidor-trilho span { display: block; height: 100%; background: var(--acento); border-radius: 0 4px 4px 0; }
.medidor-trilho.alerta span { background: var(--alerta); }
.medidor-trilho.critico span { background: var(--critico); }
.medidor-texto { display: flex; justify-content: space-between; font-size: 12px; color: var(--tinta-3); margin-top: 4px; }
.arquivadas summary { cursor: pointer; color: var(--tinta-2); font-weight: 500; padding: 6px 0; }
details.fatura { border: 1px solid var(--borda-forte); border-radius: 12px; margin-bottom: 8px; }
details.fatura summary { display: flex; gap: 10px; align-items: center; padding: 12px 14px; cursor: pointer; list-style: none; flex-wrap: wrap; }
details.fatura summary::-webkit-details-marker { display: none; }
.fat-mes { font-weight: 600; }
.selo { font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
.selo.st-paga { background: var(--bom-fundo); color: var(--texto-bom); }
.selo.st-vencida { background: var(--critico-fundo); color: var(--texto-ruim); }
.selo.st-fechada { background: var(--alerta-fundo); color: var(--alerta-texto); }
.selo.st-aberta { background: var(--acento-fundo); color: var(--acento-texto); }
.selo.st-vazia { background: var(--trilho); color: var(--tinta-3); }
.fat-corpo { padding: 0 14px 10px; }
.fat-corpo .ls-botao > .texto-suave { min-width: 46px; }
.fat-resumo { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; font-size: 13px; flex-wrap: wrap; }
.cores { display: flex; gap: 8px; flex-wrap: wrap; }
.cor-opcao { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 2px var(--superficie); padding: 0; }
.cor-opcao.ativo { border-color: var(--tinta); }

/* Ajustes */
.ajustes { display: flex; flex-direction: column; gap: 10px; }
.ajustes h4 { margin: 10px 0 0; font-size: 13.5px; }
.linha-estado { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; flex-wrap: wrap; font-size: 13.5px; }
.linha-estado.ok { background: var(--bom-fundo); }
.linha-estado.ok > .icone { color: var(--texto-bom); }
.linha-estado.atencao { background: var(--alerta-fundo); }
.linha-estado.atencao > .icone { color: var(--alerta-texto); }
.linha-estado > span { flex: 1; min-width: 180px; }
.botoes-linha { display: flex; flex-wrap: wrap; gap: 8px; }
.lista-protecoes { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.lista-protecoes li { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; line-height: 1.45; }
.lista-protecoes .icone { color: var(--texto-bom); margin-top: 2px; }
.lista-cat { list-style: none; padding: 0; margin: 6px 0 0; }
.lista-cat li { border-bottom: 1px solid var(--grade); }
.lista-cat li.arquivada { opacity: .55; }
.rodape-ajustes { color: var(--tinta-3); font-size: 12px; text-align: center; }
.em-breve { padding: 32px; display: flex; flex-direction: column; gap: 10px; max-width: 760px !important; }
.em-breve h2 { margin: 4px 0 0; }
.em-breve p { color: var(--tinta-2); margin: 0 0 6px; }

/* Celular e janelas estreitas */
@media (max-width: 1100px) {
  .grade-tiles { grid-template-columns: 1fr 1fr; }
  .tile.heroi { grid-column: 1 / -1; }
}
@media (max-width: 860px) {
  #app.app-aberto { grid-template-columns: 1fr; }
  .lateral { position: fixed; left: 0; top: 0; bottom: 0; width: 264px; z-index: 60; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--sombra-forte); }
  body.menu-aberto .lateral { transform: none; }

<script>(function () {
'use strict';
// ===================== 01 - Utilidades gerais =====================
// Regra de segurança: nenhum texto do usuário entra no HTML como código.
// Tudo é montado com createElement + textContent (inserir HTML como texto é proibido pela CSP).

const VERSAO_APP = '1.2.0';
const MODO_CELULAR = true; // o montar.py troca para true na versão do celular (--celular)
const SVGNS = 'http://www.w3.org/2000/svg';
const PROPS_DIRETAS = new Set(['value', 'checked', 'disabled', 'selected', 'hidden', 'readOnly', 'required', 'multiple', 'indeterminate']);

const $ = (sel, raiz = document) => raiz.querySelector(sel);
const $$ = (sel, raiz = document) => Array.from(raiz.querySelectorAll(sel));

function anexar(pai, filhos) {
  for (const f of filhos.flat(Infinity)) {
    if (f == null || f === false || f === true) continue;
    pai.appendChild(f instanceof Node ? f : document.createTextNode(String(f)));
  }
  return pai;
}

function aplicarEstilo(e, estilo) {
  for (const [p, v] of Object.entries(estilo)) {
    if (v == null) continue;
    if (p.startsWith('--')) e.style.setProperty(p, v);
    else e.style[p] = v;
  }
}

function el(tag, props, ...filhos) {
  const e = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = Array.isArray(v) ? v.filter(Boolean).join(' ') : v;
      else if (k === 'style') aplicarEstilo(e, v);
      else if (k === 'text') e.textContent = v;
      else if (k === 'dataset') Object.assign(e.dataset, v);
      else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
      else if (PROPS_DIRETAS.has(k)) e[k] = v;
      else e.setAttribute(k, v === true ? '' : String(v));
    }

  return anexar(e, filhos);
}

function sv(tag, attrs, ...filhos) {
  const e = document.createElementNS(SVGNS, tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;

function limpar(e) { e.replaceChildren(); return e; }

// ---------- Dinheiro (sempre em centavos inteiros) ----------
const _fmtBRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const _fmtNum = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const _fmtPct = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 });

function moeda(c) { return _fmtBRL.format((c || 0) / 100); }
function numeroBR(c) { return _fmtNum.format((c || 0) / 100); }
function pct(x) { return _fmtPct.format(x) + '%'; }

// Valor compacto para eixos e cartões: R$ 950, R$ 12,5 mil, R$ 1,2 mi
function moedaCurta(c) {
  const neg = c < 0; const v = Math.abs(c) / 100;
  let s;
  if (v >= 1e6) s = _fmtPct.format(v / 1e6) + ' mi';
  else if (v >= 1e4) s = _fmtPct.format(v / 1e3) + ' mil';
  else s = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 }).format(v);
  return (neg ? '-' : '') + 'R$ ' + s;
}

// Converte "1.500,50", "1500", "120+35,5", "3*49,90" em centavos. Sem eval.
function parseValor(txt) {
  if (txt == null) return null;
  const s = String(txt).replace(/R\$|\s/g, '');
  if (!s) return null;
  if (!/^[0-9.,+\-*/()]+$/.test(s)) return null;
  const tokens = s.match(/[0-9.,]+|[+\-*/()]/g);
  if (!tokens) return null;
  let i = 0;
  const numero = (t) => {
    let n;
    if (t.includes(',')) n = t.replace(/\./g, '').replace(',', '.');
    else if ((t.match(/\./g) || []).length === 1 && /\.\d{1,2}$/.test(t)) n = t;
    else n = t.replace(/\./g, '');
    const v = Number(n);
    return Number.isFinite(v) ? v : NaN;
  };
  const fator = () => {
    const t = tokens[i++];
    if (t === '(') { const v = expr(); if (tokens[i++] !== ')') return NaN; return v; }
    if (t === '-') return -fator();
    if (t === '+') return fator();
    if (t == null || /[*/)]/.test(t)) return NaN;
    return numero(t);
  };
  const termo = () => {
    let v = fator();
    while (tokens[i] === '*' || tokens[i] === '/') {
      const op = tokens[i++]; const d = fator();
      v = op === '*' ? v * d : (d === 0 ? NaN : v / d);
    }
    return v;
  };
  const expr = () => {
    let v = termo();
    while (tokens[i] === '+' || tokens[i] === '-') {
      const op = tokens[i++]; const d = termo();
      v = op === '+' ? v + d : v - d;
    }
    return v;
  };
  const r = expr();
  if (i !== tokens.length || !Number.isFinite(r)) return null;
  return Math.round(r * 100);
}

// ---------- Datas (texto 'AAAA-MM-DD', sempre no fuso local) ----------
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const MESES_CURTOS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const DIAS_SEMANA = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];

const pad2 = (n) => String(n).padStart(2, '0');
function isoData(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function hojeISO() { return isoData(new Date()); }
function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function dataBR(s) { if (!s) return ''; const [y, m, d] = s.split('-'); return d + '/' + m + '/' + y; }
function dataCurta(s) { const [, m, d] = s.split('-'); return Number(d) + ' ' + MESES_CURTOS[Number(m) - 1]; }
function mesDe(s) { return s.slice(0, 7); }
function mesAtual() { return hojeISO().slice(0, 7); }
function diasNoMes(y, m) { return new Date(y, m, 0).getDate(); }
function addMeses(ym, n) {
  const [y, m] = ym.split('-').map(Number);
  const t = y * 12 + (m - 1) + n;
  return Math.floor(t / 12) + '-' + pad2((t % 12) + 1);
}
function dataNoMes(ym, dia) {
  const [y, m] = ym.split('-').map(Number);
  return ym + '-' + pad2(Math.min(dia, diasNoMes(y, m)));
}
function addMesesData(iso, n) { return dataNoMes(addMeses(iso.slice(0, 7), n), Number(iso.slice(8, 10))); }
function addDias(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return isoData(d); }
function diffDias(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function nomeMes(ym) { const [y, m] = ym.split('-'); return MESES[Number(m) - 1] + ' de ' + y; }
function nomeMesCurto(ym) { const [y, m] = ym.split('-'); return MESES_CURTOS[Number(m) - 1] + '/' + y.slice(2); }
function capitalizar(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }
function mesesEntre(ini, fim) { const r = []; let m = ini; while (m <= fim && r.length < 600) { r.push(m); m = addMeses(m, 1); } return r; }
function agoraISO() { return new Date().toISOString(); }
function horaCurta(isoTs) { const d = new Date(isoTs); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function quandoRelativo(isoData_) {
  const d = diffDias(hojeISO(), isoData_);
  if (d === 0) return 'hoje';
  if (d === 1) return 'amanhã';
  if (d === -1) return 'ontem';
  if (d > 1) return 'em ' + d + ' dias';
  return 'há ' + (-d) + ' dias';
}

// ---------- Diversos ----------
function uid() {
  const b = crypto.getRandomValues(new Uint8Array(8));
  return Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function normalizar(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
function somar(lista, f) { let t = 0; for (const x of lista) t += f(x); return t; }
function agrupar(lista, f) { const m = new Map(); for (const x of lista) { const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; }

function bytesParaB64(bytes) {
  let s = ''; const u = new Uint8Array(bytes);
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}

  const s = atob(b64); const u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);

// Célula de CSV: aspas, ponto e vírgula e proteção contra "injeção de fórmula" no Excel.
function celulaCSV(v) {
  let s = v == null ? '' : String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  if (/[;"\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function baixarArquivo(nome, conteudo, tipo) {
  const blob = conteudo instanceof Blob ? conteudo : new Blob([conteudo], { type: tipo || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: nome });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function carimboArquivo() {
  const d = new Date();
  return isoData(d) + '_' + pad2(d.getHours()) + 'h' + pad2(d.getMinutes());
}

// ===================== 02 - Criptografia =====================
// Modelo "envelope":
//  - Os dados são cifrados com uma CHAVE DE DADOS aleatória (AES-256-GCM).
//  - Essa chave é guardada duas vezes, cifrada: uma pela SENHA MESTRA e outra pelo
//    CÓDIGO DE RECUPERAÇÃO (ambos passam por PBKDF2-SHA256 com muitas iterações).
//  - Nada disso sai do computador. A senha nunca é gravada.
//  - A chave de dados fica na memória como CryptoKey "não extraível".

const CRIPTO = {
  ITER_SENHA: 1000000,
  ITER_RECUP: 150000,
  AAD_DADOS: 'organizador-financeiro/dados/v1',
  AAD_SENHA: 'organizador-financeiro/chave/senha/v1',
  AAD_RECUP: 'organizador-financeiro/chave/recuperacao/v1',
};
const _enc = new TextEncoder();
const _dec = new TextDecoder();

function bytesAleatorios(n) { return crypto.getRandomValues(new Uint8Array(n)); }

async function derivarChave(segredo, sal, iter) {
  const base = await crypto.subtle.importKey('raw', _enc.encode(segredo.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', hash: 'SHA-256', salt: sal, iterations: iter },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

async function cifrarBytes(chave, bytes, aad) {
  const iv = bytesAleatorios(12);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: _enc.encode(aad), tagLength: 128 }, chave, bytes);
  return { iv: bytesParaB64(iv), ct: bytesParaB64(ct) };
}

async function decifrarBytes(chave, pacote, aad) {
  const pt = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64ParaBytes(pacote.iv), additionalData: _enc.encode(aad), tagLength: 128 },
    chave, b64ParaBytes(pacote.ct));
  return new Uint8Array(pt);
}

async function importarChaveDados(bruta) {
  const k = await crypto.subtle.importKey('raw', bruta, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
  bruta.fill(0);
  return k;
}

async function embrulhar(dekBruta, segredo, iter, aad) {
  const sal = bytesAleatorios(16);
  const kek = await derivarChave(segredo, sal, iter);
  const p = await cifrarBytes(kek, dekBruta, aad);
  return { sal: bytesParaB64(sal), iter, iv: p.iv, ct: p.ct };
}

async function desembrulhar(emb, segredo, aad) {
  const kek = await derivarChave(segredo, b64ParaBytes(emb.sal), emb.iter);
  return decifrarBytes(kek, emb, aad); // lança erro se o segredo estiver errado
}

// ---------- Código de recuperação ----------
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'; // Crockford: sem I, L, O, U
function gerarCodigoRecuperacao() {
  const b = bytesAleatorios(20); // 160 bits
  let bits = 0, val = 0, s = '';
  for (const x of b) {
    val = (val << 8) | x; bits += 8;
    while (bits >= 5) { s += B32[(val >>> (bits - 5)) & 31]; bits -= 5; }
    val &= (1 << bits) - 1;
  }
  return s.match(/.{4}/g).join('-');
}
function normalizarCodigo(c) {
  const s = String(c || '').toUpperCase().replace(/[^0-9A-Z]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1');
  return s.length === 32 ? s.match(/.{4}/g).join('-') : null;
}

// ---------- Operações do cofre ----------
async function criarChaves(senha) {
  const dek = bytesAleatorios(32);
  const codigo = gerarCodigoRecuperacao();
  const chaves = {
    senha: await embrulhar(dek, senha, CRIPTO.ITER_SENHA, CRIPTO.AAD_SENHA),
    recuperacao: await embrulhar(dek, normalizarCodigo(codigo), CRIPTO.ITER_RECUP, CRIPTO.AAD_RECUP),
  };
  const chave = await importarChaveDados(dek);
  return { chaves, chave, codigo };
}

async function dekPorCredencial(chaves, cred) {
  if (cred.tipo === 'senha') return desembrulhar(chaves.senha, cred.valor, CRIPTO.AAD_SENHA);
  const cod = normalizarCodigo(cred.valor);
  if (!cod || !chaves.recuperacao) throw new Error('codigo');
  return desembrulhar(chaves.recuperacao, cod, CRIPTO.AAD_RECUP);
}

async function abrirChave(chaves, cred) {
  const bruta = await dekPorCredencial(chaves, cred);
  return importarChaveDados(bruta);
}

async function trocarSenhaChaves(chaves, cred, novaSenha) {
  const bruta = await dekPorCredencial(chaves, cred);
  const senha = await embrulhar(bruta, novaSenha, CRIPTO.ITER_SENHA, CRIPTO.AAD_SENHA);
  bruta.fill(0);
  return { ...chaves, senha };
}

async function novoCodigoChaves(chaves, cred) {
  const bruta = await dekPorCredencial(chaves, cred);
  const codigo = gerarCodigoRecuperacao();
  const recuperacao = await embrulhar(bruta, normalizarCodigo(codigo), CRIPTO.ITER_RECUP, CRIPTO.AAD_RECUP);
  bruta.fill(0);
  return { chaves: { ...chaves, recuperacao }, codigo };
}

async function comprimir(bytes) {
  if (typeof CompressionStream === 'undefined') return { bytes, z: 0 };
  const s = new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
  return { bytes: new Uint8Array(await new Response(s).arrayBuffer()), z: 1 };
}
async function descomprimir(bytes, z) {
  if (!z) return bytes;
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}

async function cifrarDados(chave, obj) {
  const { bytes, z } = await comprimir(_enc.encode(JSON.stringify(obj)));
  const p = await cifrarBytes(chave, bytes, CRIPTO.AAD_DADOS);
  return { ...p, z };
}

async function decifrarDados(chave, pacote) {
  const bytes = await decifrarBytes(chave, pacote, CRIPTO.AAD_DADOS);
  return JSON.parse(_dec.decode(await descomprimir(bytes, pacote.z)));
}

// ---------- Força da senha ----------
const SENHAS_COMUNS = ['senha', 'password', '123456', 'qwerty', 'abc123', 'nelson', 'costa', 'filho', 'advogado', 'advocacia', 'oab', 'prudente', 'brasil', 'deus', 'amor', 'familia', 'admin', 'teste', 'sindicato', 'juridico'];
function forcaSenha(s) {
  if (!s) return { nota: 0, texto: '', ok: false, dicas: [] };
  let pool = 0;
  if (/[a-z]/.test(s)) pool += 26;
  if (/[A-Z]/.test(s)) pool += 26;
  if (/\d/.test(s)) pool += 10;
  if (/[^a-zA-Z0-9]/.test(s)) pool += 33;
  let bits = s.length * Math.log2(Math.max(pool, 2));
  const dicas = [];
  const n = normalizar(s);
  if (/(.)\1{2,}/.test(s)) { bits *= 0.7; dicas.push('evite repetir o mesmo caractere'); }
  if (/(0123|1234|2345|3456|4567|5678|6789|abcd|qwer|asdf)/i.test(s)) { bits *= 0.75; dicas.push('evite sequências como 1234 ou abcd'); }
  if (SENHAS_COMUNS.some((w) => n.includes(w))) { bits *= 0.6; dicas.push('evite palavras óbvias (nome, profissão, cidade, "senha")'); }
  if (/(19|20)\d{2}/.test(s)) { bits *= 0.85; dicas.push('evite anos e datas'); }
  if (s.length < 12) dicas.unshift('use pelo menos 12 caracteres');
  let nota = bits < 50 ? 0 : bits < 65 ? 1 : bits < 85 ? 2 : 3;
  if (s.length < 12) nota = Math.min(nota, 0);
  const texto = ['Fraca', 'Razoável', 'Boa', 'Forte'][nota];
  return { nota, texto, ok: s.length >= 12 && nota >= 2, dicas };
}

// ===================== 03 - Armazenamento =====================
// Três camadas, todas com o conteúdo CIFRADO:
//  1) Navegador (IndexedDB): cópia principal, gravada a cada alteração.
//  2) Arquivo no computador (.cofre) vinculado: gravado junto, a cada alteração
//     (Chrome/Edge). Fica na pasta que o usuário escolher (ex.: Documentos -> Drive).
//  3) Cópias do dia (até 10) dentro do navegador + backup manual (.cofre) baixado.

const ARMAZ = { DB: 'organizador-financeiro', STORE: 'cofre', MAX_SNAPS: 10, MAX_BYTES: 60 * 1024 * 1024 };
// No celular não há arquivo automático: a troca com o computador é por arquivos na pasta do Drive.
const FS_DISPONIVEL = !MODO_CELULAR && typeof window.showSaveFilePicker === 'function';
const PASTA_DISPONIVEL = !MODO_CELULAR && typeof window.showDirectoryPicker === 'function';

let _idb = null;
function abrirIDB() {
  if (_idb) return Promise.resolve(_idb);
  return new Promise((res, rej) => {
    const r = indexedDB.open(ARMAZ.DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(ARMAZ.STORE);
    r.onsuccess = () => { _idb = r.result; res(_idb); };
    r.onerror = () => rej(r.error);
  });
}
async function _tx(modo, fn) {
  const db = await abrirIDB();
  return new Promise((res, rej) => {
    const t = db.transaction(ARMAZ.STORE, modo);
    const st = t.objectStore(ARMAZ.STORE);
    const req = fn(st);
    t.oncomplete = () => res(req ? req.result : undefined);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const idbGet = (k) => _tx('readonly', (s) => s.get(k));
const idbSet = (k, v) => _tx('readwrite', (s) => s.put(v, k));
const idbDel = (k) => _tx('readwrite', (s) => s.delete(k));
const idbChaves = () => _tx('readonly', (s) => s.getAllKeys());

// ---------- Envelope (o "cofre" gravado) ----------
function montarEnvelope(chaves, dados) {
  return { app: 'organizador-financeiro', formato: 1, versaoApp: VERSAO_APP, salvoEm: agoraISO(), chaves, dados };
}
function _embValido(e) {
  return e && typeof e.sal === 'string' && typeof e.iv === 'string' && typeof e.ct === 'string' &&
    Number.isInteger(e.iter) && e.iter >= 100000 && e.iter <= 10000000;
}
function envelopeValido(o) {
  return !!(o && o.app === 'organizador-financeiro' && o.formato === 1 && o.chaves && _embValido(o.chaves.senha) &&
    (o.chaves.recuperacao == null || _embValido(o.chaves.recuperacao)) &&
    o.dados && typeof o.dados.iv === 'string' && typeof o.dados.ct === 'string');
}

async function lerCofreLocal() {
  try { const e = await idbGet('principal'); return envelopeValido(e) ? e : null; } catch { return null; }
}

async function gravarCofreLocal(env) {
  await idbSet('principal', env);
  const hoje = 'snap:' + hojeISO();
  await idbSet(hoje, env); // a cópia do dia é sempre a última versão daquele dia
  const snaps = (await idbChaves()).filter((k) => typeof k === 'string' && k.startsWith('snap:')).sort();
  for (const k of snaps.slice(0, Math.max(0, snaps.length - ARMAZ.MAX_SNAPS))) await idbDel(k);
}

async function listarCopiasDoDia() {
  const ks = (await idbChaves()).filter((k) => typeof k === 'string' && k.startsWith('snap:')).sort().reverse();
  return ks.map((k) => k.slice(5));
}
async function lerCopiaDoDia(dia) { const e = await idbGet('snap:' + dia); return envelopeValido(e) ? e : null; }

async function pedirArmazenamentoPersistente() {
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch { /* opcional */ }
}

// ---------- Arquivo vinculado (File System Access API) ----------
async function arquivoVinculado() { try { return (await idbGet('arquivo')) || null; } catch { return null; } }

async function vincularNovoArquivo() {
  const h = await window.showSaveFilePicker({
    suggestedName: 'financas.cofre', startIn: 'documents',
    types: [{ description: 'Cofre do Organizador Financeiro', accept: { 'application/octet-stream': ['.cofre'] } }],
  });
  await idbSet('arquivo', h);
  return h;
}
async function desvincularArquivo() { await idbDel('arquivo'); }

async function permissaoArquivo(h, pedir) {
  if (!h || !h.queryPermission) return false;
  const o = { mode: 'readwrite' };
  try {
    if ((await h.queryPermission(o)) === 'granted') return true;
    if (pedir && (await h.requestPermission(o)) === 'granted') return true;
  } catch { /* ignorado */ }
  return false;
}

async function gravarNoArquivo(h, env) {
  const w = await h.createWritable();
  await w.write(JSON.stringify(env));
  await w.close();
}

// Lê o cofre que está no arquivo vinculado (null se vazio ou se não for um cofre).
async function lerEnvelopeDoArquivo(h) {
  const f = await h.getFile();
  if (!f.size || f.size > ARMAZ.MAX_BYTES) return null;
  try { const o = JSON.parse(await f.text()); return envelopeValido(o) ? o : null; } catch { return null; }
}

// ---------- Pasta do cofre (computador): financas.cofre + subpasta "do celular" ----------
// Uma só autorização do Chrome cobre as duas coisas.
const NOME_ARQUIVO = 'financas.cofre';
const NOME_SUBPASTA = 'do celular';
async function pastaVinculada() { try { return (await idbGet('pasta')) || null; } catch { return null; } }
async function vincularPasta() {
  const h = await window.showDirectoryPicker({ id: 'pasta-cofre', mode: 'readwrite', startIn: 'documents' });
  await idbSet('pasta', h);
  await idbDel('arquivo'); // o arquivo avulso antigo (se houver) deixa de ser usado
  return h;
}
async function desvincularPasta() { await idbDel('pasta'); }
const arquivoDaPasta = (pasta) => pasta.getFileHandle(NOME_ARQUIVO, { create: true });
const subpastaCelular = (pasta) => pasta.getDirectoryHandle(NOME_SUBPASTA, { create: true });
async function arquivosCofreNaPasta(dir) {
  const r = [];
  for await (const [nome, h] of dir.entries()) {
    if (h.kind !== 'file' || !/\.cofre$/i.test(nome)) continue;
    const f = await h.getFile();
    if (f.size && f.size <= ARMAZ.MAX_BYTES) r.push({ nome, arquivo: f, chave: nome + '|' + f.size + '|' + f.lastModified });
  }
  return r.sort((a, b) => a.arquivo.lastModified - b.arquivo.lastModified);
}

// ---------- Abrir arquivo .cofre (restaurar, importar, trocar de computador) ----------
function escolherArquivoPorInput(aceitar) {
  return new Promise((res) => {
    const inp = el('input', { type: 'file', accept: aceitar || '', style: { display: 'none' } });
    inp.addEventListener('change', () => { res(inp.files && inp.files[0] ? inp.files[0] : null); inp.remove(); });
    document.body.appendChild(inp);
    inp.click();
  });
}

async function lerArquivoCofre() {
  let arquivo = null, handle = null;
  if (!MODO_CELULAR && typeof window.showOpenFilePicker === 'function') {
    try {
      [handle] = await window.showOpenFilePicker({
        types: [{ description: 'Cofre do Organizador Financeiro', accept: { 'application/octet-stream': ['.cofre'] } }],
        excludeAcceptAllOption: false, multiple: false,
      });
      arquivo = await handle.getFile();
    } catch (e) { if (e && e.name === 'AbortError') return null; handle = null; }
  }
  // no Android, filtrar por ".cofre" deixa o arquivo cinza no seletor; por isso lá não se filtra
  if (!arquivo) arquivo = await escolherArquivoPorInput(MODO_CELULAR ? '' : '.cofre,.json');
  if (!arquivo) return null;
  if (arquivo.size > ARMAZ.MAX_BYTES) throw new Error('Arquivo grande demais para ser um cofre.');
  let obj;
  try { obj = JSON.parse(await arquivo.text()); } catch { throw new Error('Este arquivo não é um cofre do Organizador Financeiro.'); }
  if (!envelopeValido(obj)) throw new Error('Este arquivo não é um cofre do Organizador Financeiro (ou está danificado).');
  return { env: obj, handle, nome: arquivo.name };
}

function baixarBackup(env) {
  baixarArquivo('backup-financas_' + carimboArquivo() + '.cofre', JSON.stringify(env), 'application/octet-stream');
}

// Celular: entrega o cofre ao menu "Compartilhar" do Android (escolher Drive > pasta "do celular").
async function compartilharCofre(env, nome) {
  const arq = new File([JSON.stringify(env)], nome, { type: 'application/octet-stream' });
  if (navigator.canShare && navigator.canShare({ files: [arq] })) {
    try { await navigator.share({ files: [arq], title: nome }); return 'compartilhado'; } catch (e) { if (e && e.name === 'AbortError') return 'cancelado'; }
  }
  baixarArquivo(nome, arq);
  return 'baixado';
}

// ===================== 04 - Dados: modelo, padrões, validação, migração, sincronização =====================

// e os dados antigos são convertidos sozinhos ao abrir (nada do que já foi cadastrado se perde).

const VERSAO_DADOS = 2;
const MIGRACOES = {
  // 1 -> 2 (v1.2.0): cadastro de pessoas (parceiros), categoria de repasse, campos pagoEm/divisao nos lançamentos.
  1: (db) => {

    }

};

const SESSAO = {

  arquivo: null, arquivoPermitido: false, salvoNoArquivo: null, // salvoEm do que está no arquivo e já conhecemos
  pasta: null, pastaPermitida: false,                               // pasta "do celular" (só no computador)

const ESCOPOS = { P: 'Pessoal', E: 'Escritório' };
