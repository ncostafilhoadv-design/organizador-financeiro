  const t = agoraISO();
  const cat = CATEGORIAS_PADRAO.map(([id, nome, tipo, escopo, cor, ir]) => ({ id, nome, tipo, escopo, cor, ir: !!ir, arquivada: false, criadoEm: t, atualizadoEm: t }));
  const conta = (id, nome, tipo, escopo, cor) => ({ id, nome, tipo, escopo, cor, saldoInicial: 0, dataSaldo: hojeISO(), arquivada: false, criadoEm: t, atualizadoEm: t });
  return {
    versao: VERSAO_DADOS, dispositivo: uid(), criadoEm: t, atualizadoEm: t,
    config: { bloqueioMin: 5, ocultarValores: false, tema: 'auto', escopo: 'T', ultimoBackup: null, boasVindas: true, ultimoEnvio: null, importados: [] },
    contas: [conta('k-pessoal', 'Conta pessoal', 'corrente', 'P', 0), conta('k-escritorio', 'Conta do escritório', 'corrente', 'E', 2), conta('k-dinheiro', 'Dinheiro', 'dinheiro', 'P', 3)],
    categorias: cat,
    lancamentos: [],
    pessoas: [],
    excluidos: {},
  };
}

// ---------- Validação (tudo o que entra passa por aqui: abrir, importar, juntar) ----------
const RX_ID = /^[a-z0-9-]{3,40}$/;
const RX_DATA = /^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/;
const RX_MES = /^\d{4}-(0[1-9]|1[0-2])$/;
const RX_TS = /^\d{4}-\d{2}-\d{2}T[\d:.]+Z$/;
const MAX_CENT = 1e13;

const vTexto = (v, max) => (typeof v === 'string' ? v.replace(/[\u0000-\u001f\u007f‪-‮⁦-⁩]/g, ' ').trim().slice(0, max) : '');
const vInt = (v, min, max, padrao) => (Number.isInteger(v) && v >= min && v <= max ? v : padrao);
const vEnum = (v, obj, padrao) => (typeof v === 'string' && Object.prototype.hasOwnProperty.call(obj, v) ? v : padrao);
const vData = (v, padrao) => (typeof v === 'string' && RX_DATA.test(v) ? v : padrao);
const vMes = (v, padrao) => (typeof v === 'string' && RX_MES.test(v) ? v : padrao);
const vTs = (v) => (typeof v === 'string' && RX_TS.test(v) ? v : '2000-01-01T00:00:00.000Z');
const vBool = (v) => v === true;

function sanitizarConta(c) {
  if (!c || !RX_ID.test(c.id)) return null;
  const o = {
    id: c.id, nome: vTexto(c.nome, 80) || 'Conta', tipo: vEnum(c.tipo, TIPOS_CONTA, 'outra'), escopo: vEnum(c.escopo, ESCOPOS, 'P'),
    cor: vInt(c.cor, 0, 7, 0), saldoInicial: vInt(c.saldoInicial, -MAX_CENT, MAX_CENT, 0), dataSaldo: vData(c.dataSaldo, '2000-01-01'),
    arquivada: vBool(c.arquivada), criadoEm: vTs(c.criadoEm), atualizadoEm: vTs(c.atualizadoEm),
  };
  if (o.tipo === 'cartao') {
    o.limite = vInt(c.limite, 0, MAX_CENT, 0);
    o.fechamento = vInt(c.fechamento, 1, 31, 1);
    o.vencimento = vInt(c.vencimento, 1, 31, 10);
    o.contaPagamentoId = typeof c.contaPagamentoId === 'string' && RX_ID.test(c.contaPagamentoId) ? c.contaPagamentoId : null;
    // v3: este cartão usa o limite de outro (ex.: cartão pessoal e do escritório no mesmo banco, limite único)
    o.limiteCom = typeof c.limiteCom === 'string' && RX_ID.test(c.limiteCom) && c.limiteCom !== c.id ? c.limiteCom : null;
    if (o.limiteCom) o.limite = 0;
    o.saldoInicial = 0;
  }
  return o;
}

function sanitizarCategoria(c) {
  if (!c || !RX_ID.test(c.id)) return null;
  return {
    id: c.id, nome: vTexto(c.nome, 80) || 'Categoria', tipo: c.tipo === 'entrada' ? 'entrada' : 'saida',
    escopo: c.escopo === 'P' || c.escopo === 'E' ? c.escopo : 'A', cor: vInt(c.cor, 0, 7, 0), ir: vBool(c.ir),
    arquivada: vBool(c.arquivada), criadoEm: vTs(c.criadoEm), atualizadoEm: vTs(c.atualizadoEm),
  };
}

function sanitizarLanc(l) {
  if (!l || !RX_ID.test(l.id)) return null;
  const tipo = l.tipo === 'entrada' || l.tipo === 'saida' || l.tipo === 'transferencia' ? l.tipo : null;
  const valor = vInt(l.valor, 1, MAX_CENT, 0);
  const data = vData(l.data, null);
  if (!tipo || !valor || !data || typeof l.contaId !== 'string' || !RX_ID.test(l.contaId)) return null;
  const o = {
    id: l.id, tipo, descricao: vTexto(l.descricao, 120), valor, data, competencia: vMes(l.competencia, mesDe(data)),
    contaId: l.contaId, escopo: vEnum(l.escopo, ESCOPOS, 'P'), status: l.status === 'pendente' ? 'pendente' : 'pago',
    pessoa: vTexto(l.pessoa, 100), forma: vEnum(l.forma, FORMAS, ''), obs: vTexto(l.obs, 2000),
    criadoEm: vTs(l.criadoEm), atualizadoEm: vTs(l.atualizadoEm),
  };
  if (tipo === 'transferencia') {
    if (typeof l.contaDestinoId !== 'string' || !RX_ID.test(l.contaDestinoId) || l.contaDestinoId === l.contaId) return null;
    o.contaDestinoId = l.contaDestinoId;
  } else {
    o.categoriaId = typeof l.categoriaId === 'string' && RX_ID.test(l.categoriaId) ? l.categoriaId : null;
  }
  if (typeof l.grupo === 'string' && RX_ID.test(l.grupo)) {
    o.grupo = l.grupo; o.rec = l.rec === 'fixo' ? 'fixo' : 'parcelado';
    o.parcela = vInt(l.parcela, 1, 600, 1); o.parcelas = vInt(l.parcelas, 1, 600, 1);
  }
  if (l.fatura != null) { const f = vMes(l.fatura, null); if (f) o.fatura = f; }
  // v2: data em que foi efetivamente pago/recebido (pode ser antes ou depois do vencimento)
  if (o.status === 'pago' && l.pagoEm != null) { const p = vData(l.pagoEm, null); if (p) o.pagoEm = p; }
  // v2: divisão com parceiros (só entradas) e ligação do repasse com a entrada de origem
  if (tipo === 'entrada' && Array.isArray(l.divisao)) {
    const d = l.divisao.slice(0, 20).map((x) => (x && typeof x.parceiroId === 'string' && RX_ID.test(x.parceiroId)
      ? { parceiroId: x.parceiroId, valor: vInt(x.valor, 1, MAX_CENT, 0), modo: x.modo === 'direto' ? 'direto' : 'repasse' } : null)).filter((x) => x && x.valor);
    if (d.length) o.divisao = d;
  }
  if (tipo === 'saida' && typeof l.origemId === 'string' && RX_ID.test(l.origemId)) {
    o.origemId = l.origemId;
    if (typeof l.parceiroId === 'string' && RX_ID.test(l.parceiroId)) o.parceiroId = l.parceiroId;
  }
  // v3: identificador da linha no extrato do banco (evita importar a mesma linha duas vezes)
  if (typeof l.idExterno === 'string' && l.idExterno.trim()) o.idExterno = vTexto(l.idExterno, 120);
  return o;
}

const TIPOS_PESSOA = { parceiro: 'Parceiro', cliente: 'Cliente' };
function sanitizarPessoa(p) {
  if (!p || !RX_ID.test(p.id)) return null;
  return {
    id: p.id, nome: vTexto(p.nome, 100) || 'Sem nome', tipo: vEnum(p.tipo, TIPOS_PESSOA, 'parceiro'),
    telefone: vTexto(p.telefone, 40), email: vTexto(p.email, 120), documento: vTexto(p.documento, 40), oab: vTexto(p.oab, 40),
    obs: vTexto(p.obs, 2000), arquivada: vBool(p.arquivada), criadoEm: vTs(p.criadoEm), atualizadoEm: vTs(p.atualizadoEm),
  };
}

function sanitizarDB(bruto) {
  if (!bruto || typeof bruto !== 'object' || !Array.isArray(bruto.lancamentos)) throw new Error('Dados em formato desconhecido.');
  const base = dbVazio();
  const cfg = bruto.config || {};
  const db = {
    versao: VERSAO_DADOS,
    dispositivo: typeof bruto.dispositivo === 'string' && /^[a-f0-9]{16}$/.test(bruto.dispositivo) ? bruto.dispositivo : base.dispositivo,
    criadoEm: vTs(bruto.criadoEm), atualizadoEm: vTs(bruto.atualizadoEm),
    config: {
      bloqueioMin: [1, 3, 5, 10, 15, 30].includes(cfg.bloqueioMin) ? cfg.bloqueioMin : 5,
      ocultarValores: vBool(cfg.ocultarValores), tema: ['auto', 'claro', 'escuro'].includes(cfg.tema) ? cfg.tema : 'auto',
      escopo: ['T', 'P', 'E'].includes(cfg.escopo) ? cfg.escopo : 'T',
      ultimoBackup: typeof cfg.ultimoBackup === 'string' && RX_TS.test(cfg.ultimoBackup) ? cfg.ultimoBackup : null,
      boasVindas: cfg.boasVindas !== false,
      ultimoEnvio: typeof cfg.ultimoEnvio === 'string' && RX_TS.test(cfg.ultimoEnvio) ? cfg.ultimoEnvio : null,
      importados: Array.isArray(cfg.importados) ? cfg.importados.filter((x) => typeof x === 'string' && x.length <= 300).slice(-300) : [],
    },
    contas: (bruto.contas || []).map(sanitizarConta).filter(Boolean),
    categorias: (bruto.categorias || []).map(sanitizarCategoria).filter(Boolean),
    lancamentos: bruto.lancamentos.map(sanitizarLanc).filter(Boolean),
    pessoas: (Array.isArray(bruto.pessoas) ? bruto.pessoas : []).map(sanitizarPessoa).filter(Boolean),
    excluidos: {},
  };
  if (bruto.excluidos && typeof bruto.excluidos === 'object') {
    for (const [k, v] of Object.entries(bruto.excluidos)) if (RX_ID.test(k) && typeof v === 'string' && RX_TS.test(v)) db.excluidos[k] = v;
  }
  // Integridade: dois registros com o mesmo código ficam um só (o alterado por último).
  for (const col of ['contas', 'categorias', 'lancamentos', 'pessoas']) {
    const mapa = new Map();
    for (const x of db[col]) { const y = mapa.get(x.id); if (!y || x.atualizadoEm > y.atualizadoEm) mapa.set(x.id, x); }
    if (mapa.size !== db[col].length) db[col] = Array.from(mapa.values());
  }
  // Integridade: lançamento que aponta para conta inexistente vai para "Conta recuperada".
  const contas = new Set(db.contas.map((c) => c.id));
  let recuperada = false;
  for (const l of db.lancamentos) {
    if (!contas.has(l.contaId)) { l.contaId = 'k-recuperada'; recuperada = true; }
    if (l.tipo === 'transferencia' && !contas.has(l.contaDestinoId)) { l.contaDestinoId = 'k-recuperada'; recuperada = true; }
  }
  if (recuperada && !contas.has('k-recuperada')) {
    db.contas.push({ ...sanitizarConta({ id: 'k-recuperada', nome: 'Conta recuperada', tipo: 'outra', escopo: 'P' }), criadoEm: agoraISO(), atualizadoEm: agoraISO() });
  }
  // Limite compartilhado só vale apontando para outro cartão que tenha limite próprio (sem correntes).
  const porId = new Map(db.contas.map((c) => [c.id, c]));
  for (const c of db.contas) {
    if (!c.limiteCom) continue;
    const alvo = porId.get(c.limiteCom);
    if (!alvo || alvo.tipo !== 'cartao' || alvo.limiteCom) c.limiteCom = null;
  }
  const cats = new Set(db.categorias.map((c) => c.id));
  for (const l of db.lancamentos) if (l.categoriaId && !cats.has(l.categoriaId)) l.categoriaId = null;
  return db;
}

function migrar(db) {
  if (!Number.isInteger(db.versao) || db.versao < 1) db.versao = 1;
  if (db.versao > VERSAO_DADOS) { const e = new Error('Este cofre foi salvo por uma versão mais nova do Organizador. Abra-o com a versão mais recente do aplicativo.'); e.versaoNova = true; throw e; }
  while (db.versao < VERSAO_DADOS) {
    const f = MIGRACOES[db.versao];
    if (!f) throw new Error('Não sei converter os dados da versão ' + db.versao + '.');
    f(db);
  }
  return db;
}

function prepararDB(bruto) { return sanitizarDB(migrar(bruto)); }

// ---------- Juntar dois cofres (outro aparelho, backup antigo) ----------
// Cada registro fica na versão alterada por último; exclusões são respeitadas.
function juntarDB(atual, outro) {
  const r = JSON.parse(JSON.stringify(atual));
  const excl = { ...outro.excluidos, ...atual.excluidos };
  for (const [k, v] of Object.entries(outro.excluidos)) if (!excl[k] || v > excl[k]) excl[k] = v;
  let novos = 0, atualizados = 0;
  for (const col of ['contas', 'categorias', 'lancamentos', 'pessoas']) {
    if (!Array.isArray(r[col])) r[col] = [];
    const mapa = new Map(r[col].map((x) => [x.id, x]));
    for (const x of (outro[col] || [])) {
      const y = mapa.get(x.id);
      if (!y) { mapa.set(x.id, x); novos++; } else if (x.atualizadoEm > y.atualizadoEm) { mapa.set(x.id, x); atualizados++; }
    }
    r[col] = Array.from(mapa.values()).filter((x) => !(excl[x.id] && excl[x.id] >= x.atualizadoEm));
  }
  r.excluidos = excl;
  return { db: sanitizarDB(r), novos, atualizados };
}

// "Impressão digital" do conteúdo (sem as preferências de cada aparelho): dois cofres com a mesma
// assinatura têm exatamente os mesmos dados. Serve para não regravar nem reenviar o que já é igual.
function _canonico(v) {
  if (Array.isArray(v)) return v.map(_canonico);
  if (v && typeof v === 'object') { const o = {}; for (const k of Object.keys(v).sort()) o[k] = _canonico(v[k]); return o; }
  return v;
}
function assinaturaDB(db) {
  const ord = (a) => (a || []).slice().sort((x, y) => (x.id < y.id ? -1 : x.id > y.id ? 1 : 0));
  return JSON.stringify(_canonico([ord(db.contas), ord(db.categorias), ord(db.lancamentos), ord(db.pessoas), db.excluidos || {}]));
}

// ---------- Gravação ----------
let _salvando = false, _salvarDeNovo = false, _alteracoesPendentes = false;

async function salvarAgora() {
  if (!SESSAO.chave || !DB) return;
  if (_salvando) { _salvarDeNovo = true; return; }
  _salvando = true;
  indicarSalvamento('salvando');
  try {
    const dados = await cifrarDados(SESSAO.chave, DB);
    const env = montarEnvelope(SESSAO.chaves, dados);
    await gravarCofreLocal(env);
    SESSAO.ultimoEnv = env;
    _alteracoesPendentes = false;
    let arquivo = null;
    if (SESSAO.arquivo && SESSAO.arquivoPermitido) {
      try { arquivo = await gravarNoArquivoComSeguranca(env); } catch (e) { console.error(e); arquivo = false; SESSAO.arquivoPermitido = false; }
    }
    indicarSalvamento('salvo', arquivo);
    if (MODO_CELULAR) nuvemAposSalvar();
  } catch (e) {
    console.error(e);
    indicarSalvamento('erro');
  } finally {
    _salvando = false;
    if (_salvarDeNovo) { _salvarDeNovo = false; salvarAgora(); }
  }
}
const _agendarSalvar = debounce(salvarAgora, 300);

// Abre os dados de outro envelope do MESMO cofre (mesma chave). Se for de outro cofre, avisa com e.outroCofre.
async function dadosDoMesmoCofre(env) {
  let dados;
  try { dados = await decifrarDados(SESSAO.chave, env.dados); } catch { const e = new Error('Este arquivo pertence a outro cofre.'); e.outroCofre = true; throw e; }
  return prepararDB(dados);
}

// Junta ao cofre aberto os dados de outro aparelho (já abertos). Preferências continuam as deste aparelho.
// r.mudou diz se algo mudou aqui (inclusive exclusões feitas lá, que não contam como novos/atualizados).
function juntarDados(outro) {
  const antes = assinaturaDB(DB);
  const r = juntarDB(DB, outro);
  r.db.config = DB.config;
  DB = r.db;
  r.mudou = assinaturaDB(DB) !== antes;
  return r;
}
function textoDoQueChegou(r) {
  const n = r.novos + r.atualizados;
  if (n) return `${n} ${n === 1 ? 'item novo ou alterado' : 'itens novos ou alterados'}`;
  return r.mudou ? 'exclusões feitas lá' : 'nada novo';
}

// Junta ao cofre aberto os dados de outro envelope do MESMO cofre (outro aparelho, arquivo alterado por fora).
async function juntarEnvelope(env) { return juntarDados(await dadosDoMesmoCofre(env)); }

async function _marcarArquivoConhecido(salvoEm) {
  SESSAO.salvoNoArquivo = salvoEm;
  try { SESSAO.modArquivo = (await SESSAO.arquivo.getFile()).lastModified; } catch { SESSAO.modArquivo = null; }
}

// Antes de gravar no arquivo vinculado, confere se outro aparelho (o celular, pelo Drive, ou outro computador)
// gravou nele depois de nós. Se gravou, junta primeiro; se o arquivo for de outro cofre, NÃO grava por cima.
// Se depois de juntar o arquivo já tiver tudo o que há aqui, não regrava (evita ida e volta sem fim com o celular).
async function gravarNoArquivoComSeguranca(env) {
  const noArquivo = await lerEnvelopeDoArquivo(SESSAO.arquivo);
  if (noArquivo && noArquivo.salvoEm !== SESSAO.salvoNoArquivo) {
    let doArquivo;
    try { doArquivo = await dadosDoMesmoCofre(noArquivo); } catch (e) {
      if (e.outroCofre) {
        SESSAO.arquivoPermitido = false;
        avisar('O arquivo da pasta é de outro cofre. Não gravei por cima dele. Escolha a pasta certa em Configurações › Backup e sincronização.', 'erro');
        return false;
      }
      if (e.versaoNova) { avisar('O celular gravou com uma versão mais nova do app. Recarregue esta página (F5) para atualizar. Nada foi perdido.', 'atencao'); return false; }
      throw e;
    }
    const r = juntarDados(doArquivo);
    if (r.mudou) {
      avisar('Chegou do outro aparelho: ' + textoDoQueChegou(r) + '.');
      env = montarEnvelope(SESSAO.chaves, await cifrarDados(SESSAO.chave, DB));
      await gravarCofreLocal(env);
      SESSAO.ultimoEnv = env;
      renderizar();
    }
    if (assinaturaDB(DB) === assinaturaDB(doArquivo)) { await _marcarArquivoConhecido(noArquivo.salvoEm); return true; }
  }
  await gravarNoArquivo(SESSAO.arquivo, env);
  await _marcarArquivoConhecido(env.salvoEm);
  return true;
}

// Chamar depois de qualquer alteração nos dados.
function mudou(semRender) {
  DB.atualizadoEm = agoraISO();
  _alteracoesPendentes = true;
  _agendarSalvar();
  if (!semRender) renderizar();
}

function carimbar(obj, novo) { const t = agoraISO(); if (novo) obj.criadoEm = t; obj.atualizadoEm = t; return obj; }
function registrarExclusao(id) { DB.excluidos[id] = agoraISO(); }

// ---------- Acesso rápido ----------
const pessoaPorId = (id) => (DB.pessoas || []).find((p) => p.id === id);
const nomePessoa = (id) => (pessoaPorId(id) || {}).nome || 'Parceiro removido';
const parceirosAtivos = () => (DB.pessoas || []).filter((p) => p.tipo === 'parceiro' && !p.arquivada).sort((a, b) => a.nome.localeCompare(b.nome));
// Data em que o dinheiro realmente entrou/saiu (vale para o saldo); o vencimento continua em "data".
const dataEfetiva = (l) => (l.status === 'pago' && l.pagoEm ? l.pagoEm : l.data);

// Mantém as saídas "Repasse a parceiro" ligadas a uma entrada dividida no modo "eu repasso".
// Cria o que falta, atualiza o que mudou e apaga o repasse de parceiro retirado da divisão.
function sincronizarRepasses(ent) {
  const ligados = DB.lancamentos.filter((x) => x.origemId === ent.id);
  const linhas = ent.tipo === 'entrada' ? (ent.divisao || []).filter((d) => d.modo === 'repasse') : [];
  const usados = new Set();
  for (const d of linhas) {
    let s = ligados.find((x) => x.parceiroId === d.parceiroId && !usados.has(x.id));
    const nome = nomePessoa(d.parceiroId);
    if (!s) {
      s = carimbar({ id: uid(), tipo: 'saida', status: 'pendente', origemId: ent.id, parceiroId: d.parceiroId, categoriaId: 'c-repasse', forma: '', obs: '' }, true);
      DB.lancamentos.push(s);
    }
    usados.add(s.id);
    // o repasse vence quando o dinheiro do cliente entra (se já entrou, na data real do recebimento)
    Object.assign(s, { valor: d.valor, data: dataEfetiva(ent), contaId: ent.contaId, escopo: ent.escopo, pessoa: nome,
      descricao: 'Repasse a ' + nome + (ent.descricao ? ' – ' + ent.descricao : '') });
    if (s.grupo) { delete s.grupo; delete s.rec; delete s.parcela; delete s.parcelas; }
    recalcularCompetencia(s);
    carimbar(s);
  }
  const sobras = ligados.filter((x) => !usados.has(x.id));
  if (sobras.length) {
    const ids = new Set(sobras.map((x) => x.id));
    DB.lancamentos = DB.lancamentos.filter((x) => !ids.has(x.id));
    for (const id of ids) registrarExclusao(id);
  }
  return sobras.length;
}

const contaPorId = (id) => DB.contas.find((c) => c.id === id);
const categoriaPorId = (id) => DB.categorias.find((c) => c.id === id);
const nomeConta = (id) => (contaPorId(id) || {}).nome || '—';
const nomeCategoria = (id) => (categoriaPorId(id) || {}).nome || 'Sem categoria';
const contasAtivas = () => DB.contas.filter((c) => !c.arquivada);
const ehCartao = (id) => { const c = contaPorId(id); return !!c && c.tipo === 'cartao'; };

// ===================== 05 - Cálculos (saldos, meses, faturas, pendências) =====================
// Convenções:
//  - "competencia" (AAAA-MM) decide em que mês a entrada/saída conta nos relatórios.
//    Compra no cartão conta no mês da FATURA; o resto, no mês da data.
//  - Saldo de conta: saldo inicial (na data informada) + lançamentos PAGOS a partir dessa data,
//    cada um na data em que foi pago (pagoEm), não na do vencimento.
//  - Transferência (inclusive pagamento de fatura) mexe nos saldos, mas não é entrada nem saída.

const ESTADO = {
  aba: 'painel',
  periodo: { tipo: 'mes', mes: null },
  filtros: { entrada: {}, saida: {} },
  visao: { entrada: 'periodo', saida: 'periodo' },
};

function escopoAtual() { return DB.config.escopo; }
function noEscopo(x) { const e = DB.config.escopo; return e === 'T' || x.escopo === e; }

function mesesDoPeriodo(p = ESTADO.periodo) {
  const fim = p.mes || mesAtual();
  if (p.tipo === 'mes') return [fim];
  if (p.tipo === 'ano') return mesesEntre(fim.slice(0, 4) + '-01', fim.slice(0, 4) + '-12');
  const n = { '3m': 3, '6m': 6, '12m': 12 }[p.tipo] || 1;
  return mesesEntre(addMeses(fim, -(n - 1)), fim);
}
function rotuloPeriodo(p = ESTADO.periodo) {
  const ms = mesesDoPeriodo(p);
  if (p.tipo === 'mes') return capitalizar(nomeMes(ms[0]));
  if (p.tipo === 'ano') return 'Ano de ' + ms[0].slice(0, 4);
  return capitalizar(nomeMesCurto(ms[0])) + ' a ' + nomeMesCurto(ms[ms.length - 1]);
}

// ---------- Saldos ----------
function efeitoNaConta(l, contaId) {
  if (l.tipo === 'entrada') return l.contaId === contaId ? l.valor : 0;
  if (l.tipo === 'saida') return l.contaId === contaId ? -l.valor : 0;
  let v = 0;
  if (l.contaId === contaId) v -= l.valor;
  if (l.contaDestinoId === contaId) v += l.valor;
  return v;
}

// Cartão: a compra conta pela data (parcelas da mesma compra entram juntas, é a dívida total);
// o pagamento da fatura conta quando estiver pago.
function saldoConta(conta, ateData) {
  const cartao = conta.tipo === 'cartao';
  if (ateData && !cartao && ateData < conta.dataSaldo) return 0;
  const lim = ateData || hojeISO();
  let s = cartao ? 0 : conta.saldoInicial;
  for (const l of DB.lancamentos) {
    if (l.contaId !== conta.id && l.contaDestinoId !== conta.id) continue;
    if (!cartao && dataEfetiva(l) < conta.dataSaldo) continue;
    const compraNoCartao = cartao && l.contaId === conta.id && l.tipo !== 'transferencia';
    if (compraNoCartao) { if (l.data > lim) continue; }
    else {
      if (l.status !== 'pago') continue;
      if (ateData && dataEfetiva(l) > ateData) continue;
    }
    s += efeitoNaConta(l, conta.id);
  }
  return s;
}

// Explica de onde vem o saldo de uma conta (o mesmo cálculo de saldoConta, sem data limite).
function composicaoSaldo(conta) {
  const r = { inicial: conta.saldoInicial, entradas: 0, saidas: 0, transfEntrou: 0, transfSaiu: 0, pendEnt: 0, pendSai: 0 };
  for (const l of DB.lancamentos) {
    if (l.contaId !== conta.id && l.contaDestinoId !== conta.id) continue;
    if (dataEfetiva(l) < conta.dataSaldo) continue;
    if (l.status !== 'pago') { if (l.tipo === 'entrada') r.pendEnt += l.valor; else if (l.tipo === 'saida') r.pendSai += l.valor; continue; }
    if (l.tipo === 'entrada') r.entradas += l.valor;
    else if (l.tipo === 'saida') r.saidas += l.valor;
    else if (l.contaDestinoId === conta.id) r.transfEntrou += l.valor;
    else r.transfSaiu += l.valor;
  }
  r.saldo = r.inicial + r.entradas - r.saidas + r.transfEntrou - r.transfSaiu;
  return r;
}

// Faturas de cartão que vencem no mês (no mês atual, inclui as atrasadas). Parcelas futuras ficam de fora.
function faturasAPagarNoMes(mes) {
  const hojeMes = mesAtual();
  const lista = [];
  for (const c of contasDoEscopo(false).filter((x) => x.tipo === 'cartao')) {
    for (const f of faturasDoCartao(c)) {
      const m = mesDe(f.vencimento);
      if (f.restante > 0 && (m === mes || (mes === hojeMes && m < mes))) lista.push({ cartao: c, fatura: f });
    }
  }
  return { total: somar(lista, (x) => x.fatura.restante), lista };
}

// Pessoal x escritório misturados: lançamento de um tipo feito em conta do outro tipo.
const ehMisturado = (l) => { if (l.tipo === 'transferencia') return false; const c = contaPorId(l.contaId); return !!c && c.escopo !== l.escopo; };
function misturas(meses) {
  const set = new Set(meses);
  const r = { pPagouE: 0, ePagouP: 0, eEntrouP: 0, pEntrouE: 0, itens: [] };
  for (const l of DB.lancamentos) {
    if (!set.has(l.competencia) || !ehMisturado(l)) continue;
    const c = contaPorId(l.contaId);
    r.itens.push(l);
    if (l.tipo === 'saida') { if (c.escopo === 'P') r.pPagouE += l.valor; else r.ePagouP += l.valor; }
    else if (c.escopo === 'P') r.eEntrouP += l.valor; else r.pEntrouE += l.valor;
  }
  // positivo: o escritório deve ao pessoal; negativo: o pessoal deve ao escritório
  r.escritorioDeve = (r.pPagouE - r.eEntrouP) - (r.ePagouP - r.pEntrouE);
  return r;
}

// Repasse cuja entrada de origem o cliente ainda não pagou: não é devido ainda.
function origemPendente(l) {
  if (!l.origemId) return false;
  const o = DB.lancamentos.find((x) => x.id === l.origemId);
  return !!o && o.status !== 'pago';
}

// Quanto cada parceiro recebeu (direto do cliente ou por repasse), quanto falta repassar
// (o cliente já pagou ao senhor) e quanto aguarda o cliente pagar.
function resumoParceiros(meses) {
  const set = meses ? new Set(meses) : null;
  const r = new Map();
  const balde = (id) => { if (!r.has(id)) r.set(id, { direto: 0, repassado: 0, aRepassar: 0, aguardando: 0, itens: [] }); return r.get(id); };
  for (const e of DB.lancamentos) {
    if (e.tipo !== 'entrada' || !e.divisao || !noEscopo(e)) continue;
    if (set && !set.has(e.competencia)) continue;
    for (const d of e.divisao) {
      const b = balde(d.parceiroId);
      if (d.modo === 'direto') { b.direto += d.valor; b.itens.push({ ent: e, d, situacao: 'direto' }); continue; }
      const s = DB.lancamentos.find((x) => x.origemId === e.id && x.parceiroId === d.parceiroId);
      const situacao = s && s.status === 'pago' ? 'repassado' : e.status === 'pago' ? 'a repassar' : 'aguardando';
      if (situacao === 'repassado') b.repassado += d.valor; else if (situacao === 'a repassar') b.aRepassar += d.valor; else b.aguardando += d.valor;
      b.itens.push({ ent: e, d, situacao, saida: s });
    }
  }
  return r;
}

// Recalcula mês de competência e fatura depois de mudar data ou conta.
function recalcularCompetencia(l) {
  const c = contaPorId(l.contaId);
  if (l.tipo !== 'transferencia' && c && c.tipo === 'cartao') {
    const base = faturaDaCompra(c, l.data);
    l.fatura = l.rec === 'parcelado' && l.parcela ? addMeses(base, l.parcela - 1) : base;
    l.competencia = l.fatura;
    l.status = 'pago';
  } else {
    if (l.tipo !== 'transferencia' || !ehCartao(l.contaDestinoId)) delete l.fatura;
    l.competencia = mesDe(l.data);
  }
}

function contasDoEscopo(incluirArquivadas) {
  return DB.contas.filter((c) => (incluirArquivadas || !c.arquivada) && noEscopo(c));
}
// Saldo "disponível": contas que não são cartão.
function saldoDisponivel(ateData) {
  return somar(contasDoEscopo(true).filter((c) => c.tipo !== 'cartao'), (c) => saldoConta(c, ateData));
}

// ---------- Totais por mês (competência) ----------
function baldesMensais() {
  const m = new Map();
  for (const l of DB.lancamentos) {
    if (l.tipo === 'transferencia' || !noEscopo(l)) continue;
    let b = m.get(l.competencia);
    if (!b) { b = { ent: 0, entPago: 0, sai: 0, saiPago: 0 }; m.set(l.competencia, b); }
    if (l.tipo === 'entrada') { b.ent += l.valor; if (l.status === 'pago') b.entPago += l.valor; }
    else { b.sai += l.valor; if (l.status === 'pago') b.saiPago += l.valor; }
  }
  return m;
}

function serieMensal(fim, n) {
  const b = baldesMensais();
  return mesesEntre(addMeses(fim, -(n - 1)), fim).map((mes) => {
    const x = b.get(mes) || { ent: 0, entPago: 0, sai: 0, saiPago: 0 };
    return { mes, ent: x.ent, sai: x.sai, res: x.ent - x.sai };
  });
}

function totaisDoPeriodo(meses) {
  const set = new Set(meses);
  const r = { ent: 0, entPago: 0, sai: 0, saiPago: 0, porCat: { entrada: new Map(), saida: new Map() }, qtd: 0 };
  for (const l of DB.lancamentos) {
    if (l.tipo === 'transferencia' || !noEscopo(l) || !set.has(l.competencia)) continue;
    r.qtd++;
    const mapa = r.porCat[l.tipo];
    mapa.set(l.categoriaId || '', (mapa.get(l.categoriaId || '') || 0) + l.valor);
    if (l.tipo === 'entrada') { r.ent += l.valor; if (l.status === 'pago') r.entPago += l.valor; }
    else { r.sai += l.valor; if (l.status === 'pago') r.saiPago += l.valor; }
  }
  r.res = r.ent - r.sai;
  return r;
}

// Ranking de categorias no período, com a média dos períodos anteriores de mesmo tamanho.
function rankingCategorias(tipo, meses) {
  const atual = totaisDoPeriodo(meses).porCat[tipo];
  const n = meses.length;
  const ant = [1, 2, 3].map((k) => totaisDoPeriodo(meses.map((m) => addMeses(m, -n * k))).porCat[tipo]);
  const total = somar(Array.from(atual.values()), (v) => v);
  return Array.from(atual.entries()).map(([id, valor]) => {
    const media = somar(ant, (mp) => mp.get(id) || 0) / 3;
    return { id, nome: id ? nomeCategoria(id) : 'Sem categoria', cor: (categoriaPorId(id) || {}).cor ?? 7, valor, pct: total ? (valor / total) * 100 : 0, media };
  }).sort((a, b) => b.valor - a.valor);
}

// ---------- Cartão de crédito ----------
function faturaDaCompra(cartao, dataISO) {
  const dia = Number(dataISO.slice(8, 10));
  let mesFech = mesDe(dataISO);
  if (dia >= cartao.fechamento) mesFech = addMeses(mesFech, 1);
  return cartao.vencimento > cartao.fechamento ? mesFech : addMeses(mesFech, 1);
}
function datasFatura(cartao, mesFatura) {
  const mesFech = cartao.vencimento > cartao.fechamento ? mesFatura : addMeses(mesFatura, -1);
  return { fechamento: dataNoMes(mesFech, cartao.fechamento), vencimento: dataNoMes(mesFatura, cartao.vencimento) };
}
function faturaAtual(cartao) { return faturaDaCompra(cartao, hojeISO()); }

function faturasDoCartao(cartao) {
  const m = new Map();
  const balde = (mes) => {
    if (!m.has(mes)) m.set(mes, { mes, total: 0, pago: 0, itens: [], pagamentos: [], ...datasFatura(cartao, mes) });
    return m.get(mes);
  };
  for (const l of DB.lancamentos) {
    if (l.tipo !== 'transferencia' && l.contaId === cartao.id) {
      const b = balde(l.fatura || faturaDaCompra(cartao, l.data));
      b.total += l.tipo === 'saida' ? l.valor : -l.valor;
      b.itens.push(l);
    } else if (l.tipo === 'transferencia' && l.contaDestinoId === cartao.id && l.status === 'pago') {
      const b = balde(l.fatura || mesDe(l.data));
      b.pago += l.valor; b.pagamentos.push(l);
    } else if (l.tipo === 'transferencia' && l.contaId === cartao.id) {
      const b = balde(l.fatura || faturaDaCompra(cartao, l.data));
      b.total += l.valor; b.itens.push(l);
    }
  }
  const hoje = hojeISO();
  for (const b of m.values()) {
    b.restante = b.total - b.pago;
    if (b.total <= 0 && b.pago === 0) b.status = 'vazia';
    else if (b.restante <= 0) b.status = 'paga';
    else if (hoje > b.vencimento) b.status = 'vencida';
    else if (hoje >= b.fechamento) b.status = 'fechada';
    else b.status = 'aberta';
  }
  return Array.from(m.values()).sort((a, b) => (a.mes < b.mes ? -1 : 1));
}
const ROTULO_FATURA = { aberta: 'Aberta', fechada: 'Fechada', paga: 'Paga', vencida: 'Vencida', vazia: 'Sem gastos' };

// Quanto do limite está comprometido (inclui parcelas futuras).
// Limite compartilhado: o cartão "dono" do limite e os que apontam para ele (limiteCom) usam o mesmo limite;
// "usado" soma todos; "devido" é só o deste cartão.
function grupoDeLimite(cartao) {
  const dono = cartao.limiteCom ? contaPorId(cartao.limiteCom) : cartao;
  if (!dono || dono.tipo !== 'cartao') return { dono: cartao, membros: [cartao] };
  const membros = DB.contas.filter((c) => c.tipo === 'cartao' && !c.arquivada && (c.id === dono.id || c.limiteCom === dono.id));
  return { dono, membros: membros.length ? membros : [cartao] };
}
function usoDoCartao(cartao) {
  const devido = -saldoConta(cartao);
  const g = grupoDeLimite(cartao);
  const usado = g.membros.length > 1 ? somar(g.membros, (c) => -saldoConta(c)) : devido;
  const limite = g.dono.limite || 0;
  return { devido, usado, limite, disponivel: limite ? limite - usado : null, compartilhado: g.membros.length > 1 ? g.membros.filter((c) => c.id !== cartao.id) : [] };
}

// ---------- Pendências: a pagar, a receber e faturas ----------
function pendencias(diasAdiante) {
  const hoje = hojeISO(); const lim = addDias(hoje, diasAdiante);
  const r = [];
  for (const l of DB.lancamentos) {
    if (l.status !== 'pendente' || !noEscopo(l) || ehCartao(l.contaId) || l.data > lim || origemPendente(l)) continue;
    r.push({ tipo: l.tipo, data: l.data, valor: l.valor, titulo: l.descricao || nomeCategoria(l.categoriaId), sub: nomeConta(l.contaId), atrasado: l.data < hoje, lanc: l });
  }
  for (const c of contasDoEscopo(false).filter((x) => x.tipo === 'cartao')) {
    for (const f of faturasDoCartao(c)) {
      if (f.restante > 0 && f.vencimento <= lim && f.status !== 'aberta') {
        r.push({ tipo: 'fatura', data: f.vencimento, valor: f.restante, titulo: 'Fatura ' + c.nome, sub: capitalizar(nomeMes(f.mes)), atrasado: f.vencimento < hoje, cartao: c, fatura: f });
      }
    }
  }
  return r.sort((a, b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : 0));
}

// ---------- Evolução e projeção do saldo disponível ----------
function evolucaoSaldo(fim, n) {
  return mesesEntre(addMeses(fim, -(n - 1)), fim).map((mes) => {
    const ultimo = dataNoMes(mes, 31);
    const ate = ultimo > hojeISO() ? hojeISO() : ultimo;
    return { mes, saldo: saldoDisponivel(ate) };
  });
}

function projecaoSaldo(meses) {
  const hoje = hojeISO(); const mes0 = mesAtual();
  let saldo = saldoDisponivel();
  const cartoes = contasDoEscopo(false).filter((c) => c.tipo === 'cartao');
  const fat = cartoes.flatMap((c) => faturasDoCartao(c));
  const r = [];
  for (let i = 0; i <= meses; i++) {
    const mes = addMeses(mes0, i);
    for (const l of DB.lancamentos) {
      if (l.status !== 'pendente' || !noEscopo(l) || ehCartao(l.contaId)) continue;
      const m = mesDe(l.data);
      if (m === mes || (i === 0 && m < mes0)) {
        // transferência pendente não entra: entre contas não muda o total, e a de cartão já está na fatura
        if (l.tipo === 'entrada') saldo += l.valor;
        else if (l.tipo === 'saida') saldo -= l.valor;
      }
    }
    for (const f of fat) {
      const m = mesDe(f.vencimento);
      if (f.restante > 0 && (m === mes || (i === 0 && m < mes0))) saldo -= f.restante;
    }
    r.push({ mes, saldo, projetado: true });
  }
  return r;
}

// Quantos meses de gastos o saldo disponível cobre (média das saídas dos 3 meses anteriores).
function mesesDeReserva() {
  const s = serieMensal(addMeses(mesAtual(), -1), 3);
  const media = somar(s, (x) => x.sai) / 3;
  if (media <= 0) return null;
  return saldoDisponivel() / media;
}

function sugestoesPessoas(tipo) {
  const cont = new Map();
  for (const l of DB.lancamentos) if (l.pessoa && (!tipo || l.tipo === tipo)) cont.set(l.pessoa, (cont.get(l.pessoa) || 0) + 1);
  return Array.from(cont.entries()).sort((a, b) => b[1] - a[1]).slice(0, 200).map((x) => x[0]);
}
function sugestoesDescricoes(tipo) {
  const vistos = new Map();
  for (let i = DB.lancamentos.length - 1; i >= 0; i--) {
    const l = DB.lancamentos[i];
    if (l.tipo !== tipo || !l.descricao || vistos.has(l.descricao)) continue;
    vistos.set(l.descricao, l);
    if (vistos.size >= 300) break;
  }
  return vistos;
}

// ===================== 06 - Gráficos (SVG feito à mão, sem biblioteca de terceiros) =====================
// Regras de desenho: marcas finas, cantos de 4px só na ponta de dado, grade de 1px discreta,
// legenda sempre que houver 2+ séries, dica (tooltip) ao passar o mouse e tabela equivalente.

let TIP = null;
function iniciarTooltip() {
  TIP = el('div', { class: 'tooltip', role: 'tooltip', 'aria-hidden': 'true' });
  document.body.appendChild(TIP);
}
// linhas: [{ rotulo, valor, cor, forma: 'linha'|'barra' }]
function mostrarTip(x, y, titulo, linhas) {
  limpar(TIP);
  TIP.appendChild(el('div', { class: 'tip-titulo', text: titulo }));
  for (const l of linhas) {
    TIP.appendChild(el('div', { class: 'tip-linha' },
      el('span', { class: ['tip-chave', l.forma === 'barra' ? 'barra' : ''], style: { background: l.cor } }),
      el('strong', { class: 'valor', text: l.valor }),
      el('span', { class: 'tip-rotulo', text: l.rotulo })));
  }
  TIP.classList.add('visivel');
  const r = TIP.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > window.innerWidth - 8) left = x - r.width - 14;
  if (top + r.height > window.innerHeight - 8) top = y - r.height - 14;
  TIP.style.left = Math.max(8, left) + 'px';
  TIP.style.top = Math.max(8, top) + 'px';
}
function esconderTip() { if (TIP) TIP.classList.remove('visivel'); }
function tipNoElemento(alvo, titulo, linhas) { const r = alvo.getBoundingClientRect(); mostrarTip(r.left + r.width / 2, r.top, titulo, linhas); }

// Redesenha quando a largura do contêiner muda.
function montarGrafico(cont, desenhar) {
  let larguraAnterior = 0;
  const ro = new ResizeObserver(() => requestAnimationFrame(() => {
    const w = Math.floor(cont.clientWidth);
    if (w > 0 && Math.abs(w - larguraAnterior) > 2) { larguraAnterior = w; limpar(cont); desenhar(w); }
  }));
  ro.observe(cont);
  return ro;
}

function escalaBonita(min, max, n = 4) {
  if (min === max) { if (max === 0) max = 10000; else if (max > 0) min = 0; else max = 0; }
  const bruto = (max - min) / n;
  const mag = Math.pow(10, Math.floor(Math.log10(bruto)));
  const r = bruto / mag;
  const passo = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / passo) * passo, hi = Math.ceil(max / passo) * passo;
  const ticks = [];
  for (let v = lo; v <= hi + passo / 2; v += passo) ticks.push(Math.round(v));
  return { lo, hi, ticks };
}

// Coluna com ponta arredondada (4px) e base reta.
function caminhoBarra(x, yBase, yTopo, w, r = 4) {
  const h = Math.abs(yBase - yTopo);
  if (h < 0.5) return '';
  const rr = Math.min(r, h, w / 2);
  if (yTopo < yBase) {
    return `M${x},${yBase}V${yTopo + rr}Q${x},${yTopo} ${x + rr},${yTopo}H${x + w - rr}Q${x + w},${yTopo} ${x + w},${yTopo + rr}V${yBase}Z`;
  }
  return `M${x},${yBase}V${yTopo - rr}Q${x},${yTopo} ${x + rr},${yTopo}H${x + w - rr}Q${x + w},${yTopo} ${x + w},${yTopo - rr}V${yBase}Z`;
}

function legenda(itens) {
  return el('div', { class: 'legenda' }, itens.map((i) =>
    el('span', { class: 'legenda-item' }, el('span', { class: ['legenda-chave', i.forma || 'barra'], style: { background: i.cor } }), i.rotulo)));
}

// ---------- Colunas: Entradas x Saídas por mês, com linha do resultado ----------
function graficoMensal(cont, dados, { destaque, aoClicar }) {
  return montarGrafico(cont, (W) => {
    const H = 250, m = { t: 12, r: 8, b: 26, l: 64 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const vals = dados.flatMap((d) => [d.ent, d.sai, d.res]);
    const esc = escalaBonita(Math.min(0, ...vals), Math.max(0, ...vals));
    const y = (v) => m.t + ph - ((v - esc.lo) / (esc.hi - esc.lo)) * ph;
    const banda = pw / dados.length;
    const bw = Math.max(3, Math.min(24, (banda - 10) / 2));
    const svg = sv('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: 'grafico', role: 'img', 'aria-label': 'Entradas e saídas por mês' });
    for (const t of esc.ticks) {
      svg.appendChild(sv('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), class: t === 0 ? 'eixo' : 'grade' }));
      svg.appendChild(sv('text', { x: m.l - 8, y: y(t) + 4, class: 'rotulo-eixo rotulo-valor', 'text-anchor': 'end', text: moedaCurta(t) }));
    }
    const pular = banda < 34 ? 2 : 1;
    const pontos = [];
    dados.forEach((d, i) => {
      const x0 = m.l + i * banda, cx = x0 + banda / 2;
      const sel = destaque && destaque.has(d.mes);
      if (sel) svg.appendChild(sv('rect', { x: x0 + 1, y: m.t, width: banda - 2, height: ph, rx: 6, class: 'banda-destaque' }));
      svg.appendChild(sv('path', { d: caminhoBarra(cx - bw - 1, y(0), y(d.ent), bw), class: 'marca-entrada' }));
      svg.appendChild(sv('path', { d: caminhoBarra(cx + 1, y(0), y(d.sai), bw), class: 'marca-saida' }));
      pontos.push([cx, y(d.res)]);
      if (i === dados.length - 1 || (i % pular === 0 && dados.length - 1 - i >= pular)) {
        const [ano, mes] = d.mes.split('-');
        const txt = MESES_CURTOS[Number(mes) - 1] + (mes === '01' || i === 0 ? '/' + ano.slice(2) : '');
        svg.appendChild(sv('text', { x: cx, y: H - 8, class: ['rotulo-eixo', sel ? 'forte' : ''].join(' '), 'text-anchor': 'middle', text: txt }));
      }
    });
    svg.appendChild(sv('path', { d: 'M' + pontos.map((p) => p.join(',')).join('L'), class: 'linha-resultado' }));
    for (const [px, py] of pontos) svg.appendChild(sv('circle', { cx: px, cy: py, r: 4, class: 'ponto-resultado' }));
    // camada de interação: uma faixa inteira por mês (alvo maior que a marca)
    dados.forEach((d, i) => {
      const x0 = m.l + i * banda;
      const hover = sv('rect', { x: x0, y: m.t, width: banda, height: ph, class: 'alvo', tabindex: 0, 'aria-label': nomeMes(d.mes) });
      const linhas = () => [
        { rotulo: 'Entradas', valor: moeda(d.ent), cor: 'var(--entrada)', forma: 'barra' },
        { rotulo: 'Saídas', valor: moeda(d.sai), cor: 'var(--saida)', forma: 'barra' },
        { rotulo: d.res >= 0 ? 'Sobrou' : 'Faltou', valor: moeda(Math.abs(d.res)), cor: 'var(--resultado)', forma: 'linha' },
      ];
      hover.addEventListener('pointermove', (e) => { hover.classList.add('ativo'); mostrarTip(e.clientX, e.clientY, capitalizar(nomeMes(d.mes)), linhas()); });
      hover.addEventListener('pointerleave', () => { hover.classList.remove('ativo'); esconderTip(); });
      hover.addEventListener('focus', () => tipNoElemento(hover, capitalizar(nomeMes(d.mes)), linhas()));
      hover.addEventListener('blur', esconderTip);
      if (aoClicar) {
        hover.addEventListener('click', () => { esconderTip(); aoClicar(d.mes); });
        hover.addEventListener('keydown', (e) => { if (e.key === 'Enter') aoClicar(d.mes); });
      }
      svg.appendChild(hover);
    });
    cont.appendChild(svg);
  });
}

// ---------- Linha com área: evolução do saldo (+ projeção tracejada) ----------
function graficoSaldo(cont, pontos) {
  return montarGrafico(cont, (W) => {
    const H = 220, m = { t: 16, r: 16, b: 26, l: 64 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const vals = pontos.map((p) => p.saldo);
    const esc = escalaBonita(Math.min(0, ...vals), Math.max(0, ...vals));
    const x = (i) => m.l + (pontos.length === 1 ? pw / 2 : (i / (pontos.length - 1)) * pw);
    const y = (v) => m.t + ph - ((v - esc.lo) / (esc.hi - esc.lo)) * ph;
    const svg = sv('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: 'grafico', role: 'img', 'aria-label': 'Evolução do saldo' });
    for (const t of esc.ticks) {
      svg.appendChild(sv('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), class: t === 0 ? 'eixo' : 'grade' }));
      svg.appendChild(sv('text', { x: m.l - 8, y: y(t) + 4, class: 'rotulo-eixo rotulo-valor', 'text-anchor': 'end', text: moedaCurta(t) }));
    }
    const reais = pontos.map((p, i) => [x(i), y(p.saldo), p]).filter((q) => !q[2].projetado);
    const proj = pontos.map((p, i) => [x(i), y(p.saldo), p]).filter((q) => q[2].projetado);
    if (reais.length) {
      const d = 'M' + reais.map((q) => q[0] + ',' + q[1]).join('L');
      svg.appendChild(sv('path', { d: d + `L${reais[reais.length - 1][0]},${y(Math.max(esc.lo, 0))}L${reais[0][0]},${y(Math.max(esc.lo, 0))}Z`, class: 'area-saldo' }));
      svg.appendChild(sv('path', { d, class: 'linha-saldo' }));
    }
    if (proj.length) {
      const inicio = reais.length ? [reais[reais.length - 1]] : [];
      svg.appendChild(sv('path', { d: 'M' + inicio.concat(proj).map((q) => q[0] + ',' + q[1]).join('L'), class: 'linha-projecao' }));
    }
    const pular = pw / pontos.length < 34 ? 2 : 1;
    pontos.forEach((p, i) => {
      if (i !== pontos.length - 1 && (i % pular !== 0 || pontos.length - 1 - i < pular)) return;
      const [ano, mes] = p.mes.split('-');
      svg.appendChild(sv('text', { x: x(i), y: H - 8, class: 'rotulo-eixo', 'text-anchor': 'middle', text: MESES_CURTOS[Number(mes) - 1] + (mes === '01' || i === 0 ? '/' + ano.slice(2) : '') }));
    });
    if (reais.length) {
      const [lx, ly, lp] = reais[reais.length - 1];
      svg.appendChild(sv('circle', { cx: lx, cy: ly, r: 4, class: 'ponto-saldo' }));
      svg.appendChild(sv('text', { x: Math.min(lx, W - m.r - 4), y: ly - 10, class: 'rotulo-dado', 'text-anchor': lx > W - 90 ? 'end' : 'middle', text: moedaCurta(lp.saldo) }));
    }
    // cursor vertical que procura o mês mais próximo
    const cursor = sv('line', { x1: 0, x2: 0, y1: m.t, y2: m.t + ph, class: 'cursor', visibility: 'hidden' });
    const marca = sv('circle', { r: 5, class: 'ponto-saldo', visibility: 'hidden' });
    svg.appendChild(cursor); svg.appendChild(marca);
    const alvo = sv('rect', { x: m.l - 10, y: m.t, width: pw + 20, height: ph, class: 'alvo-invisivel' });
    alvo.addEventListener('pointermove', (e) => {
      const r = svg.getBoundingClientRect();
      const px = e.clientX - r.left;
      let i = pontos.length === 1 ? 0 : Math.round(((px - m.l) / pw) * (pontos.length - 1));
      i = clamp(i, 0, pontos.length - 1);
      const p = pontos[i];
      cursor.setAttribute('x1', x(i)); cursor.setAttribute('x2', x(i)); cursor.setAttribute('visibility', 'visible');
      marca.setAttribute('cx', x(i)); marca.setAttribute('cy', y(p.saldo)); marca.setAttribute('visibility', 'visible');
      mostrarTip(e.clientX, e.clientY, capitalizar(nomeMes(p.mes)) + (p.projetado ? ' (previsão)' : ''),
        [{ rotulo: p.projetado ? 'Saldo previsto no fim do mês' : 'Saldo no fim do mês', valor: moeda(p.saldo), cor: 'var(--resultado)', forma: 'linha' }]);
    });
    alvo.addEventListener('pointerleave', () => { cursor.setAttribute('visibility', 'hidden'); marca.setAttribute('visibility', 'hidden'); esconderTip(); });
    svg.appendChild(alvo);
    cont.appendChild(svg);
  });
}

// ---------- Rosca: parte do todo (até 6 fatias) ----------
function graficoRosca(cont, itens, { rotuloCentro }) {
  const total = somar(itens, (i) => i.valor);
  const tam = 180, R = 84, r = 58, cx = tam / 2, cy = tam / 2;
  const svg = sv('svg', { width: tam, height: tam, viewBox: `0 0 ${tam} ${tam}`, class: 'grafico rosca', role: 'img', 'aria-label': rotuloCentro });
  const centroV = sv('text', { x: cx, y: cy + 2, class: 'rosca-valor valor', 'text-anchor': 'middle', text: moedaCurta(total) });
  const centroR = sv('text', { x: cx, y: cy + 20, class: 'rosca-rotulo', 'text-anchor': 'middle', text: rotuloCentro });
  const resetar = () => { centroV.textContent = moedaCurta(total); centroR.textContent = rotuloCentro; };
  let a0 = -Math.PI / 2;
  const arco = (a1, a2, ro, ri) => {
    const g = a2 - a1 > Math.PI ? 1 : 0;
    const p = (a, rad) => `${cx + rad * Math.cos(a)},${cy + rad * Math.sin(a)}`;
    return `M${p(a1, ro)}A${ro},${ro} 0 ${g} 1 ${p(a2, ro)}L${p(a2, ri)}A${ri},${ri} 0 ${g} 0 ${p(a1, ri)}Z`;
  };
  for (const it of itens) {
    if (it.valor <= 0) continue;
    const ang = (it.valor / total) * Math.PI * 2;
    const a1 = a0, a2 = a0 + Math.min(ang, Math.PI * 2 - 0.0001);
    const fatia = sv('path', { d: arco(a1, a2, R, r), class: 'fatia', style: { fill: it.cor }, tabindex: 0 });
    const ativar = () => { fatia.setAttribute('d', arco(a1, a2, R + 4, r)); centroV.textContent = moedaCurta(it.valor); centroR.textContent = it.nome.length > 22 ? it.nome.slice(0, 21) + '…' : it.nome; };
    const desativar = () => { fatia.setAttribute('d', arco(a1, a2, R, r)); resetar(); esconderTip(); };
    fatia.addEventListener('pointermove', (e) => { ativar(); mostrarTip(e.clientX, e.clientY, it.nome, [{ rotulo: pct((it.valor / total) * 100) + ' do total', valor: moeda(it.valor), cor: it.cor, forma: 'barra' }]); });
    fatia.addEventListener('pointerleave', desativar);
    fatia.addEventListener('focus', ativar);
    fatia.addEventListener('blur', desativar);
    if (it.aoClicar) {
      fatia.addEventListener('click', () => { esconderTip(); it.aoClicar(); });
      fatia.addEventListener('keydown', (e) => { if (e.key === 'Enter') it.aoClicar(); });
    }
    svg.appendChild(fatia);
    a0 += ang;
  }
  svg.appendChild(centroV); svg.appendChild(centroR);
  const leg = el('ul', { class: 'rosca-legenda' }, itens.filter((i) => i.valor > 0).map((i) =>
    el('li', { class: i.aoClicar ? 'clicavel' : null, role: i.aoClicar ? 'button' : null, tabindex: i.aoClicar ? 0 : null, onclick: i.aoClicar || null },
      el('span', { class: 'legenda-chave barra', style: { background: i.cor } }),
      el('span', { class: 'rl-nome', text: i.nome }), el('span', { class: 'rl-valor valor', text: moeda(i.valor) }),
      el('span', { class: 'rl-pct', text: pct((i.valor / total) * 100) }))));
  cont.appendChild(el('div', { class: 'rosca-caixa' }, svg, leg));
}

// ---------- Barras horizontais (HTML): ranking de categorias ----------
function barrasCategorias(cont, itens, { classeCor, aoClicar, max = 8 }) {
  const mostrar = itens.slice(0, max);
  const resto = itens.slice(max);
  if (resto.length) mostrar.push({ id: null, nome: resto.length + ' outras categorias', valor: somar(resto, (i) => i.valor), pct: somar(resto, (i) => i.pct), media: somar(resto, (i) => i.media), outras: true });
  const maior = Math.max(1, ...mostrar.map((i) => i.valor));
  const lista = el('div', { class: 'barras-h' });
  for (const it of mostrar) {
    const var_ = it.media > 0 ? ((it.valor - it.media) / it.media) * 100 : null;
    const linha = el('button', { class: ['bh-linha', it.outras ? 'sem-clique' : ''], type: 'button', disabled: it.outras || !aoClicar },
      el('span', { class: 'bh-nome', text: it.nome.replace(/\s*\([^)]*\)\s*$/, '') }),
      el('span', { class: 'bh-trilho' }, el('span', { class: ['bh-barra', classeCor], style: { width: Math.max(1.5, (it.valor / maior) * 100) + '%' } })),
      el('span', { class: 'bh-valor valor', text: moeda(it.valor) }),
      el('span', { class: 'bh-pct', text: pct(it.pct) }));
    const linhasTip = [{ rotulo: pct(it.pct) + ' do total do período', valor: moeda(it.valor), cor: classeCor === 'cor-entrada' ? 'var(--entrada)' : 'var(--saida)', forma: 'barra' }];
    if (var_ != null) linhasTip.push({ rotulo: 'média dos 3 períodos anteriores (' + (var_ >= 0 ? '+' : '') + pct(var_) + ')', valor: moeda(Math.round(it.media)), cor: 'var(--tinta-3)', forma: 'linha' });
    linha.addEventListener('pointermove', (e) => mostrarTip(e.clientX, e.clientY, it.nome, linhasTip));
    linha.addEventListener('pointerleave', esconderTip);
    if (aoClicar && !it.outras) linha.addEventListener('click', () => { esconderTip(); aoClicar(it.id); });
    lista.appendChild(linha);
  }
  cont.appendChild(lista);
}

// ---------- Minigráfico de tendência para os cartões de números ----------
function minigrafico(valores, classe) {
  const W = 96, H = 28;
  const mn = Math.min(...valores), mx = Math.max(...valores);
  const x = (i) => 2 + (i / Math.max(1, valores.length - 1)) * (W - 8);
  const y = (v) => (mx === mn ? H / 2 : 3 + (1 - (v - mn) / (mx - mn)) * (H - 6));
  const d = 'M' + valores.map((v, i) => x(i) + ',' + y(v)).join('L');
  const n = valores.length - 1;
  return sv('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: 'mini', 'aria-hidden': 'true' },
    sv('path', { d, class: 'mini-linha' }),
    sv('circle', { cx: x(n), cy: y(valores[n]), r: 3, class: ['mini-ponto', classe].join(' ') }));
}

function tabelaDados(cabecalho, linhas) {
  return el('div', { class: 'tabela-rolagem' }, el('table', { class: 'tabela' },
    el('thead', null, el('tr', null, cabecalho.map((c, i) => el('th', { class: i ? 'num' : '', text: c })))),
    el('tbody', null, linhas.map((l) => el('tr', null, l.map((c, i) => el('td', { class: i ? 'num valor' : '', text: c })))))));
}

// ---------- Janela (dialog) ----------
function abrirModal({ titulo, subtitulo, corpo, rodape, largura, aoFechar, classe }) {
  const dlg = el('dialog', { class: ['modal', classe], style: largura ? { width: largura } : null, 'aria-label': titulo });
  const fechar = () => { if (dlg.open) dlg.close(); };
  dlg.addEventListener('close', () => { dlg.remove(); if (aoFechar) aoFechar(); });
  dlg.addEventListener('mousedown', (e) => { if (e.target === dlg) fechar(); });
  anexar(dlg, [
    el('header', { class: 'modal-topo' },
      el('div', null, el('h2', { text: titulo }), subtitulo ? el('p', { class: 'modal-sub', text: subtitulo }) : null),
      el('button', { class: 'botao-icone', type: 'button', 'aria-label': 'Fechar', onclick: fechar }, icone('fechar'))),
    el('div', { class: 'modal-corpo' }, corpo),
    rodape ? el('footer', { class: 'modal-rodape' }, rodape) : null,
  ]);
  document.body.appendChild(dlg);
  dlg.showModal();
  const foco = dlg.querySelector('[autofocus]') || dlg.querySelector('input, select, textarea, button.primario');
  if (foco) setTimeout(() => foco.focus(), 30);
  return { dlg, fechar };
}

function confirmar({ titulo, texto, botao = 'Confirmar', perigo = false, cancelar = 'Cancelar' }) {
  return new Promise((res) => {
    let ok = false;
    const m = abrirModal({
      titulo, largura: '440px', classe: 'modal-pequeno',
      corpo: el('p', { class: 'texto-confirmacao', text: texto }),
      rodape: [
        el('button', { class: 'botao', type: 'button', text: cancelar, onclick: () => m.fechar() }),
        el('button', { class: ['botao', perigo ? 'perigo' : 'primario'], type: 'button', text: botao, autofocus: true, onclick: () => { ok = true; m.fechar(); } }),
      ],
      aoFechar: () => res(ok),
    });
  });
}

function escolher({ titulo, texto, opcoes }) {
  return new Promise((res) => {
    let r = null;
    const m = abrirModal({
      titulo, largura: '460px', classe: 'modal-pequeno',
      corpo: [texto ? el('p', { class: 'texto-confirmacao', text: texto }) : null,
        el('div', { class: 'lista-opcoes' }, opcoes.map((o) => el('button', {
          class: ['botao', 'opcao', o.perigo ? 'perigo' : ''], type: 'button', onclick: () => { r = o.valor; m.fechar(); },
        }, el('strong', { text: o.rotulo }), o.detalhe ? el('span', { text: o.detalhe }) : null)))],
      aoFechar: () => res(r),
    });
  });
}

// ---------- Avisos rápidos ----------
function avisar(texto, tipo = 'ok', acao) {
  let area = $('#avisos');
  if (!area) { area = el('div', { id: 'avisos', 'aria-live': 'polite' }); document.body.appendChild(area); }
  const t = el('div', { class: ['aviso', tipo] }, el('span', { text: texto }),
    acao ? el('button', { class: 'aviso-acao', type: 'button', text: acao.rotulo, onclick: () => { acao.fn(); t.remove(); } }) : null);
  area.appendChild(t);
  setTimeout(() => t.classList.add('saindo'), acao ? 7000 : 3500);

// A pasta do cofre (ou o arquivo avulso antigo) pede autorização do Chrome a cada abertura.

}

async function reativarArquivo() {
  if (SESSAO.pasta) {
    SESSAO.pastaPermitida = await permissaoArquivo(SESSAO.pasta, true);
    if (SESSAO.pastaPermitida) await ativarPasta();
  } else if (SESSAO.arquivo) {
    SESSAO.arquivoPermitido = await permissaoArquivo(SESSAO.arquivo, true);
  }
  if (!SESSAO.arquivoPermitido) { avisar('O Chrome não liberou a gravação. Tente de novo ou escolha a pasta em Configurações › Backup e sincronização.', 'erro'); return; }
  await aposAutorizar();

}

// Depois de liberar a pasta: grava (juntando o que houver de outro aparelho) e busca os envios do celular.

// Computador: o celular grava no financas.cofre pelo Drive (sincronização automática). A cada 20 segundos,
// com a janela à vista, e sempre que se volta para ela, confere se o arquivo mudou; se mudou, junta sozinho
// (e só regrava se aqui houver algo que o arquivo ainda não tem).
let _vigiando = false;
async function vigiarArquivo(forcar) {
  if (MODO_CELULAR || _vigiando || !DB || !SESSAO.chave || !SESSAO.arquivo || !SESSAO.arquivoPermitido || _salvando) return;
  if (document.visibilityState !== 'visible' && forcar !== true) return;
  _vigiando = true;
  try {
    const f = await SESSAO.arquivo.getFile();
    if (f.lastModified === SESSAO.modArquivo) return;
    const env = await lerEnvelopeDoArquivo(SESSAO.arquivo);
    if (!env) return; // o Drive pode estar no meio da cópia: tenta de novo na próxima volta
    if (env.salvoEm === SESSAO.salvoNoArquivo) { SESSAO.modArquivo = f.lastModified; return; }
    await salvarAgora(); // gravarNoArquivoComSeguranca junta o que chegou e decide se precisa regravar
    if (SESSAO.pastaPermitida) await importarDoCelular(true);
  } catch (e) { console.warn('Vigia do arquivo:', e && e.message); } finally { _vigiando = false; }
}
function iniciarVigiaDoArquivo() {
  if (MODO_CELULAR) return;
  setInterval(vigiarArquivo, 20000);
  window.addEventListener('focus', () => setTimeout(vigiarArquivo, 300));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(vigiarArquivo, 300); });
}

// Computador: junta os cofres que o celular deixou em "do celular" e depois apaga esses arquivos.
async function importarDoCelular(silencioso) {
  if (!SESSAO.pasta || !SESSAO.pastaPermitida || !DB) return;
  let sub;
  try { sub = await subpastaCelular(SESSAO.pasta); } catch { if (!silencioso) avisar('Não consegui abrir a pasta "do celular".', 'erro'); return; }
  const arqs = await arquivosCofreNaPasta(sub);
  if (!Array.isArray(DB.config.importados)) DB.config.importados = [];
  let lidos = 0, novos = 0, atualizados = 0, outros = 0;
  const juntados = [];
  for (const a of arqs) {
    if (DB.config.importados.includes(a.chave)) { juntados.push(a); continue; }
    let env = null;
    try { env = JSON.parse(await a.arquivo.text()); } catch { env = null; }
    if (!envelopeValido(env)) continue;
    try {
      const r = await juntarEnvelope(env);
      lidos++; novos += r.novos; atualizados += r.atualizados;
      DB.config.importados = DB.config.importados.concat(a.chave).slice(-300);
      juntados.push(a);
    } catch (e) { if (e.outroCofre) outros++; else throw e; }
  }
  if (lidos) { mudou(); await descarregarGravacao(); }
  if (!_alteracoesPendentes) for (const a of juntados) { try { await sub.removeEntry(a.nome); } catch { /* fica para a próxima */ } }
  if (lidos) avisar(`Do celular: ${novos} ${novos === 1 ? 'item novo' : 'itens novos'} e ${atualizados} ${atualizados === 1 ? 'alterado' : 'alterados'}.`);
  else if (!silencioso) avisar(outros ? 'Os arquivos da pasta "do celular" são de outro cofre.' : 'Nada novo vindo do celular.');
}

// ---------- Bloqueio automático e manual ----------
let _ultimoUso = Date.now();
const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
async function descarregarGravacao() {

  if (_alteracoesPendentes) await salvarAgora();
  while (_salvando) await esperar(40);
}
async function bloquear() {

  DB = null; SESSAO.chave = null;

}
function iniciarBloqueioAutomatico() {
  const marcar = () => { _ultimoUso = Date.now(); };
  for (const ev of ['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart']) window.addEventListener(ev, marcar, { passive: true });
  setInterval(() => {
    if (SESSAO.chave && DB && Date.now() - _ultimoUso > DB.config.bloqueioMin * 60000) bloquear();
  }, 5000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && _alteracoesPendentes) salvarAgora(); });
  window.addEventListener('beforeunload', (e) => { if (_alteracoesPendentes || _salvando) { salvarAgora(); e.preventDefault(); e.returnValue = ''; } });

// Escolhe a pasta do cofre, grava nela (juntando se já houver um cofre dali) e busca os envios do celular.
async function ligarPasta() {

// ---------- Digital (só no celular): registro local, fora do cofre e fora do Drive ----------
const DIGITAL_DIAS_SENHA = 30; // uma vez por mês a senha é pedida, para não cair no esquecimento
const lerDigital = async () => { try { const r = await idbGet('digital'); return r && r.credId ? r : null; } catch { return null; } };
const apagarDigital = () => idbDel('digital').catch(() => {});
async function anotarSenhaDigitada() { const r = await lerDigital(); if (r) { r.ultimaSenha = agoraISO(); await idbSet('digital', r); } }
let _digitalTentada = false;

async function oferecerDigital(env, area, erro) {
  if (!MODO_CELULAR) return;
  const reg = await lerDigital();
  if (!reg) return;
  if (!reg.ultimaSenha || Date.now() - Date.parse(reg.ultimaSenha) > DIGITAL_DIAS_SENHA * 86400000) {
    area.prepend(el('p', { class: 'nota', text: 'A digital está ligada. Uma vez a cada ' + DIGITAL_DIAS_SENHA + ' dias o app pede a senha, para o senhor não esquecê-la.' }));
    return;
  }
  const bt = el('button', { class: 'botao primario grande', type: 'button' }, icone('digital', 20), ' Entrar com a digital');
  const tentar = async (automatico) => {
    bt.disabled = true; if (!automatico) erro.textContent = '';
    try {
      const chave = await abrirChavePelaDigital(reg);
      await abrirSessao(env, chave);
    } catch (e) {
      bt.disabled = false;
      if (e && (e.outroCofre || e.name === 'OperationError')) {
        await apagarDigital(); bt.remove();
        erro.textContent = 'A digital guardada não abre este cofre (ele foi trocado). Entre com a senha e ligue a digital de novo em Configurações.';
      } else if (!automatico) erro.textContent = e && e.name === 'NotAllowedError' ? 'Digital cancelada. Toque de novo ou use a senha.' : 'Não foi possível usar a digital. Entre com a senha.';
    }
  };
  bt.addEventListener('click', () => tentar(false));
  area.prepend(bt, el('p', { class: 'ou-senha', text: 'ou digite a senha' }));
  if (!_digitalTentada) { _digitalTentada = true; tentar(true); }
}

async function abrirSessao(env, chave, { entrar = true } = {}) {
  const bruto = await decifrarDados(chave, env.dados);
  DB = prepararDB(bruto);
  SESSAO.chave = chave; SESSAO.chaves = env.chaves; SESSAO.ultimoEnv = env;
  zerarTentativas();
  SESSAO.salvoNoArquivo = null;
  if (!MODO_CELULAR) {
    SESSAO.pasta = await pastaVinculada();
    SESSAO.pastaPermitida = SESSAO.pasta ? await permissaoArquivo(SESSAO.pasta, false) : false;
    if (SESSAO.pasta) {
      if (SESSAO.pastaPermitida) await ativarPasta(); else { SESSAO.arquivo = null; SESSAO.arquivoPermitido = false; }
    } else {
      SESSAO.arquivo = await arquivoVinculado(); // arquivo avulso da versão 1.0
      SESSAO.arquivoPermitido = SESSAO.arquivo ? await permissaoArquivo(SESSAO.arquivo, false) : false;
    }
  }
  await pedirArmazenamentoPersistente();
  if (!entrar) return;
  entrarNoApp();
  if (SESSAO.arquivoPermitido) aposAutorizar();
}

async function abrirArquivoDeCofre(envAtual, pronto) {

  if (!lido) { try { lido = await lerArquivoCofre(); } catch (e) { avisar(e.message, 'erro'); return; } }
  if (!lido) return;

    el('h1', { text: 'Abrir cofre' }),
    el('p', { class: 'acesso-texto', text: 'Arquivo: ' + lido.nome + (lido.env.salvoEm ? ' (salvo em ' + dataBR(isoData(new Date(lido.env.salvoEm))) + ')' : '') + '.' }),
    envAtual ? el('p', { class: 'alerta-texto', text: 'Atenção: este arquivo vai substituir o cofre que está neste navegador. O atual fica guardado nas cópias do dia.' }) : null,

  form.addEventListener('submit', async (e) => {

    botao.disabled = true; botao.textContent = 'Verificando…';
    let chave;
    try { chave = await abrirChave(lido.env.chaves, { tipo: 'senha', valor: s.inp.value }); } catch {
      registrarErroSenha(); botao.disabled = false; botao.textContent = 'Abrir'; erro.textContent = 'Senha incorreta para este cofre.'; return;
    }
    s.inp.value = '';
    try {
      if (envAtual) await idbSet('antes-de-abrir-arquivo', envAtual);
      await gravarCofreLocal(lido.env);
      await desvincularArquivo(); // arquivo avulso antigo deixa de valer; a pasta do Drive, se houver, continua
      await abrirSessao(lido.env, chave, { entrar: false });
      await salvarAgora();
      if (PASTA_DISPONIVEL && !SESSAO.pasta) { telaArquivoInicial(); return; }

  });
  telaAcesso(form);
}

// p: o período que a barra controla (padrão: o do app). comTudo: acrescenta a opção "Tudo" (Registro).
function barraPeriodo(aoMudar, p = ESTADO.periodo, comTudo = false) {
  if (!p.mes) p.mes = mesAtual();
  const tipos = [['mes', 'Mês'], ['3m', '3 meses'], ['6m', '6 meses'], ['12m', '12 meses'], ['ano', 'Ano']];
  if (comTudo) tipos.push(['tudo', 'Tudo']);
  const passo = p.tipo === 'ano' ? 12 : p.tipo === 'mes' ? 1 : { '3m': 3, '6m': 6, '12m': 12 }[p.tipo] || 1;
  const mover = (n) => { p.mes = addMeses(p.mes, n * passo); aoMudar(); };
  const navegador = p.tipo === 'tudo'
    ? el('div', { class: 'navegador-mes' }, el('strong', { class: 'periodo-rotulo', text: 'Todos os meses' }))
    : el('div', { class: 'navegador-mes' },
      el('button', { class: 'botao-icone', type: 'button', 'aria-label': 'Período anterior', onclick: () => mover(-1) }, icone('esquerda', 18)),
      el('strong', { class: 'periodo-rotulo', text: rotuloPeriodo(p) }),
      el('button', { class: 'botao-icone', type: 'button', 'aria-label': 'Próximo período', onclick: () => mover(1) }, icone('direita', 18)),
      p.mes !== mesAtual() ? el('button', { class: 'link-botao', type: 'button', text: 'Voltar para hoje', onclick: () => { p.mes = mesAtual(); aoMudar(); } }) : null);
  return el('div', { class: 'barra-filtros' }, navegador, alternador(tipos, p.tipo, (v) => { p.tipo = v; aoMudar(); }));
}

function variacao(atual, media, subirEhBom) {
  if (!media) return null;
  const v = ((atual - media) / media) * 100;
  if (Math.abs(v) < 1) return el('span', { class: 'delta neutro', text: 'igual à média' });
  const bom = subirEhBom ? v > 0 : v < 0;
  return el('span', { class: ['delta', bom ? 'bom' : 'ruim'] }, v > 0 ? '▲ ' : '▼ ', pct(Math.abs(v)) + ' vs. média de 3 meses');
}

    el('ul', { class: 'lista-simples' }, linhas.map(({ c, r }) => el('li', null, el('button', { class: 'ls-botao', type: 'button', onclick: () => { m.fechar(); abrirExtrato(c); } },

      el('span', { class: ['valor', r.saldo < 0 ? 'cor-texto-ruim' : ''], text: moeda(r.saldo) }))))),
    tot('inicial') === 0 ? el('p', { class: 'alerta-texto', text: 'Nenhuma conta tem saldo inicial informado, então o aplicativo começou do zero. Se o saldo está negativo, informe o saldo real de cada conta em Contas e cartões (lápis ao lado do nome).' }) : null);
  const m = abrirModal({ titulo: 'Como o saldo é calculado', largura: '620px', corpo });
}

function listaPendencias(itens, vazio, max = 7) {
  if (!itens.length) return el('p', { class: 'texto-suave', text: vazio });
  const receber = somar(itens.filter((p) => p.tipo === 'entrada'), (p) => p.valor);
  const pagar = somar(itens.filter((p) => p.tipo !== 'entrada'), (p) => p.valor);
  const caixa = el('div', { class: 'pend-caixa' },
    el('div', { class: 'pend-resumo' },
      el('span', null, 'A receber ', el('strong', { class: 'valor cor-texto-entrada', text: moeda(receber) })),
      el('span', null, 'A pagar ', el('strong', { class: 'valor', text: moeda(pagar) }))));
  const ul = el('ul', { class: 'lista-pend' });
  const pintar = (n) => {
    limpar(ul);
    for (const p of itens.slice(0, n)) ul.appendChild(itemPendencia(p));
    if (itens.length > n) ul.appendChild(el('li', { class: 'pend-mais' }, el('button', { class: 'link-botao', type: 'button', text: 'Ver todas (' + itens.length + ')', onclick: () => pintar(itens.length) })));
  };
  pintar(max);
  caixa.appendChild(ul);
  return caixa;
}

  {

    return el('li', { class: ['pend', p.atrasado ? 'atrasado' : ''] },

function observacoes(meses, tot) {
  const r = [];
  const n = meses.length;
  const ant = [1, 2, 3].map((k) => totaisDoPeriodo(meses.map((m) => addMeses(m, -n * k))));
  const mediaSai = somar(ant, (t) => t.sai) / 3;
  if (tot.ent || tot.sai) {
    if (tot.res >= 0) r.push(['bom', `Sobraram ${moeda(tot.res)} no período` + (tot.ent ? ` (${pct((tot.res / tot.ent) * 100)} das entradas).` : '.')]);
    else r.push(['ruim', `As saídas superaram as entradas em ${moeda(-tot.res)} no período.`]);
  }
  if (mediaSai > 0 && tot.sai > mediaSai * 1.1) r.push(['ruim', `As saídas estão ${pct(((tot.sai - mediaSai) / mediaSai) * 100)} acima da média dos 3 períodos anteriores.`]);
  else if (mediaSai > 0 && tot.sai < mediaSai * 0.9) r.push(['bom', `As saídas estão ${pct(((mediaSai - tot.sai) / mediaSai) * 100)} abaixo da média dos 3 períodos anteriores.`]);
  const subiu = rankingCategorias('saida', meses).filter((c) => c.media > 0 && c.valor > c.media * 1.3 && c.valor - c.media > 10000).slice(0, 2);
  for (const c of subiu) r.push(['atencao', `${c.nome}: ${moeda(c.valor)}, ${pct(((c.valor - c.media) / c.media) * 100)} acima da média.`]);
  const reserva = mesesDeReserva();
  if (reserva != null && reserva >= 0) r.push([reserva >= 6 ? 'bom' : reserva >= 3 ? 'neutro' : 'atencao', `O saldo em contas cobre ${_fmtPct.format(reserva)} ${reserva >= 0.95 && reserva < 1.05 ? 'mês' : 'meses'} dos seus gastos médios.`]);
  const atras = pendencias(0).filter((p) => p.atrasado);
  if (atras.length) r.push(['ruim', `${atras.length} ${atras.length === 1 ? 'item atrasado' : 'itens atrasados'} somando ${moeda(somar(atras, (p) => p.valor))}.`]);
  const ult = DB.config.ultimoBackup;
  if (!MODO_CELULAR && !SESSAO.arquivo && (!ult || diffDias(ult.slice(0, 10), hojeISO()) > 7)) r.push(['atencao', 'Faz mais de uma semana sem backup e a gravação no Drive não está ligada. Veja em Configurações › Backup e sincronização.']);
  return r;
}

TELAS.painel = (cont) => {
  const meses = mesesDoPeriodo();

      el('span', { text: 'O Chrome pede autorização para gravar no Drive e receber o que veio do celular.' }),
      el('button', { class: 'botao pequeno primario', type: 'button', text: 'Autorizar', onclick: reativarArquivo })));
  }
  if (DB.config.boasVindas) cont.appendChild(primeirosPassos());

  // Números principais
  const reserva = mesesDeReserva();
  const heroi = el('div', { class: 'tile heroi clicavel', role: 'button', tabindex: 0, title: 'Abrir Contas e cartões', onclick: () => irPara('contas'), onkeydown: (e) => { if (e.key === 'Enter') irPara('contas'); } },

    el('div', { class: 'tile-sub' },
      cartoes.length ? el('span', { class: 'valor', text: faturasMes.total
        ? 'Cartões: ' + moeda(faturasMes.total) + ' na fatura que vence em ' + nomeMes(fimSerie).split(' de ')[0]
        : (() => {

          return 'Cartões: nada a pagar em ' + nomeMes(fimSerie).split(' de ')[0] + (prox && fimSerie === mesAtual() ? ' · próxima fatura ' + moeda(prox.restante) + ', vence ' + dataBR(prox.vencimento) : '');
        })() }) : null,
      reserva != null ? el('span', { text: 'Cobre ' + _fmtPct.format(Math.max(0, reserva)) + ' meses de gastos' }) : null,
      el('button', { class: 'link-botao', type: 'button', text: 'Como é calculado?', onclick: (e) => { e.stopPropagation(); abrirComposicaoSaldo(); } })));
  const irLista = (tipo) => () => { ESTADO.visao[tipo] = 'periodo'; irPara(tipo === 'entrada' ? 'entradas' : 'saidas'); };
  cont.appendChild(el('div', { class: 'grade-tiles' },
    heroi,
    tileNumero({ rotulo: 'Entradas', icone: 'entrada', classe: 'entrada', valor: moeda(tot.ent), sub: `${moeda(tot.entPago)} recebido · ${moeda(tot.ent - tot.entPago)} a receber`, delta: variacao(tot.ent, media((t) => t.ent), true), serie: serie.map((s) => s.ent), aoClicar: irLista('entrada'), dica: 'Abrir Entradas' }),

    tileNumero({ rotulo: tot.res >= 0 ? 'Sobrou' : 'Faltou', icone: 'grafico', classe: 'resultado', valor: moeda(Math.abs(tot.res)), sub: tot.ent ? `${pct((tot.res / tot.ent) * 100)} das entradas` : 'sem entradas no período', serie: serie.map((s) => s.res),
      aoClicar: () => abrirRegistro({ tipo: 'todos', origem: { aba: 'painel', rotulo: 'o Painel' } }), dica: 'Ver todos os lançamentos do período no registro' })));

  // Entradas x saídas por mês
  const destaque = new Set(meses);
  cont.appendChild(cartaoGrafico('Entradas e saídas por mês', '12 meses até ' + nomeMes(fimSerie) + '. Clique num mês para ver o detalhe.',
    (corpo) => {
      corpo.appendChild(legenda([{ rotulo: 'Entradas', cor: 'var(--entrada)' }, { rotulo: 'Saídas', cor: 'var(--saida)' }, { rotulo: 'Resultado (sobra ou falta)', cor: 'var(--resultado)', forma: 'linha' }]));
      const g = el('div', { class: 'grafico-caixa' }); corpo.appendChild(g);
      graficoMensal(g, serie, { destaque, aoClicar: (mes) => { ESTADO.periodo = { tipo: 'mes', mes }; renderizar(); } });
    },
    () => [['Mês', 'Entradas', 'Saídas', 'Resultado'], serie.map((s) => [capitalizar(nomeMes(s.mes)), moeda(s.ent), moeda(s.sai), moeda(s.res)])]));

  // Categorias de saída + pendências
  const rkSai = rankingCategorias('saida', meses);
  const pend = pendencias(30);
  cont.appendChild(el('div', { class: 'grade-2' },

      },
      () => [['Categoria', 'Valor', '% do total', 'Média anterior'], rkSai.map((c) => [c.nome, moeda(c.valor), pct(c.pct), moeda(Math.round(c.media))])]),
    cartao('Contas a pagar e a receber', 'Atrasadas e próximos 30 dias',

  const proj = projecaoSaldo(3).slice(1);
  const pontos = evol.concat(proj);
  const contasPos = contasDoEscopo(false).filter((c) => c.tipo !== 'cartao').map((c) => ({ c, s: saldoConta(c) })).filter((x) => x.s > 0).sort((a, b) => b.s - a.s);
  const fatias = contasPos.slice(0, 5).map((x) => ({ nome: x.c.nome, valor: x.s, cor: `var(--s${x.c.cor + 1})`, aoClicar: () => abrirExtrato(x.c) }));
  if (contasPos.length > 5) fatias.push({ nome: 'Outras contas', valor: somar(contasPos.slice(5), (x) => x.s), cor: 'var(--tinta-3)' });
  cont.appendChild(el('div', { class: 'grade-2' },
    cartaoGrafico('Evolução do saldo em contas', 'Fim de cada mês, com previsão para os próximos 3 (linha tracejada)',

        corpo.appendChild(legenda([{ rotulo: 'Saldo', cor: 'var(--resultado)', forma: 'linha' }, { rotulo: 'Previsão', cor: 'var(--resultado)', forma: 'tracejada' }]));
        const g = el('div', { class: 'grafico-caixa' }); corpo.appendChild(g); graficoSaldo(g, pontos);
      },

function cartaoPessoalEscritorio(meses) {
  const set = new Set(meses);
  const t = { P: { ent: 0, sai: 0 }, E: { ent: 0, sai: 0 } };
  for (const l of DB.lancamentos) {
    if (l.tipo === 'transferencia' || !set.has(l.competencia)) continue;
    if (l.tipo === 'entrada') t[l.escopo].ent += l.valor; else t[l.escopo].sai += l.valor;
  }
  const maior = Math.max(1, t.P.ent, t.P.sai, t.E.ent, t.E.sai);
  const linha = (rotulo, v, cls) => el('div', { class: 'pe-linha' }, el('span', { class: 'pe-rotulo', text: rotulo }),
    el('span', { class: 'bh-trilho' }, el('span', { class: ['bh-barra', cls], style: { width: Math.max(1, (v / maior) * 100) + '%' } })),
    el('span', { class: 'valor', text: moeda(v) }));
  const bloco = (k) => el('div', { class: 'pe-bloco clicavel', role: 'button', tabindex: 0, title: 'Mostrar só ' + ESCOPOS[k].toLowerCase(),
    onclick: () => { DB.config.escopo = k; mudou(); }, onkeydown: (e) => { if (e.key === 'Enter') { DB.config.escopo = k; mudou(); } } },
  el('h4', { text: ESCOPOS[k] }), linha('Entradas', t[k].ent, 'cor-entrada'), linha('Saídas', t[k].sai, 'cor-saida'),
  el('div', { class: 'pe-res' }, el('span', { text: t[k].ent - t[k].sai >= 0 ? 'Sobrou' : 'Faltou' }), el('strong', { class: 'valor', text: moeda(Math.abs(t[k].ent - t[k].sai)) })));
  return cartao('Pessoal x escritório', rotuloPeriodo() + ' · clique para ver só um deles', el('div', { class: 'cartao-corpo pe' }, bloco('P'), bloco('E')));
}

// Pessoal e escritório misturados: quem pagou o quê de quem, e o acerto entre os dois.
function cartaoMisturas(meses) {
  const r = misturas(meses);
  if (!r.itens.length) return null;
  const linha = (rot, v) => (v ? el('li', null, el('span', { text: rot }), el('strong', { class: 'valor', text: moeda(v) })) : null);
  const acerto = r.escritorioDeve === 0 ? 'Pessoal e escritório estão quites no período.'
    : r.escritorioDeve > 0 ? 'Acerto: o escritório deve ' + moeda(r.escritorioDeve) + ' ao pessoal.'
      : 'Acerto: o pessoal deve ' + moeda(-r.escritorioDeve) + ' ao escritório.';
  return cartao('Pessoal e escritório misturados', r.itens.length + (r.itens.length === 1 ? ' lançamento feito' : ' lançamentos feitos') + ' com a conta do outro · ' + rotuloPeriodo().toLowerCase(),
    el('div', { class: 'cartao-corpo' },
      el('ul', { class: 'lista-mistura' },
        linha('Contas pessoais pagaram despesas do escritório', r.pPagouE),
        linha('Contas do escritório pagaram despesas pessoais', r.ePagouP),
        linha('Receitas do escritório que caíram em conta pessoal', r.eEntrouP),
        linha('Receitas pessoais que caíram em conta do escritório', r.pEntrouE)),
      el('p', { class: 'acerto', text: acerto }),
      el('div', { class: 'botoes-linha rodape-cartao' },
        el('button', { class: 'link-botao', type: 'button', text: 'Ver as saídas misturadas', onclick: () => { ESTADO.filtros.saida = { status: 'misturado' }; ESTADO.visao.saida = 'periodo'; irPara('saidas'); } }),
        el('button', { class: 'link-botao', type: 'button', text: 'Ver as entradas misturadas', onclick: () => { ESTADO.filtros.entrada = { status: 'misturado' }; ESTADO.visao.entrada = 'periodo'; irPara('entradas'); } }))));
}

function cartaoMaioresGastos(meses) {
  const set = new Set(meses);
  const itens = DB.lancamentos.filter((l) => l.tipo === 'saida' && noEscopo(l) && set.has(l.competencia)).sort((a, b) => b.valor - a.valor).slice(0, 6);
  return cartao('Maiores gastos', rotuloPeriodo(), el('div', { class: 'cartao-corpo' }, itens.length ? el('ul', { class: 'lista-simples' }, itens.map((l) =>
    el('li', null, el('button', { class: 'ls-botao', type: 'button', onclick: () => abrirFormLancamento({ lanc: l }) },
      el('span', { class: 'ponto-cor', style: { background: `var(--s${((categoriaPorId(l.categoriaId) || {}).cor ?? 7) + 1})` } }),
